  longNight(e, ph) {
    const p = S.player;
    S.night = {
      t: 0, dur: 2.9, x: e.x, y: e.y,
      ang: Math.atan2(p.y - e.y, p.x - e.x),
      arc: 1.05, len: 900, e: e, ph: ph, next: .75,
    };
    addShroud(e.x, e.y, 190, 3.2);
    S.shake = Math.min(18, S.shake + 9);
    S.flash = Math.max(S.flash, .3);
    SFX.alarm();
  },

  /* 虚空之影「虚空涡流」（0.41.0 中招）：以它为中心的超大吸引场。
     不是小黑洞那种脚下小打小闹——大半张屏幕都在往它那儿流，
     越靠近拽得越紧，吸进内圈（165px）就是实打实的伤害。
     拉不回来的死线在 220px 左右：被吸过这条线就真游不出去了。 */
  voidVortex(e, ph) {
    const h = addHazard('void', e.x, e.y, {
      r: 165, dps: 30, color: '#a97bff', life: 3.8, warm: 1.0, grow: 0,
    });
    h.pull = 300; h.pullR = 760;   /* 大半径吸引：pullR 独立于伤害圈（0.41.0） */
    addRing(e.x, e.y, '#c37bff', 60, 920, .7);
    addRing(e.x, e.y, '#a97bff', 170, -90, .9);
    S.shake = Math.min(18, S.shake + 8);
    S.flash = Math.max(S.flash, .25);
    SFX.alarm();
  },

  /* 虚空之影「永夜之轮」（0.41.0 真大招）：五道长夜之光按等弧长射满一圆周，
     像单车车轮一样顺时针旋转——被遮挡与被照耀的区域随之轮转；
     转着转着，五道虚空凝视从光缝里亮起，逆着车轮的方向反着扫。
     白昼与黑夜对转，玩家只能贴着光缝走位。 */
  voidWheel(e, ph) {
    const p = S.player;
    S.night = {
      t: 0, dur: 6.2, x: e.x, y: e.y,
      ang: Math.atan2(p.y - e.y, p.x - e.x),
      len: 1100, e: e, ph: ph, next: 1.0,
      wheel: { n: 5, arc: 1.0, spin: .55 },   /* 五道光轮，顺时针匀速 */
      beamAt: 1.6, fired: false,               /* 轮转起来之后，凝视才登场 */
    };
    addRing(e.x, e.y, '#c37bff', 20, 1000, .8);
    S.shake = Math.min(22, S.shake + 12);
    S.hitStop = Math.max(S.hitStop, .1);
    S.flash = Math.max(S.flash, .4);
    SFX.alarm();
  },

  /* 虚空双瞳「湮灭十字」：两眼之间升起十字巨束并缓慢旋转扫场 */
  annihilate(e, ph) {
    const t = e.twin;
    const cx = t && t.hp > 0 ? (e.x + t.x) / 2 : e.x;
    const cy = t && t.hp > 0 ? (e.y + t.y) / 2 : e.y;
    const a0 = Math.random() * RAD;
    addHazard('beam', cx, cy, { w: 1300, h: 56, rot: a0, spin: .55, dps: 44, color: '#b18bff', life: 2.6, warm: 1.1 });
    addHazard('beam', cx, cy, { w: 1300, h: 56, rot: a0 + 1.57, spin: .55, dps: 44, color: '#8a5cff', life: 2.6, warm: 1.1 });
    S.shake = Math.min(18, S.shake + 8);
    S.flash = Math.max(S.flash, .3);
    SFX.alarm();
  },

  /* 深渊空洞「巨口吞噬」：超大多重吸引场，把人往嘴里拽 */
  devour(e, ph) {
    const p = S.player;
    for (let k = 0; k < 2; k++) {
      addHazard('void', p.x + rnd(-90, 90), p.y + rnd(-90, 90),
        { r: 240, dps: 18, color: '#ff4d6d', life: 2.8, warm: .6, pull: 190 });
    }
    S.shake = Math.min(16, S.shake + 8);
    SFX.alarm();
  },

  /* 深渊之口「陨星吐息」：以玩家为中心的扇面落石轰炸 + 迎面火扇 */
  meteorBreath(e, ph) {
    const p = S.player;
    const base = Math.atan2(p.y - e.y, p.x - e.x);
    for (let k = 0; k < 12 + ph * 2; k++) {
      const a = base + rnd(-.6, .6), d = rnd(50, 400);
      addHazard('rock', p.x + Math.cos(a) * d, p.y + Math.sin(a) * d,
        { r: 46, dps: 38, color: e.color, life: 1.6, warm: .9 });
    }
    for (let i = 0; i < 7; i++) {
      shootEnemyBullet(e, S.player, base + (i - 3) * .16, 360, 10,
        { color: i % 2 ? '#ff7a3d' : '#ffd24a', kind: 'fire', r: 8, life: 1.8 });
    }
    S.shake = Math.min(18, S.shake + 8);
    SFX.alarm();
  },
};


/* =========================================================
   0.43.0 腐林母体（BOSS2）——「不自己出手，小弟上」
   ---------------------------------------------------------
   玩法轴：威胁来自场地，不是本体。玩家处理的是「不断被改写的
   可走空间」：包围圈要破、定角炮台要拆、藤蔓线要钻、被抓要挣。
   大招是唯一一次本体亲自上——前面所有零件合体成三头巨物。
   参数全部在 HIVE 表；招式进 ATK/ULT；三阶段走 script:'hive'。
   依据：其他/方案/Boss设计/腐林母体-口述机制稿.md（口述为准）。
   ========================================================= */
const HIVE = {
  c: { twig:'#9a7440', pea:'#9ce06a', vine:'#59d98a', mist:'#7fd08a',
       blade:'#c7e86a', flower:'#e26a8a', sun:'#ffe07a', domain:'#3fa86a' },
  twig:  { type:'swarm', ring:5, radius:148, jitter:26, grow:.5, hp:.85 },
  pea:   { type:'grunt', count:3, radius:118, jitter:18, grow:.55, hp:.7,
           spd:300, life:8, r:7, dmg:9, warm:.65, cd:1.35, max:12 },
  mist:  { count:5, radius:130, r:46, dps:16, life:4.2, warm:.45 },
  blade: { n:4, orbit:104, len:96, thick:30, spin:2.6, life:4.6, dps:26, warm:.3 },
  sun:   { max:3, frac:.12, tell:.75, r:60 },
  /* 0.43.1：毒雾线改「平行线束」——同角度、等距横移、预警期不判定。
     玩家只要沿垂直方向侧移半个 laneGap 就能出夹缝，不再被扇形越拉越宽困死。*/
  grab:  { pull:.55, hold:.28, throw:.42, dist:300, dmg:26,
           mistLen:560, mistThick:16, mistDps:18,
           laneGap:168, laneBand:24, laneMaxGap:260, telegraph:.85, extraMax:3,
           centerFire:true,   /* 0.43.3 补线改从 BOSS 本体中心向外射；关掉回 0.43.2 平移式 */
           aimMaxAng:1.15, aimMaxOff:1400,  /* 0.43.4 瞄准玩家时的偏角/远端落点上限，防贴脸翻角 */
           step:.7, vineThick:30, warm:.32, life:1.5, dps:22 },
  encircle:{ interval:.8, rings:6, twigPerRing:5, peaPerRing:2,
             r0:120, rStep:62, grow:.4 },
  flower:{ scale:4, spawnR:330, life:7.5, speed:128, dmg:24, contact:.72, grow:.5 },
  vineBarrage:{ count:10, keep:5, interval:.45, len:940, thick:26, warm:.3, dps:24,
                angles:[0, Math.PI/2, Math.PI/4, -Math.PI/4] },
  /* 0.43.1 手感回调：体型 4→2 倍、双手拉开留缝、绕行速度降到玩家速度以下。
     0.43.2 再回调：逐轴 clamp 的斜向合速度 = 155*sqrt(2) ≈ 219 > 玩家 208，
     看着仍像追死人；改成整条速度矢量限速 110，并把收尾节奏整体放慢。
     玩家基础移速 208px/s；orbitSpeed 必须明显低于它才拉得开距离。*/
  ult: {
    scale:2, handScale:2, handGap:3.0, handLerp:3.2, biteAnim:.95,
    orbitR:300, orbitSpd:.34, orbitSpeed:110, orbitGain:1.4,
    domainR:116, domainDps:22, domainLife:99,
    corner:220, leapDur:1.5, leapArc:150,
    biteWarm:.7, biteDps:30, biteThick:62, biteLife:1.3, biteLen:760,
    gapWarm:.85, gapDps:34, gapLen:1600, gapThick:170, gapLife:1.5,
    finishWarm:.95, finishDps:34, finishLen:1200, finishThick:46, finishLife:1.4,
    timeline:[
      { t:0,   act:'expand' },
      { t:1.0, act:'biteL' },
      { t:1.6, act:'biteR' },
      { t:2.2, act:'cross' },
      { t:3.0, act:'gap' },
      { t:4.2, act:'finish' },
      { t:5.4, act:'end' },
    ],
  },
  script: {
    p1: ['small', 'small', 'combo'],
    p2: ['mid', 'combo', 'mid', 'mid', 'combo', 'mid', 'ult'],
    p3: ['ult'],
  },
};

/* 0.43.1：巨形态绘制按 scale 放大，命中判定半径必须跟着放大，
   否则玩家打「看得见的身体边缘」会穿过去（子弹打不到的根因）。
   注意只放大「玩家打 BOSS」的判定，接触伤害仍按原半径，别反过来坑玩家。*/
function hiveHitR(e) {
  return (e && e.bossId === 'hive' && e.hiveGiant) ? e.r * e.hiveGiant.scale : e.r;
}

function hiveCorner(p, m) {
  return p.x < m || p.x > WORLD.w - m || p.y < m || p.y > WORLD.h - m;
}

/* 危险区线段统一出口：从 (x0,y0) 朝 (x1,y1) 铺一条长 len 的旋转矩形 */
function hiveLine(kind, x0, y0, x1, y1, thick, warm, life, dps, color, capLen) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  const len = capLen || Math.hypot(x1 - x0, y1 - y0);
  return addHazard(kind, x0 + Math.cos(a) * len * .5, y0 + Math.sin(a) * len * .5,
    { w:len, h:thick, rot:a, warm:warm, life:life, dps:dps, color:color });
}

/* 从地上长出一个小弟：pending 队列带 extra，spawnAt 合并到实体 */
function hiveSpawn(kind, x, y, extra) {
  const cfg = kind === 'twig' ? HIVE.twig : HIVE.pea;
  if (S.pending.length > 60) return;
  if (kind === 'pea' &&
      S.enemies.filter(m => m.hive === 'pea' && m.hp > 0).length >= cfg.max) return;
  S.pending.push({ type:cfg.type,
    x:clamp(x, 20, WORLD.w - 20), y:clamp(y, 20, WORLD.h - 20),
    extra:Object.assign({ hive:kind, growT:cfg.grow, growMax:cfg.grow, growK:0 }, extra || {}) });
}

function hiveRing(e, ph, idx) {
  const c = HIVE.encircle, p = S.player;
  const R = c.r0 + idx * c.rStep, off = idx * .38;
  for (let k = 0; k < c.twigPerRing; k++) {
    const a = k / c.twigPerRing * RAD + off;
    hiveSpawn('twig', p.x + Math.cos(a) * R, p.y + Math.sin(a) * R, { timer:0 });
  }
  for (let k = 0; k < c.peaPerRing; k++) {
    const a = (k + .5) / c.peaPerRing * RAD + off;
    const x = p.x + Math.cos(a) * (R + c.rStep * .5);
    const y = p.y + Math.sin(a) * (R + c.rStep * .5);
    hiveSpawn('pea', x, y, { peaAng:Math.atan2(p.y - y, p.x - x), timer:HIVE.pea.warm });
  }
  addRing(p.x, p.y, HIVE.c.vine, 10, R * 2.2, .35);
}

/* ---- 小招 ---- */
const HIVE_ATK = {
  hiveTwigs(e, ph) {
    const c = HIVE.twig, p = S.player;
    for (let k = 0; k < c.ring; k++) {
      const a = k / c.ring * RAD + rnd(-.25, .25);
      const d = c.radius + rnd(-c.jitter, c.jitter);
      const x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
      hiveSpawn('twig', x, y, { timer:0 });
      addRing(x, y, HIVE.c.twig, 3, 90, .28);
    }
    S.shake = Math.min(10, S.shake + 3);
    SFX.zap();
  },
  hivePeas(e, ph) {
    const c = HIVE.pea, p = S.player;
    const n = c.count + (ph >= 2 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const a = k / n * RAD + rnd(-.2, .2);
      const x = p.x + Math.cos(a) * (c.radius + rnd(-c.jitter, c.jitter));
      const y = p.y + Math.sin(a) * (c.radius + rnd(-c.jitter, c.jitter));
      hiveSpawn('pea', x, y, { peaAng:Math.atan2(p.y - y, p.x - x), timer:c.warm });
      addRing(x, y, HIVE.c.pea, 3, 90, .28);
    }
    SFX.eshot();
  },
  hiveMist(e, ph) {
    const c = HIVE.mist, p = S.player;
    for (let k = 0; k < c.count; k++) {
      const a = k / c.count * RAD + rnd(-.3, .3), d = rnd(20, c.radius);
      addHazard('poison', p.x + Math.cos(a) * d, p.y + Math.sin(a) * d,
        { r:c.r, dps:c.dps * phMul(ph), color:HIVE.c.mist, life:c.life, warm:c.warm });
    }
    SFX.zap();
  },
  hiveGrab(e, ph) {
    const c = HIVE.grab, p = S.player;
    const h = hiveLine('vine', e.x, e.y, p.x, p.y, c.vineThick, c.warm, c.life,
      c.dps * phMul(ph), HIVE.c.vine);
    e.hiveGrabWatch = { h:h, at:S.t + c.warm + .02 };
    announce(e.bossName + ' · 藤蔓抓取', '藤蔓亮起来就横移——被缠住会被拖过去再扔飞', HIVE.c.vine, false);
    SFX.alarm();
  },
  hiveBlades(e, ph) {
    const c = HIVE.blade;
    addHazard('blades', e.x, e.y, {
      r:c.orbit, n:c.n, w:c.len, h:c.thick, spin:c.spin * (ph >= 3 ? 1.35 : 1),
      dps:c.dps * phMul(ph), color:HIVE.c.blade, life:c.life, warm:c.warm, follow:e,
    });
    addRing(e.x, e.y, HIVE.c.blade, 8, 320, .32);
    SFX.zap();
  },
  hiveSun(e, ph) {
    const c = HIVE.sun;
    e.hiveHeals = e.hiveHeals || 0;
    if (e.hiveHeals >= c.max) { HIVE_ATK.hiveTwigs(e, ph); return; }  /* 额度用完改派小弟 */
    e.hiveHeals++;
    const heal = e.maxHp * c.frac;
    e.hp = Math.min(e.maxHp, e.hp + heal);
    addText(e.x, e.y - e.r - 12, '+' + Math.round(heal), c.sun, 16, true);
    addRing(e.x, e.y, c.sun, 12, 420, .55);
    S.props.push({ kind:'sun', x:e.x, y:e.y, r:c.r, life:c.tell, max:c.tell, t:0 });
    announce(e.bossName + ' · 阳光植物', '它在回血（一次生命最多 ' + c.max + ' 次）', c.sun, false);
    SFX.zap();
  },
  /* ---- 连招 ---- */
  hiveStall(e, ph) {
    const steps = [
      { t:0,   mv:'hiveTwigs', fn:(e2, p2) => ATK.hiveTwigs(e2, p2) },
      { t:.55, mv:'hivePeas',  fn:(e2, p2) => hivePeaWall(e2, p2) },
      { t:1.1, mv:'hiveSun',   fn:(e2, p2) => ATK.hiveSun(e2, p2) },
    ];
    e.comboSeq = { steps:steps, i:0, t:0, dur:1.9 };
    e.casting = 1.9;
    announce(e.bossName + ' · 缓兵之计', '小弟围你、炮台挡在中间、它在后面回血', HIVE.c.sun, false);
  },
  hiveControl(e, ph) {
    const c = HIVE.grab, p = S.player;
    /* 0.43.1：基准角 = BOSS→玩家方向；起手两条毒雾线同角度、只做横向偏移，
       间距恒为 laneGap，不再随距离张成扇形。先亮 telegraph 秒预警再判定。
       0.43.3：起手两条仍从 BOSS 两侧平行射出；补的 3/4/5 条以 BOSS 本体中心为发射点。
       0.43.4：补线的方向 = 中心→玩家此刻所在位置，射线穿过玩家当时那一点；
       往两线中间补是够不到已经逃出去的玩家的，见 hiveControlTick。*/
    const base = Math.atan2(p.y - e.y, p.x - e.x);
    const q = { t:0, next:c.telegraph, extra:0, ph:ph, ox:e.x, oy:e.y,
                base:base, lines:[-c.laneGap * .5, c.laneGap * .5],
                center:[false, false] };   /* 起手两条 = BOSS 两侧；补线 = 中心 */
    e.hiveControl = q;
    hiveControlFire(q, q.lines[0], false);
    hiveControlFire(q, q.lines[1], false);
    announce(e.bossName + ' · 控制弹抓',
      '两条平行毒雾线从两侧亮起来，先横着挪出中间的缝——补的线会从本体中心朝你此刻的位置射过来，亮完才会抓', HIVE.c.mist, false);
  },
};
Object.assign(ATK, HIVE_ATK);

function hivePeaWall(e, ph) {
  const p = S.player, c = HIVE.pea;
  for (let k = 0; k < c.count; k++) {
    const f = .3 + k * .18;
    const x = e.x + (p.x - e.x) * f + rnd(-20, 20);
    const y = e.y + (p.y - e.y) * f + rnd(-20, 20);
    hiveSpawn('pea', x, y, { peaAng:Math.atan2(p.y - y, p.x - x), timer:c.warm });
  }
}

function hiveControlFire(q, off, fromCenter) {
  const c = HIVE.grab;
  const ca = Math.cos(q.base), sa = Math.sin(q.base);
  const nx = -sa, ny = ca;
  let x0, y0, x1, y1;
  if (fromCenter) {
    /* 0.43.3：补线发射点 = BOSS 本体中心，向外射到远端 off 处 ⇒ 从中心放射 */
    x0 = q.ox; y0 = q.oy;
    x1 = q.ox + ca * c.mistLen + nx * off;
    y1 = q.oy + sa * c.mistLen + ny * off;
  } else {
    /* 起手两条：从 BOSS 两侧横向偏移处出发，角度与基准角相同 ⇒ 平行 */
    x0 = q.ox + nx * off; y0 = q.oy + ny * off;
    x1 = x0 + ca * c.mistLen; y1 = y0 + sa * c.mistLen;
  }
  return hiveLine('mist', x0, y0, x1, y1,
    c.mistThick, c.telegraph, c.telegraph + c.step * (c.extraMax + 1) + .8,
    c.mistDps * phMul(q.ph), HIVE.c.mist);
}

/* 0.43.3：一条毒雾线在 along（沿 BOSS→玩家方向的距离）处的横向位置。
   起手平行线恒为 off；从中心射出的补线在中心汇成一点，越远越张开到 off。*/
function hiveLineAt(q, i, along) {
  const c = HIVE.grab;
  return (q.center && q.center[i]) ? q.lines[i] * (along / c.mistLen) : q.lines[i];
}

function hiveControlCheck(q) {
  const p = S.player, c = HIVE.grab;
  const dx = p.x - q.ox, dy = p.y - q.oy;
  const ca = Math.cos(q.base), sa = Math.sin(q.base);
  const along = dx * ca + dy * sa;        /* 沿毒雾线方向的距离 */
  if (along < 0 || along > c.mistLen) return false;
  const cross = -dx * sa + dy * ca;       /* 垂直于毒雾线的横向偏移 */
  /* 0.43.3：按玩家所在 along 处取每条线的实时横向位置（中心射线随距离张开）*/
  const ls = q.lines.map((_, i) => hiveLineAt(q, i, along)).sort((x, y) => x - y);
  for (const l of ls) if (Math.abs(cross - l) < c.laneBand) return true;  /* 贴线也算被圈住 */
  for (let i = 0; i + 1 < ls.length; i++) {
    if (ls[i + 1] - ls[i] > c.laneMaxGap) continue;   /* 只认窄夹缝 */
    if (cross > ls[i] && cross < ls[i + 1]) return true;
  }
  return false;
}

function hiveControlTick(e, dt) {
  const q = e.hiveControl, c = HIVE.grab;
  q.t += dt;
  if (q.t < q.next) return;              /* 预警期只亮线，不判定、不抓人 */
  if (hiveControlCheck(q)) { hiveStartGrab(e, q.ph); e.hiveControl = null; return; }
  if (q.extra < c.extraMax) {
    q.extra++;
    const p = S.player;
    const dx = p.x - q.ox, dy = p.y - q.oy;
    const ca = Math.cos(q.base), sa = Math.sin(q.base);
    const alongP = dx * ca + dy * sa;
    const crossP = -dx * sa + dy * ca;
    /* 0.43.4：补线 = 从 BOSS 中心「朝玩家此刻所在位置」射出去。
       玩家逃出夹缝后往两线中间补线够不到他，必须按中心→玩家的方向瞄准，
       射线正好穿过玩家当时那一点；每条补线都重新取玩家当前位置。
       偏角与远端落点夹在 aimMaxAng / aimMaxOff 内，防贴脸或绕背后时角度翻过去。*/
    let da = Math.atan2(crossP, Math.max(alongP, 60));
    da = clamp(da, -c.aimMaxAng, c.aimMaxAng);
    const off = clamp(c.mistLen * Math.tan(da), -c.aimMaxOff, c.aimMaxOff);
    const fromCenter = c.centerFire !== false;
    q.lines.push(off);
    q.center.push(fromCenter);
    hiveControlFire(q, off, fromCenter);
    addRing(p.x, p.y, HIVE.c.mist, 8, 240, .3);
    SFX.alarm();
    q.next = q.t + c.telegraph;          /* 每补一条线都重新给完整预警 */
  } else {
    e.hiveControl = null;    /* 补满 3 条还没圈住 → 放你走 */
  }
}

/* ---- 抓取：抓过来 → 挨一下 → 扔出去（前提是抓到了） ---- */
function hiveStartGrab(e, ph) {
  const p = S.player, c = HIVE.grab;
  S.hiveGrab = { boss:e, t:0, hit:false, x0:p.x, y0:p.y, tx:e.x, ty:e.y,
                 dir:Math.atan2(p.y - e.y, p.x - e.x) };
  ATK.hiveBlades(e, ph);       /* 同时开启旋转刮刀 */
  addRing(p.x, p.y, HIVE.c.vine, 14, 420, .45);
  announce(e.bossName + ' · 抓到了', '被拖过去挨一下，再整个扔飞', HIVE.c.vine, true);
  S.shake = Math.min(18, S.shake + 9);
  SFX.alarm();
}

function updateHiveGrab(dt) {
  const g = S.hiveGrab;
  if (!g) return;
  if (g.boss && g.boss.hp <= 0) { S.hiveGrab = null; return; }
  const p = S.player, c = HIVE.grab;
  g.t += dt;
  const tPull = c.pull, tHold = tPull + c.hold, tThrow = tHold + c.throw;
  if (g.t < tPull) {
    const k = g.t / tPull;
    p.x = clamp(g.x0 + (g.tx - g.x0) * k, p.r, WORLD.w - p.r);
    p.y = clamp(g.y0 + (g.ty - g.y0) * k, p.r, WORLD.h - p.r);
  } else if (g.t < tHold) {
    p.x = clamp(g.tx, p.r, WORLD.w - p.r);
    p.y = clamp(g.ty, p.r, WORLD.h - p.r);
    if (!g.hit) {
      g.hit = true; p.inv = 0;
      damagePlayer(c.dmg * phMul(g.boss.phase || 1), g.tx, g.ty);
      S.shake = Math.min(20, S.shake + 10);
      addRing(p.x, p.y, HIVE.c.blade, 12, 460, .4);
    }
  } else if (g.t < tThrow) {
    const k = (g.t - tHold) / c.throw;
    p.x = clamp(g.tx + Math.cos(g.dir) * c.dist * k, p.r, WORLD.w - p.r);
    p.y = clamp(g.ty + Math.sin(g.dir) * c.dist * k, p.r, WORLD.h - p.r);
  } else {
    S.hiveGrab = null;
  }
}

function hiveVineLine(e, ph, k) {
  const c = HIVE.vineBarrage, p = S.player;
  const a = c.angles[k % c.angles.length] + rnd(-.08, .08);
  const cx = p.x + rnd(-24, 24), cy = p.y + rnd(-24, 24);
  hiveLine('vine',
    cx - Math.cos(a) * c.len * .5, cy - Math.sin(a) * c.len * .5,
    cx + Math.cos(a) * c.len * .5, cy + Math.sin(a) * c.len * .5,
    c.thick, c.warm, c.keep * c.interval, c.dps * phMul(ph), HIVE.c.vine);
  addRing(cx, cy, HIVE.c.vine, 6, 180, .22);
  SFX.zap();
}

function hiveHand(e, side) {
  const u = e.hiveUlt;
  if (!u) return null;
  for (const h of u.hands) if (h.side === side) return h;
  return null;
}

function hiveHandBite(e, side, cross) {
  const c = HIVE.ult, p = S.player, h = hiveHand(e, side);
  if (!h) return;
  h.biteT = c.biteAnim;
  h.tx = p.x; h.ty = p.y;
  const fromX = cross ? e.x - side * e.r * c.scale : h.x;
  const fromY = cross ? e.y - side * e.r * c.scale * .3 : h.y;
  const tx = p.x + (cross ? side * c.biteLen * .22 : 0);
  hiveLine('vine', fromX, fromY, tx, p.y, c.biteThick, c.biteWarm, c.biteLife,
    c.biteDps * phMul(e.phase || 1), HIVE.c.vine, c.biteLen);
  addRing(p.x, p.y, HIVE.c.flower, 10, 300, .3);
  SFX.alarm();
}

function hiveBloomEnd(e, u) {
  const idx = S.hazards.indexOf(u.domain);
  if (idx >= 0) S.hazards.splice(idx, 1);
  S.props = S.props.filter(pr => !(pr.kind === 'hand' && pr.owner === e));
  e.hiveUlt = null; e.hiveGiant = null;
  e.rest = bossRest(e, 1.2);
  e.casting = Math.max(e.casting, 1.2);
  e.timer = bossGap(e, e.def || BOSSES.hive) * 1.5;
  announce(e.bossName + ' · 力竭', '藤蔓缩回去了——破绽，放心输出', '#9fe08a', false);
}

function hiveUltAct(e, u, act) {
  const c = HIVE.ult, p = S.player;
  if (act === 'expand') {
    u.expand = true;
    addRing(e.x, e.y, e.color, 20, 900, .6);
    for (let k = 0; k < 3; k++) addRing(e.x, e.y, HIVE.c.vine, 12 + k * 12, 760 - k * 120, .55);
  } else if (act === 'biteL') {
    hiveHandBite(e, -1, false);
  } else if (act === 'biteR') {
    hiveHandBite(e, 1, false);
  } else if (act === 'cross') {
    hiveHandBite(e, -1, true);
    hiveHandBite(e, 1, true);
  } else if (act === 'gap') {
    for (const h of u.hands) h.biteT = 0;    /* 手缩回去，给玩家时间逃跑 */
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    hiveLine('vine', e.x, e.y, e.x + Math.cos(a) * c.gapLen, e.y + Math.sin(a) * c.gapLen,
      c.gapThick, c.gapWarm, c.gapLife, c.gapDps * phMul(e.phase || 1), HIVE.c.vine);
    S.shake = Math.min(20, S.shake + 10);
    SFX.alarm();
  } else if (act === 'finish') {
    for (const s of [-1, 1]) {
      const a = Math.atan2(p.y - e.y, p.x - e.x) + s * .32;
      hiveLine('vine',
        p.x - Math.cos(a) * c.finishLen * .5, p.y - Math.sin(a) * c.finishLen * .5,
        p.x + Math.cos(a) * c.finishLen * .5, p.y + Math.sin(a) * c.finishLen * .5,
        c.finishThick, c.finishWarm, c.finishLife, c.finishDps * phMul(e.phase || 1), HIVE.c.vine);
    }
    S.shake = Math.min(22, S.shake + 12);
    S.flash = Math.max(S.flash, .35);
    SFX.alarm();
  } else if (act === 'end') {
    if (u.loop) { u.t = 0; u.i = 0; return; }    /* P3：大招常态化，巨形态不撤 */
    hiveBloomEnd(e, u);
  }
}

function hiveUltTick(e, dt) {
  const u = e.hiveUlt, c = HIVE.ult;
  if (!u) return;
  u.t += dt;
  if (e.hiveGiant) e.hiveGiant.t += dt;
  if (u.leap) {
    const L = u.leap; L.t += dt;
    const k = clamp(L.t / L.dur, 0, 1);
    e.x = L.x0 + (L.x1 - L.x0) * k;
    e.y = L.y0 + (L.y1 - L.y0) * k;
    e.hiveGiant.arc = Math.sin(Math.PI * k) * c.leapArc;
    if (k >= 1) {
      u.leap = null; e.hiveGiant.arc = 0;
      S.shake = Math.min(24, S.shake + 15);
      addRing(e.x, e.y, e.color, 18, 820, .55);
      for (let k2 = 0; k2 < 8; k2++) {
        const a = k2 / 8 * RAD;
        hiveLine('vine', e.x, e.y, e.x + Math.cos(a) * c.biteLen, e.y + Math.sin(a) * c.biteLen,
          c.biteThick, .2, 1.0, c.biteDps, HIVE.c.vine);
      }
      SFX.alarm();
    }
  }
  while (u.i < u.steps.length && u.t >= u.steps[u.i].t) {
    const act = u.steps[u.i].act; u.i++;
    hiveUltAct(e, u, act);
    if (act === 'end' || !e.hiveUlt) break;   /* loop 时 u.t 已归零，别再跑同一轮 */
  }
}

/* 巨形态：绕着玩家慢慢走，不朝玩家直冲，所以不会把人逼进死角 */
function hiveMove(e, dt, dx, dy, d, sp, def, ph) {
  const u = e.hiveUlt, c = HIVE.ult, p = S.player;
  if (!u || u.leap) return { vx:0, vy:0 };
  u.ang += u.dir * c.orbitSpd * dt;
  const tx = p.x + Math.cos(u.ang) * c.orbitR;
  const ty = p.y + Math.sin(u.ang) * c.orbitR;
  /* 0.43.2：按「整条速度矢量」限速。0.43.1 是逐轴 clamp(±155)，
     斜着走时合速度能到 219 > 玩家 208，实测还是被追死；现在任何方向都 ≤ orbitSpeed。*/
  let vx = (tx - e.x) * c.orbitGain, vy = (ty - e.y) * c.orbitGain;
  const m = Math.hypot(vx, vy);
  if (m > c.orbitSpeed) { vx = vx / m * c.orbitSpeed; vy = vy / m * c.orbitSpeed; }
  return { vx:vx, vy:vy };
}

/* 三阶段脚本：P1 两小招+一连招；P2 中连中两套后大；P3 大招常态化 */
function hiveSequence(e, def, ph) {
  if (e.hiveUlt || e.hiveControl || e.comboSeq || S.hiveGrab || e.hiveGrabWatch) {
    e.timer = .4; return;
  }
  e.hvIdx = e.hvIdx || 0; e.hvMv = e.hvMv || 0;
  e.hvCo = e.hvCo || 0; e.hvMi = e.hvMi || 0;
  const q = HIVE.script['p' + ph] || HIVE.script.p1;
  const slot = q[e.hvIdx % q.length]; e.hvIdx++;
  const gap = bossGap(e, def) * (ph === 3 ? .68 : ph === 2 ? .84 : 1);
  if (slot === 'small') {
    const mv = def.moves[e.hvMv % def.moves.length]; e.hvMv++;
    castMove(mv, ATK[mv], e, ph);
    e.timer = gap * rnd(.9, 1.12);
  } else if (slot === 'combo') {
    const mv = def.rhCombos[e.hvCo % def.rhCombos.length]; e.hvCo++;
    castMove(mv, ATK[mv], e, ph);
    e.timer = gap * 1.15;
  } else if (slot === 'mid') {
    const uk = def.mids[e.hvMi % def.mids.length]; e.hvMi++;
    const info = ULT_INFO[uk] || { name:uk, sub:'' };
    announce(e.bossName + ' · ' + info.name, info.sub, e.color, true);
    castMove(uk, ULT[uk], e, ph);
    e.timer = gap * 1.25;
  } else {
    const info = ULT_INFO[def.ult] || { name:def.ult, sub:'' };
    announce(e.bossName + ' · ' + info.name, info.sub, e.color, true);
    castMove(def.ult, ULT[def.ult], e, ph);
    e.timer = gap * 1.6;
  }
}

/* 每帧推进：玩家抓取 / 场物件 / BOSS 侧状态 */
function updateHive(dt) {
  const p = S.player;
  updateHiveGrab(dt);
  for (let i = S.props.length - 1; i >= 0; i--) {
    const pr = S.props[i];
    pr.t = (pr.t || 0) + dt;
    pr.life -= dt;
    if (pr.life <= 0 || (pr.owner && pr.owner.hp <= 0)) { S.props.splice(i, 1); continue; }
    if (pr.kind === 'flower') {
      if (pr.grow > 0) { pr.grow -= dt; continue; }
      const dx = p.x - pr.x, dy = p.y - pr.y, dd = Math.hypot(dx, dy) || 1;
      const k = 1 - Math.exp(-3 * dt);
      pr.vx = (pr.vx || 0) + (dx / dd * pr.speed - (pr.vx || 0)) * k;
      pr.vy = (pr.vy || 0) + (dy / dd * pr.speed - (pr.vy || 0)) * k;
      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      if (dd < pr.r * HIVE.flower.contact + p.r) damagePlayer(pr.dmg, pr.x, pr.y);
    } else if (pr.kind === 'hand') {
      const e = pr.owner, u = e && e.hiveUlt, c = HIVE.ult;
      if (!u) continue;
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      const sa = a + pr.side * Math.PI / 2;
      const dist = e.r * c.scale * c.handGap;
      const rx = e.x + Math.cos(sa) * dist, ry = e.y + Math.sin(sa) * dist;
      let tx = rx, ty = ry;
      if (pr.biteT > 0) {
        pr.biteT -= dt;
        const kk = 1 - clamp(pr.biteT / c.biteAnim, 0, 1);
        const amp = Math.sin(Math.PI * kk);
        tx = rx + (pr.tx - rx) * amp; ty = ry + (pr.ty - ry) * amp;
      }
      const lerp = Math.min(1, dt * c.handLerp);
      pr.x += (tx - pr.x) * lerp; pr.y += (ty - pr.y) * lerp;
    }
  }
  for (const e of S.enemies) {
    if (e.type !== 'boss' || e.hp <= 0 || e.bossId !== 'hive') continue;
    if (e.hiveGrabWatch) {
      const w = e.hiveGrabWatch;
      if (S.t >= w.at) {
        e.hiveGrabWatch = null;
        if (S.hazards.indexOf(w.h) >= 0 && inHazard(w.h, p.x, p.y)) hiveStartGrab(e, e.phase || 1);
      }
    }
    if (e.hiveControl) hiveControlTick(e, dt);
    if (e.hiveUlt) hiveUltTick(e, dt);
  }
}

/* ---- 可读性占位画法（最终美术由其他人接） ---- */
function drawHiveMinion(e) {
  const k = clamp(e.growK === undefined ? 1 : e.growK, .12, 1);
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(k, k);
  if (e.hive === 'twig') {
    ctx.strokeStyle = HIVE.c.twig; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, e.r * .8); ctx.lineTo(0, -e.r * .8);
    ctx.moveTo(0, -e.r * .2); ctx.lineTo(-e.r * .6, -e.r * .7);
    ctx.moveTo(0, -e.r * .45); ctx.lineTo(e.r * .55, -e.r * .85);
    ctx.stroke();
    ctx.fillStyle = withAlpha(HIVE.c.vine, .55);
    ctx.beginPath(); ctx.arc(0, -e.r * .85, e.r * .28, 0, RAD); ctx.fill();
  } else {
    const a = e.peaAng || 0;
    ctx.fillStyle = HIVE.c.pea;
    ctx.beginPath(); ctx.arc(0, 0, e.r * .8, 0, RAD); ctx.fill();
    ctx.save(); ctx.rotate(a);
    ctx.fillStyle = '#2f5a24';
    ctx.fillRect(e.r * .35, -e.r * .3, e.r * .8, e.r * .6);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(-e.r * .25, -e.r * .25, e.r * .2, 0, RAD); ctx.fill();
  }
  ctx.restore();
  if (e.growK !== undefined && e.growK < 1) {
    ctx.strokeStyle = withAlpha(HIVE.c.vine, .8); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (1.4 - e.growK * .4), 0, RAD); ctx.stroke();
  }
}

function drawHiveProps() {
  for (const pr of S.props) {
    const fade = clamp(pr.life / .6, 0, 1);
    ctx.save();
    ctx.globalAlpha = fade;
    if (pr.kind === 'sun') {
      const k = 1 - (pr.t || 0) / (pr.max || 1);
      ctx.fillStyle = withAlpha(HIVE.c.sun, .2 + .3 * k);
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r * (1 - k * .3), 0, RAD); ctx.fill();
      ctx.strokeStyle = withAlpha(HIVE.c.sun, .8); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r * .55, 0, RAD); ctx.stroke();
    } else if (pr.kind === 'flower') {
      const g = clamp(1 - (pr.grow || 0) / HIVE.flower.grow, .15, 1);
      ctx.translate(pr.x, pr.y); ctx.scale(g, g);
      ctx.fillStyle = withAlpha(HIVE.c.flower, .85);
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * RAD + Math.sin(S.t * 2 + k) * .06;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * pr.r * .62, Math.sin(a) * pr.r * .62,
          pr.r * .42, pr.r * .24, a, 0, RAD);
        ctx.fill();
      }
      ctx.fillStyle = '#2a0f1a';
      ctx.beginPath(); ctx.arc(0, 0, pr.r * .48, 0, RAD); ctx.fill();
      for (let k = 0; k < 10; k++) {
        const a = k / 10 * RAD;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * pr.r * .42, Math.sin(a) * pr.r * .42);
        ctx.lineTo(Math.cos(a + .12) * pr.r * .2, Math.sin(a + .12) * pr.r * .2);
        ctx.lineWidth = 3; ctx.strokeStyle = '#fff0e0'; ctx.stroke();
      }
    } else if (pr.kind === 'hand') {
      ctx.translate(pr.x, pr.y);
      const r = pr.r;
      ctx.fillStyle = withAlpha(HIVE.c.flower, .9);
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * RAD + S.t * .6;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * r * .6, Math.sin(a) * r * .6, r * .4, r * .22, a, 0, RAD);
        ctx.fill();
      }
      ctx.fillStyle = '#2a0f1a';
      ctx.beginPath(); ctx.arc(0, 0, r * .45, 0, RAD); ctx.fill();
    }
    ctx.restore();
  }
}

/* =========================================================
   对弈招（READ）：BOSS 观察玩家习惯（4 秒一结），针对性出招。
   玩家画像：close 爱贴脸 / far 爱风筝 / weave 乱跑走位。
   难度梯度：休闲/普通不出；困难出 read[0]；噩梦出 read[0..1] 且前摇 -30%。
   ========================================================= */
const READ_INFO = {
  punishClose: { name: '贴脸反打', sub: '它注意到你贴太近了——缺口在亮的那侧' },
  punishFar:   { name: '狙击压制', sub: '你站太远了——直线狙，横移一步就过' },
  punishWeave: { name: '预判封位', sub: '它在拦你的路——别按老路线走' },
};

const READ = {
  /* 爱贴脸 → 玩家脚下亮预警环，随后缺口冲击环反打 */
  punishClose(e, ph) {
    const wm = diff().read >= 2 ? .7 : 1;
    const p = S.player;
    addHazard('ring', p.x, p.y, { r: 12, maxR: 150, thick: 30,
      gapA: Math.random() * RAD, gapW: .55, spin: 2.2,
      dps: 30, color: e.color, life: 2.2, warm: .85 * wm });
    SFX.alarm();
  },

  /* 爱风筝 → 三层阶梯弹链狙击（一条直线三波不同速，横移可过） */
  punishFar(e, ph) {
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    [500, 430, 360].forEach(spd => {
      for (let k = -1; k <= 1; k++) {
        shootEnemyBullet(e, S.player, base + k * .3, spd, 11,
          { color: e.color, kind: 'orb', r: 7, life: 3 });
      }
    });
    addRing(e.x, e.y, '#ff4d6d', 12, 520, .5 * (diff().read >= 2 ? .7 : 1));
    SFX.zap();
  },

  /* 乱跑型 → 往玩家移动方向前方撒预警尖刺，封走位路线 */
  punishWeave(e, ph) {
    const wm = diff().read >= 2 ? .7 : 1;
    const p = S.player;
    const m = Math.hypot(e.obsVX || 0, e.obsVY || 0) || 1;
    const ux = (e.obsVX || 0) / m, uy = (e.obsVY || 0) / m;
    for (let k = 0; k < 5; k++) {
      const lead = 60 + k * 55;
      addHazard('spike', p.x + ux * lead + rnd(-26, 26), p.y + uy * lead + rnd(-26, 26),
        { r: 40, dps: 26, color: e.color, life: 2.6, warm: 1.0 * wm });
    }
    SFX.alarm();
  },
};

/* ---------- BOSS 思考：移动 + 三阶段 + 招式轮转 ---------- */
/* ========== BOSS 移动意图 + 硬直姿态（0.39.0 · B 批）==========
   以前不打人的时候只有三个分支：远了追 / 近了退 / 不远不近固定半径绕圈。
   距离一跨过阈值，方向那一帧就翻，看久了像钟摆，也像贴图被硬拽。

   这里拆成两件事：
     mood  平时打算干什么 —— 逼压 / 绕圈 / 换位 / 停顿 / 拉开
     pose  硬直期间怎么喘 —— 喘息 / 压近 / 拉扯 / 弧步 / 拉开

   两条都不改变「不出招就不还手」这个事实：输出窗口一点没缩，
   只是画面上多了一个活物。 */
function bossMoodPick(e, d, want, ph) {
  if (d > want + 150) return 'press';        /* 太远：先贴上去，别的都免谈 */
  if (d < want - 110) return 'break';        /* 太近：退开重新蓄势 */
  const r = Math.random();
  if (ph >= 3) return r < .40 ? 'press' : r < .70 ? 'repos' : r < .92 ? 'orbit' : 'hold';
  if (ph === 2) return r < .30 ? 'press' : r < .55 ? 'repos' : r < .85 ? 'orbit' : 'hold';
  return r < .18 ? 'press' : r < .38 ? 'repos' : r < .84 ? 'orbit' : 'hold';
}

function bossPosePick(e) {
  const fixed = bossBeha(e, 'restMode');     /* 调试台锁死姿态，方便对比哪一种最好看 */
  if (fixed) return ['catch', 'catch', 'stalk', 'yoyo', 'arc', 'break'][Math.round(fixed)] || 'catch';
  const r = Math.random();
  /* 长硬直先站定 0.6 秒：破绽必须看得懂，玩家才知道这一刀该不该上 */
  if (e.restMax >= 1.4) {
    if (e.rest > e.restMax - .6) return 'catch';
    return r < .6 ? 'arc' : 'stalk';
  }
  if (e.phase >= 3) return r < .5 ? 'stalk' : r < .8 ? 'arc' : 'yoyo';
  return r < .4 ? 'stalk' : r < .7 ? 'yoyo' : r < .92 ? 'arc' : 'catch';
}

function bossMotion(e, dt, dx, dy, d, sp, def, ph) {
  const want = bossKeep(e, def);
  const il = d > .001 ? 1 / d : 0;
  const ux = dx * il, uy = dy * il;          /* 单位向量：指向玩家 */
  let vx = 0, vy = 0;

  /* --- 硬直：换一种动法，不是定住 --- */
  if (e.rest > 0) {
    if (!e.restOn) {
      e.restOn = true; e.restMax = e.rest;
      e.pose = bossPosePick(e);
      e.mood = null; e.anchor = null;
      e.moodSeed = rnd(0, 6.28);
    }
    switch (e.pose) {
      case 'catch':   /* 喘息：站定缓气，动静全靠绘制层的深呼吸 */
        break;
      case 'stalk':   /* 压近半步：逼你换位，不给你原地打桩 */
        if (d > want * .78) { vx = ux * sp * .55; vy = uy * sp * .55; }
        break;
      case 'yoyo': {  /* 拉扯：沿当前轴进退试探 */
        const s = Math.sin(S.t * 1.7 + (e.moodSeed || 0)) * sp * .65;
        vx = ux * s; vy = uy * s;
        break;
      }
      case 'arc':     /* 弧步：绕着你慢慢找角度 */
        vx = -uy * sp * .52; vy = ux * sp * .52;
        break;
      default:        /* break 拉开：退到 keep + 80 重新蓄势 */
        if (d < want + 80) { vx = -ux * sp * .85; vy = -uy * sp * .85; }
    }
    return { vx: vx, vy: vy };
  }

  e.restOn = false;
  /* --- 平时：每 1.6~3.2 秒换一次意图 --- */
  e.moodT = (e.moodT || 0) - dt;
  if (!e.mood || e.moodT <= 0) {
    e.mood = bossMoodPick(e, d, want, ph);
    e.moodSeed = rnd(0, 6.28);
    e.anchor = null;
    e.moodT = rnd(1.6, 3.2) / Math.max(.2, bossBehaNum(e, 'mood', 1));
    if (e.mood === 'orbit') e.orbDir = Math.random() < .5 ? 1 : -1;
  }

  switch (e.mood) {
    case 'press': {           /* 逼压：主动顶上来 */
      const tg = want * .55;
      if (d > tg) { vx = ux * sp; vy = uy * sp; }
      else { vx = -uy * sp * .3; vy = ux * sp * .3; }
      break;
    }
    case 'repos': {           /* 换位：斜切到你的另一侧，最难预判 */
      if (!e.anchor) {
        const a0 = Math.atan2(e.y - S.player.y, e.x - S.player.x)
          + (Math.random() < .5 ? 1 : -1) * .785;
        e.anchor = {
          x: S.player.x + Math.cos(a0) * want,
          y: S.player.y + Math.sin(a0) * want,
        };
      }
      const ax = e.anchor.x - e.x, ay = e.anchor.y - e.y, al = Math.hypot(ax, ay);
      if (al > 24) { vx = ax / al * sp * 1.15; vy = ay / al * sp * 1.15; }
      else { vx = -uy * sp * .35; vy = ux * sp * .35; }
      break;
    }
    case 'hold': {            /* 停顿：位置几乎不动，但身体在晃 */
      const s = Math.sin(S.t * 1.3 + (e.moodSeed || 0)) * sp * .3;
      vx = -uy * s; vy = ux * s;
      break;
    }
    case 'break':             /* 拉开：退出去重新蓄势 */
      if (d < want + 80) { vx = -ux * sp * .9; vy = -uy * sp * .9; }
      break;
    default: {                /* orbit 绕圈：半径带呼吸，不再是等距钟摆 */
      const RR = want + Math.sin(S.t * .9 + (e.moodSeed || 0)) * 60;
      const rad = Math.max(-1, Math.min(1, (d - RR) / 120));
      vx = (-uy * (e.orbDir || 1) * .85 + ux * rad) * sp;
      vy = (ux * (e.orbDir || 1) * .85 + uy * rad) * sp;
    }
  }
  /* 合成速度封顶 1.2×：repos 的 1.15 倍不能和径向修正叠成瞬移 */
  const mm = Math.hypot(vx, vy), cap = sp * 1.2;
  if (mm > cap) { vx = vx / mm * cap; vy = vy / mm * cap; }
  return { vx: vx, vy: vy };
}

/* 对弈招（0.41.0 抽出共用）：按玩家画像挑招，且必须在 BOSS 自己的对弈表里 */
function castRead(e, def, ph) {
  const want = { close: 'punishClose', far: 'punishFar', weave: 'punishWeave' }[e.pProfile];
  const pool = (def.read || []).slice(0, diff().read);
  if (want && pool.includes(want) && READ[want]) {
    const info = READ_INFO[want] || { name: want, sub: '' };
    announce(e.bossName + ' · ' + info.name, info.sub, e.color, false);
    castMove(want, READ[want], e, ph);
    e.readCd = 9;
    e.pProfile = null;
    e.casting = .8;
    e.timer = bossGap(e, def);
    return true;
  }
  e.readCd = 2;                    /* 画像对不上自家招表：稍后再看 */
  return false;
}

/* 节奏器（0.41.0）：招式分四档——小招试探 / 连招限制走位 / 中招打伤害+预告 / 大招竭尽全力。
   节拍：小×2 → 连×2 → 中×2 → 大 → 回到小。P1 只有前两档（中招大招 P2 起才算数）。
   先在虚空之影上启用（def.rhythm），以后新 BOSS 都按这套语言设计。 */
function rhythmCast(e, def, ph) {
  const R = def.rhythm;
  if (!e.rh) e.rh = { slot: 'small', n: 0, ci: 0, mi: 0 };
  const rh = e.rh;
  if (ph < 2 && (rh.slot === 'mid' || rh.slot === 'ult')) { rh.slot = 'small'; rh.n = 0; }
  const gapMul = ph === 3 ? .68 : ph === 2 ? .84 : 1;
  if (rh.slot === 'small') {
    const mv = def.moves[e.mvIdx % def.moves.length]; e.mvIdx++;
    if (ATK[mv]) castMove(mv, ATK[mv], e, ph);
    rh.n++;
    if (rh.n >= (R.small || 2)) { rh.slot = 'combo'; rh.n = 0; }
    e.timer = bossGap(e, def) * gapMul * rnd(.88, 1.14);
  } else if (rh.slot === 'combo') {
    const list = def.rhCombos || [];
    if (list.length) {
      const mv = list[rh.ci % list.length]; rh.ci++;
      if (ATK[mv]) castMove(mv, ATK[mv], e, ph);
    }
    rh.n++;
    if (rh.n >= (R.combo || 2)) { rh.slot = 'mid'; rh.n = 0; }
    e.timer = bossGap(e, def) * rnd(.9, 1.15);
  } else if (rh.slot === 'mid') {
    const list = def.mids || [];
    if (list.length) {
      const uk = list[rh.mi % list.length]; rh.mi++;
      const info = ULT_INFO[uk] || { name: uk, sub: '' };
      announce(e.bossName + ' · ' + info.name, info.sub, e.color, true);
      castMove(uk, ULT[uk], e, ph);
      e.casting = Math.max(e.casting, 1.0);
      if (!e.ultSeq) { e.rest = bossRest(e, 1.5); e.casting = Math.max(e.casting, 1.5); }
    }
    rh.n++;
    if (rh.n >= (R.mid || 2)) { rh.slot = 'ult'; rh.n = 0; }
    e.timer = bossGap(e, def) * 1.3;
  } else {
    const info = ULT_INFO[def.ult] || { name: def.ult, sub: '' };
    announce(e.bossName + ' · ' + info.name, info.sub, e.color, true);
    castMove(def.ult, ULT[def.ult], e, ph);
    e.casting = Math.max(e.casting, 4.2);   /* 车轮转着的时候它不抢戏 */
    rh.slot = 'small'; rh.n = 0;
    e.timer = bossGap(e, def) * 1.6;
  }
}

function bossThink(e, dt, dx, dy, d) {
  const def = e.def || BOSSES.beast;
  const frac = e.maxHp > 0 ? e.hp / e.maxHp : 1;
  const ph = frac > .66 ? 1 : frac > .33 ? 2 : 3;
  /* 0.42.0 石巨人：变身无敌 / 跳起 / 巨臂计时 / 变身结束起循环 */
  if (e.invuln > 0) e.invuln = Math.max(0, e.invuln - dt);
  if (e.jump > 0) e.jump = Math.max(0, e.jump - dt);
  if (e.giant) e.giant.t += dt;
  /* 0.42.1 跳踩推进：沿抛物线朝落点飞，落地「咚」出全圆周裂地 */
  if (e.leap) {
    const L = e.leap; L.t += dt;
    const k = Math.min(1, L.t / L.dur);
    e.x = L.x0 + (L.x1 - L.x0) * k;
    e.y = L.y0 + (L.y1 - L.y0) * k;
    if (k >= 1) {
      e.leap = null;
      S.shake = Math.min(24, S.shake + 14); S.hitStop = Math.max(S.hitStop, .06);
      addRing(e.x, e.y, '#c9a06a', 14, 560, .5);
      addRing(e.x, e.y, '#fff0d0', 8, 300, .3);
      for (let k2 = 0; k2 < 16; k2++) addPart(e.x + rnd(-64, 64), e.y + rnd(-44, 64), k2 % 2 ? '#a97b52' : '#c9a06a', 280, 5);
      fissureBurst(e.x, e.y, 8, RAD, true, 430, .45, 24 + (e.phase || 3) * 3, '#ffb36b');
      SFX.alarm();
    }
  }
  if (e.titanAt > 0) {
    e.titanAt -= dt;
    if (e.titanAt <= 0 && e.titan && !e.titanStarted) startTitanLoop(e, ph);
  }

  /* 游钻（0.40.0 终极形态）：绕玩家快圈游走，地面裂纹拖尾就是它的位置；
     最后 28% 收圈贴近——贴上去就是它要破土了。破土瞬间无预警直接冲撞。 */
  if (e.burrow) {
    const b = e.burrow;
    b.t += dt;
    const k = Math.min(1, b.t / b.dur);
    const shrink = k > .72 ? (k - .72) / .28 : 0;          /* 收圈段：巡游半径压到贴近 */
    const RR = b.rBase - (b.rBase - 120) * shrink;
    b.orbA += b.orbDir * b.spdA * dt;
    b.x = S.player.x + Math.cos(b.orbA) * RR;
    b.y = S.player.y + Math.sin(b.orbA) * RR;
    e.x = b.x; e.y = b.y;
    b.crackT = (b.crackT || 0) - dt;
    if (b.crackT <= 0) {                                   /* 地裂拖尾：玩家靠它盯位 */
      b.crackT = .085;
      addDecal(e.x + rnd(-16, 16), e.y + rnd(-16, 16), false, '#8a5a32');
    }
    if (k >= 1) {
      e.burrow = null;
      e.gone = false;
      e.popX = e.x; e.popY = e.y;   /* 破土点（测试与特效用） */
      addRing(e.x, e.y, e.color, 16, 760, .5);
      addRing(e.x, e.y, '#ffe0b0', 6, 420, .22);
      for (let k2 = 0; k2 < 14; k2++) addPart(e.x, e.y, k2 % 3 ? '#c9a06a' : e.color, rnd(140, 480), rnd(3, 6));
      for (let k2 = 0; k2 < 7; k2++) addDecal(e.x + rnd(-100, 100), e.y + rnd(-100, 100), k2 === 0);
      S.shake = Math.min(22, S.shake + 12); shakeDir(e.x, e.y, 9);
      S.hitStop = Math.max(S.hitStop, .07);
      SFX.alarm();
      if (Math.hypot(S.player.x - e.x, S.player.y - e.y) < e.r + 52) damagePlayer(e.dmg * 1.15, e.x, e.y);
      /* 无预警直接冲：不摆 winding、不画红线——收圈就是全部预告 */
      const ddx = S.player.x - e.x, ddy = S.player.y - e.y, dl = Math.hypot(ddx, ddy) || 1;
      e.cdx = ddx / dl; e.cdy = ddy / dl;
      e.charging = .5;
      e.casting = 0; e.rest = 0;
      e.timer = .9;               /* 冲完的浮出窗口：也是玩家唯一的输出窗口 */
    }
    return;
  }

  /* 合击错拍：后手延迟一点点放，叠出层次 */
  if (e.pendAct) {
    e.pendAct.t -= dt;
    if (e.pendAct.t <= 0) {
      const f = e.pendAct.fn;
      e.pendAct = null;
      if (e.hp > 0) f();
    }
  }

  if (ph !== e.phase) {
    e.phase = ph;
    S.shake = Math.min(20, S.shake + 13);
    S.flash = .5;
    addRing(e.x, e.y, e.color, 18, 780, .55);
    for (let k = 0; k < 18; k++) addPart(e.x, e.y, e.color, rnd(120, 380), 4);
    if (!e.pack || e.packSolo)
      announce(e.bossName + (ph === 3 ? ' · 狂暴' : ' · 二阶段'),
        ph === 3 ? '形态蜕变：尖刺环显形，招式加快，还会不断召集小怪' : '形态蜕变：外环显形，攻击变快，注意新招式', e.color, true);
    SFX.alarm();
    e.timer = .5;
    e.ultCd = .8;   /* 进新阶段很快接一记招牌大招 */
    /* 0.42.0 荒原：P2 开场直接放中招；P3 变石巨人（变身无敌，一整段重来） */
    if (e.bossId === 'beast' && ph === 2) { e.bs = null; e.timer = .01; }
    if (e.bossId === 'beast' && ph === 3) {
      e.titan = true; e.invuln = 1.6; e.titanAt = 1.7; e.titanStarted = false;
      e.comboSeq = null; e.ultSeq = null; e.charging = 0; e.winding = 0; e.beastMv = null;
      e.rest = 0; e.casting = 0;
      announce(e.bossName + ' · 石巨人', '两臂两腿长出来了——它要一直追着你踩', '#c9a06a', true);
      for (let k = 0; k < 30; k++) addPart(e.x + rnd(-90, 90), e.y + rnd(-90, 90), '#a97b52', 260, 6);
      for (let k = 0; k < 3; k++) addRing(e.x, e.y, '#c9a06a', 20 + k * 14, 900 - k * 120, .6);
      S.flash = Math.max(S.flash, .6); S.hitStop = Math.max(S.hitStop, .12);
      SFX.alarm();
    }
    /* 0.43.0 腐林 P3：小弟当场全灭，本体亲自上，大招常态化 */
    if (e.bossId === 'hive' && ph === 3) {
      for (const m of S.enemies) if (m.hive && m.hp > 0) m.hp = 0;
      S.props = S.props.filter(pr => pr.kind !== 'flower');
      e.comboSeq = null; e.hiveControl = null; e.hiveGrabWatch = null;
      e.hiveUlt = null; e.hiveGiant = null;
      e.rest = 0; e.casting = 0; e.timer = .01;
      announce(e.bossName + ' · 跟你爆了', '小弟都死完了——本体亲自上', e.color, true);
    }
    S.hitStop = Math.max(S.hitStop, .1);
    S.flash = Math.max(S.flash, .3);
    shakeDir(e.x, e.y, 7);
    /* 招式轮转不再归零：mvIdx 从开场一直连续推进，
       保证每家 BOSS 的 5 个小招必然完整放一遍（0.18.1 修：
       以前阶段切换归零，BOSS 掉血快时后两招永远出不来） */
  }

  let vx = 0, vy = 0;
  /* 0.39.0：基础移速提上来了（58 / 双子 50），阶段加速相应收一点，
     不然 P3 乘完 1.65 变成 96px/s，追得离谱 */
  const boost = ph === 3 ? 1.45 : ph === 2 ? 1.2 : 1;
  /* 地震带施法中：脚步放慢、不再堆新招，否则地上同时两套东西没法躲 */
  if (e.casting > 0) e.casting -= dt;
  /* 0.39.0（A 批）：把两个「乘 0」拆成三个「变慢」。
     以前 ultSeq / 力竭 是直接乘 0 —— 裂地横扫 3.35 秒、大招后力竭 1.5 秒里，
     屏幕上一块完全静止的矢量图，那不是硬直，那是掉帧。
     硬直要给玩家的是「它这会儿不还手」，不是「它不动」。
     冲撞走 e.charging 分支（cs = 760 / 900），不经过 sp，所以这里降速不影响冲撞。 */
  const restM = e.rest > 0 ? bossBehaNum(e, 'restMul', .55) : 1;
  const castM = e.casting > 0 ? bossBehaNum(e, 'castMul', .6) : 1;
  const ultM = e.ultSeq ? bossBehaNum(e, 'ultMul', .45) : 1;
  const sp = e.speed * bossSpd(e) * boost * restM * castM * ultM;

  /* --- 狂暴形态行为：P3 起每 6 秒召集两只小怪（所有 BOSS 通用的阶段差异） --- */
  /* 0.43.0 腐林例外：P3 是「小弟都死完了跟你爆了」，不再召唤 */
  if (e.phase >= 3 && e.bossId !== 'hive') {
    e.rageT = (e.rageT || 0) - dt;
    if (e.rageT <= 0) {
      e.rageT = 6;
      if (S.enemies.length < 200 && S.pending.length < 60) {
        S.pending.push({ type: 'grunt', x: e.x + rnd(-60, 60), y: e.y + rnd(-60, 60) },
                        { type: 'swarm', x: e.x + rnd(-60, 60), y: e.y + rnd(-60, 60) });
      }
      addRing(e.x, e.y, '#ff4d6d', 10, 420, .5);
    }
  }

  /* --- 对弈观察：贴脸/风筝时长 + 玩家移动方向，4 秒结算一次画像 --- */
  e.ultCd = Math.max(0, (e.ultCd || 0) - dt);
  e.readCd = Math.max(0, (e.readCd || 0) - dt);
  e.rest = Math.max(0, (e.rest || 0) - dt);   /* 力竭硬直倒计时 */
  e.obsT = (e.obsT || 0) + dt;
  e.obsNear = (e.obsNear || 0) + (d < 210 ? dt : 0);
  e.obsFar = (e.obsFar || 0) + (d > 520 ? dt : 0);
  const pvx = S.player.x - (e.pLastX === undefined ? S.player.x : e.pLastX);
  const pvy = S.player.y - (e.pLastY === undefined ? S.player.y : e.pLastY);
  e.pLastX = S.player.x; e.pLastY = S.player.y;
  e.obsVX = (e.obsVX || 0) * .96 + pvx; e.obsVY = (e.obsVY || 0) * .96 + pvy;
  e.obsMove = (e.obsMove || 0) + Math.hypot(pvx, pvy);
  if (e.obsT >= 4) {
    e.pProfile = e.obsNear / e.obsT > .45 ? 'close'
      : e.obsFar / e.obsT > .45 ? 'far'
      : e.obsMove / e.obsT > 240 ? 'weave' : null;
    e.obsT = 0; e.obsNear = 0; e.obsFar = 0; e.obsMove = 0;
  }

  /* --- 大招三段推进（荒原巨兽样板）：吼→地裂→冲撞→力竭 --- */
  if (e.ultSeq) {
    const q = e.ultSeq; q.t += dt;
    if (q.step === 1 && q.t >= .8) {
      q.step = 2; q.t = 0;
      /* 全圆周裂地（0.30.0）：整圈火环带一波波向外推，钻环带空档跟着波走 */
      const m2 = 3, T2 = .55, st2 = T2 / m2, n2 = 9;
      const dur2 = TIDE.ahead * st2 + n2 * st2 + T2;
      S.hazards.push({
        kind: 'tide', x: e.x, y: e.y,
        r0: e.r + 20, w: 30, pitch: 104, n: n2, m: m2,
        T: T2, dt: st2, dur: dur2,
        born: S.t + TIDE.ahead * st2, life: dur2, max: dur2,
        warn: .32 / T2, spike: (T2 - .32) / T2, ahead: TIDE.ahead,
        dps: 28, color: '#ff7a3d',
      });
      for (let k = 0; k < 10; k++) {
        const a = k / 10 * RAD + .31, dd = 120 + (k % 4) * 78;
        addDecal(e.x + Math.cos(a) * dd, e.y + Math.sin(a) * dd, k === 0);
      }
      S.shake = Math.min(20, S.shake + 12); shakeDir(e.x, e.y, 9);
      S.hitStop = Math.max(S.hitStop, .06);
      SFX.alarm();
    } else if (q.step === 2 && q.t >= 1.15) {
      q.step = 3; q.t = 0;
      const ddx = S.player.x - e.x, ddy = S.player.y - e.y, dl = Math.hypot(ddx, ddy) || 1;
      e.winding = .45; e.cdx = ddx / dl; e.cdy = ddy / dl;   /* 红线预警后高速冲撞 */
      SFX.alarm();
    } else if (q.step === 3 && q.t >= 1.4 && e.charging <= 0 && e.winding <= 0) {
      e.ultSeq = null;
      e.rest = bossRest(e, 2.0);
      if (e.rest > 0) {   /* 0.40.0：狂暴阶段无力竭，也不播破绽 */
        e.casting = Math.max(e.casting, 2.0);
        announce(e.bossName + ' · 力竭', '破绽！放心输出！', '#9fe08a', false);
      }
    }
  }

  /* --- 连招小组推进（0.27.0）：疯狂射击 / 超级撞击这类「一招多段」小连招 --- */
  if (e.comboSeq) {
    const q = e.comboSeq; q.t += dt;
    while (q.i < q.steps.length && q.t >= q.steps[q.i].t) {
      castMove(q.steps[q.i].mv || null, q.steps[q.i].fn, e, ph); q.i++;
    }
    if (q.t >= q.dur) {
      /* 0.42.0：石巨人 P3 的整套循环会无限重放，普通连段只跑一遍 */
      if (q.loop) { q.t = 0; q.i = 0; }
      else {
        e.comboSeq = null;
        e.timer = Math.max(e.timer, bossGap(e, def) * (ph === 3 ? .68 : ph === 2 ? .84 : 1));
      }
    }
  }

  if (e.charging > 0) {
    e.charging -= dt;
    const cs = ph === 3 ? 900 : 760;
    vx = e.cdx * cs; vy = e.cdy * cs;
    if (Math.random() < .7) addPart(e.x, e.y, e.color, 110, 3);
    if (e.charging <= 0) {
      e.charging = 0;
      e.chargeCd = ph === 3 ? 3.6 : 5.0;
      e.timer = Math.max(e.timer, .35);
      S.shake = Math.min(16, S.shake + 6);
      addRing(e.x, e.y, e.color, 10, 480, .35);
      for (let k = 0; k < 10; k++) addPart(e.x, e.y, e.color, rnd(100, 260), 3);
    }
  } else if (e.winding > 0) {
    e.winding -= dt;
    if (Math.random() < .55) addPart(e.x + rnd(-22, 22), e.y + rnd(-22, 22), e.color, 70, 2);
    if (e.winding <= 0) {
      e.charging = .48;
      S.shake = Math.min(14, S.shake + 4);
    }
  } else if (e.packSolo) {
    /* 终极形态（0.40.0 游钻突袭）：地上只干一件事——撞你。
       冲完这段浮出窗口（也是唯一能打到它的窗口），立刻再钻。
       狂暴的东西不讲招式：大招小招全免。 */
    e.timer -= dt;
    if (e.timer <= 0 && e.charging <= 0 && e.winding <= 0) {
      castMove('burrow', ATK.burrow, e, ph);
    }
  } else {
    /* 0.39.0（B 批）：移动意图 + 硬直姿态，见 bossMotion()。
       以前这里只有「远了追 / 近了退 / 不远不近固定半径绕圈」三个分支，
       距离一跨阈值方向那一帧就翻，看久了就是钟摆。 */
    const mv = (e.bossId === 'beast')
      ? beastMove(e, dt, dx, dy, d, sp, def, ph)   /* 0.42.0：土坡滑行 / 沙爆推进 / 石巨人追人 */
      : (e.bossId === 'hive' && e.hiveGiant)
        ? hiveMove(e, dt, dx, dy, d, sp, def, ph) /* 0.43.2：巨形态矢量限速，慢慢绕着玩家走 */
        : bossMotion(e, dt, dx, dy, d, sp, def, ph);
    vx = mv.vx; vy = mv.vy;

    /* 荒原巨兽：走动扬尘，大就是强 */
    if (e.bossId === 'beast' && (vx || vy) && Math.random() < .3) {
      addPart(e.x + rnd(-e.r * .5, e.r * .5), e.y + e.r * .75, '#8a6a52', 60, 2);
    }
    /* 蛇形：身体扭动感 */
    if (e.shape === 'serpent') {
      const wob = Math.sin(S.t * 2.4 + (e.twinPart || 0)) * .55;
      const nx = Math.cos(Math.atan2(dy, dx) + Math.PI / 2);
      const ny = Math.sin(Math.atan2(dy, dx) + Math.PI / 2);
      vx += nx * sp * wob; vy += ny * sp * wob;
    }

    e.timer -= dt;
    if (e.timer <= 0) {
      if (e.casting > 0) {
        e.timer = .25;                     /* 还在施法：先不作声，攒着 */
      } else if (def.script === 'beast') {
        /* 0.42.0：荒原三阶段各跑各的一套（P3 由石巨人循环接管） */
        if (!(e.titan && (e.invuln > 0 || e.titanAt > 0))) beastSequence(e, def, ph);
      } else if (def.script === 'hive') {
        /* 0.43.0：腐林三阶段脚本（小×2+连 / 中连中×2套后大 / 大招常态化） */
        hiveSequence(e, def, ph);
      } else if (def.rhythm) {
        /* 0.41.0 节奏器：小×2→连×2→中×2→大；对弈招照常伺机插队 */
        let did = false;
        if (e.readCd <= 0 && (diff().read || 0) > 0 && e.pProfile) did = castRead(e, def, ph);
        if (!did) rhythmCast(e, def, ph);
      } else if (ph >= 2 && e.ultCd <= 0 && def.ult && ULT[def.ult]) {
        /* 招牌大招：喊名 → 放招 → 施法硬直；有第二大招（如荒原·地爆天星）就轮着放 */
        const uk = (def.ult2 && ULT[def.ult2] && (e.ultTgl = !e.ultTgl)) ? def.ult2 : def.ult;
        const info = ULT_INFO[uk] || { name: uk, sub: '' };
        announce(e.bossName + ' · ' + info.name, info.sub, e.color, true);
        castMove(uk, ULT[uk], e, ph);
        e.ultCd = bossUltGap(e, ph === 3 ? 9.5 : 14);
        e.casting = 1.0;
        if (!e.ultSeq) { e.rest = bossRest(e, 1.5); e.casting = Math.max(e.casting, 1.5); }   /* 大招后力竭窗口 */
        e.timer = bossGap(e, def) * 1.2;
      } else if (e.readCd <= 0 && (diff().read || 0) > 0 && e.pProfile) {
        /* 对弈招：按玩家画像挑招，且必须在 BOSS 自己的对弈表里（0.41.0 抽出共用） */
        castRead(e, def, ph);
      } else {
        const moves = (e.packSolo && e.mergedMoves) ? e.mergedMoves : (def.moves || ['ring']);
        let mv;
        if (e.nextMv && ATK[e.nextMv]) { mv = e.nextMv; e.nextMv = null; }   /* 连段第二段优先 */
        else { mv = moves[e.mvIdx % moves.length]; e.mvIdx++; }
        if (ATK[mv]) castMove(mv, ATK[mv], e, ph);
        e.lastMv = mv;
        /* 连段：上一招在 combo 表里就概率快速接第二段（普通 20%/困难 35%/噩梦 50%） */
        const chainP = (diff().chain || .2) * bossChain(e);   /* 连段概率独立字段（0.30.0）；调试台可乘倍率 */
        if (def.combo && def.combo[mv] && ATK[def.combo[mv]] && Math.random() < chainP) {
          e.nextMv = def.combo[mv];
          e.timer = .45;
        } else {
          e.timer = bossGap(e, def) * (ph === 3 ? .68 : ph === 2 ? .84 : 1) * rnd(.88, 1.14);
        }
      }
    }
  }

  /* 0.37.0 去「贴图感」：一阶惯性。
     以前追击↔后撤↔绕圈是三个分支直接赋值，距离跨过阈值那一帧速度方向瞬变，
     所以看着像一块贴图被硬拽着走。这里让速度有时间跟上目标。 */
  const resp = (e.charging > 0 || e.winding > 0) ? 26 : 5.5;   /* 冲撞/蓄力要快，平时要软 */
  const kAcc = 1 - Math.exp(-resp * dt);
  e.vx = (e.vx || 0) + (vx - (e.vx || 0)) * kAcc;
  e.vy = (e.vy || 0) + (vy - (e.vy || 0)) * kAcc;
  e.spd = Math.hypot(e.vx, e.vy);
  /* 0.39.0 转身过渡：以前 face 是 ±1 瞬时翻转，同一帧整只镜像，像贴图翻面。
     改成 0.1 秒连续过渡，途中被压窄（绘制侧 faceS() 保底 22% 宽），
     看起来才是「转身」，不是「换了一张图」。 */
  if (Math.abs(e.vx) > 6) {
    const ftg = e.vx < 0 ? -1 : 1;
    if (e.face === undefined) e.face = ftg;
    else e.face += (ftg - e.face) * (1 - Math.exp(-14 * dt));
  }
  /* 踏步相位：步频跟移速走；硬直里给一段慢步频，身体一直在晃 */
  e.stepPh = (e.stepPh || 0) + dt * (e.spd > 4 ? e.spd * .055 : (e.rest > 0 ? 1.5 : .55));
  /* 修 bug：BOSS 走的是这条 return 分支，以前永远走不到 updateEnemyAI 里的
     sqT 衰减，而伤害函数对它是无条件赋 .14 —— 于是受击挤压计时只增不减 */
  if (e.sqT > 0) e.sqT -= dt;

  e.x += e.vx * dt;
  e.y += e.vy * dt;
  if (e.x < e.r) e.x = e.r; else if (e.x > WORLD.w - e.r) e.x = WORLD.w - e.r;
  if (e.y < e.r) e.y = e.r; else if (e.y > WORLD.h - e.r) e.y = WORLD.h - e.r;
}

/* ---------- BOSS 附加形态：蛇身 / 手臂 / 双子连线 ---------- */
function updateBossExtras(dt) {
  const p = S.player;
  for (const e of S.enemies) {
    if (e.hp <= 0 || e.type !== 'boss') continue;

    /* 蛇身：一节咬着一节 */
    if (e.shape === 'serpent' && e.segs.length) {
      let px = e.x, py = e.y;
      for (let i = 0; i < e.segs.length; i++) {
        const s = e.segs[i];
        const ddx = px - s.x, ddy = py - s.y;
        const dd = Math.hypot(ddx, ddy) || 1;
        const want = (i === 0 ? e.r : e.segs[i - 1].r) * .92;
        if (dd > want) {
          s.x += ddx / dd * (dd - want);
          s.y += ddy / dd * (dd - want);
        }
        /* 身体也会烫人，但比头轻 */
        const rr = s.r + p.r;
        if (d2(s.x, s.y, p.x, p.y) < rr * rr) damagePlayer(e.dmg * .5, s.x, s.y);
        px = s.x; py = s.y;
      }
    }

    /* 空洞怪：两条手臂伸向玩家，扫击时抡过去 */
    if (e.shape === 'hollow' && e.arms.length) {
      for (const arm of e.arms) {
        let reach = 142;
        let ang = Math.atan2(p.y - e.y, p.x - e.x) + arm.side * .55;
        if (arm.sw > 0) {
          arm.sw -= dt;
          const t = 1 - Math.max(0, arm.sw) / .95;
          ang = Math.atan2(p.y - e.y, p.x - e.x) + arm.side * (1.1 - t * 2.5);
          reach = 168;
        }
        const bx = e.x + Math.cos(ang - arm.side * .8) * e.r * .75;
        const by = e.y + Math.sin(ang - arm.side * .8) * e.r * .75;
        const tx = e.x + Math.cos(ang) * reach;
        const ty = e.y + Math.sin(ang) * reach;
        const seg = arm.seg;
        for (let i = 0; i < seg.length; i++) {
          const t = i / (seg.length - 1);
          const gx = bx + (tx - bx) * t;
          const gy = by + (ty - by) * t;
          const k = Math.min(1, dt * 16);
          seg[i].x += (gx - seg[i].x) * k;
          seg[i].y += (gy - seg[i].y) * k;
          const rr = seg[i].r + p.r;
          if (d2(seg[i].x, seg[i].y, p.x, p.y) < rr * rr) {
            damagePlayer(e.dmg * (arm.sw > 0 ? .9 : .55), seg[i].x, seg[i].y);
          }
        }
      }
    }

    /* 双子：互相牵着，中间那条线带电 */
    if (e.shape === 'twin' && e.twin && e.twin.hp > 0) {
      const t2 = e.twin;
      const ddx = t2.x - e.x, ddy = t2.y - e.y;
      const dd = Math.hypot(ddx, ddy) || 1;
      const want = 300;
      if (dd > want) {
        const push = (dd - want) * .5;
        e.x += ddx / dd * push; e.y += ddy / dd * push;
        t2.x -= ddx / dd * push; t2.y -= ddy / dd * push;
      }
      /* 点到线段距离 < 16 就触电 */
      if (S.t - (e.lastLink || -9) > .45) {
        const l2 = ddx * ddx + ddy * ddy;
        let tt = ((p.x - e.x) * ddx + (p.y - e.y) * ddy) / (l2 || 1);
        tt = clamp(tt, 0, 1);
        const qx = e.x + ddx * tt, qy = e.y + ddy * tt;
        if (Math.hypot(p.x - qx, p.y - qy) < 18) {
          damagePlayer(e.dmg * .45, qx, qy);
          e.lastLink = S.t;
          for (let k = 0; k < 5; k++) addPart(qx, qy, '#c37bff', rnd(60, 200), 2);
        }
      }
    }
  }
  updateHive(dt);   /* 0.43.0：场物件 / 抓取 / 控制弹抓 / 大招时间线 */
}

/* 每种敌人一套行为：这就是「状态机」在实战里的样子 */
function explodeBomber(e) {
  if (e.hp <= 0) return;
  e.hp = 0;
  addRing(e.x, e.y, '#ff8a5c', 12, 640, .34);
  addRing(e.x, e.y, '#ffffff', 4, 300, .18);
  S.shake = Math.min(15, S.shake + 8);
  S.flash = Math.max(S.flash, .25);
  SFX.kill();
  for (let k = 0; k < 22; k++) addPart(e.x, e.y, k % 3 ? '#ff7a3d' : '#ffd24a', rnd(90, 340), 3);
  const p = S.player;
  if (Math.hypot(p.x - e.x, p.y - e.y) < 112) damagePlayer(e.dmg, e.x, e.y);
}

function updateEnemyAI(e, dt, p) {
  if (e.type === 'elite' && e.affix && e.affix.length) eliteThink(e, dt, p);
  /* 0.43.0 腐林小弟：出土期只长个儿，不动不咬；出土后各干各的 */
  if (e.hive) {
    if (e.growT > 0) {
      e.growT -= dt;
      e.growK = clamp(1 - e.growT / (e.growMax || 1), 0, 1);
      e.spd = 0;
      return;
    }
    e.growK = 1;
    if (e.hive === 'pea') {
      e.spd = 0;                       /* 炮台钉在地上，不追人 */
      e.timer -= dt;
      if (e.timer <= 0) {
        e.timer = HIVE.pea.cd;
        /* 方向出手瞬间锁死：不追踪、不重新瞄准，射程按 life×速度给足 */
        shootEnemyBullet(e, p, e.peaAng, HIVE.pea.spd, HIVE.pea.dmg * phMul(1),
          { color: HIVE.c.pea, kind: 'spore', r: HIVE.pea.r, life: HIVE.pea.life });
        addRing(e.x, e.y, HIVE.c.pea, 4, 90, .2);
      }
      return;
    }
  }
  const dx = p.x - e.x, dy = p.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = e.speed * (e.slowT > 0 ? .5 : 1);
  let vx = dx / d * sp, vy = dy / d * sp;

  if (e.type === 'charger') {
    if (e.st === 'move') {
      if (d < 330) { e.st = 'wind'; e.timer = .55; }
    } else if (e.st === 'wind') {
      e.timer -= dt;
      vx = 0; vy = 0;
      if (e.timer <= 0) { e.st = 'dash'; e.timer = .4; e.dx = dx / d; e.dy = dy / d; }
    } else {
      e.timer -= dt;
      const s2 = e.speed * 5.4;
      vx = e.dx * s2; vy = e.dy * s2;
      if (Math.random() < .5) addPart(e.x, e.y, e.color, 60, 2);
      if (e.timer <= 0) { e.st = 'move'; e.timer = .35; }
    }
  } else if (e.type === 'caster') {
    if (d < 210) { vx = -dx / d * e.speed * .9; vy = -dy / d * e.speed * .9; }
    else if (d < 300) { vx = 0; vy = 0; }
    e.timer -= dt;
    if (e.timer <= 0 && d < 640) { e.timer = 2.1; shootEnemyBullet(e, p); }
  } else if (e.type === 'bomber') {
    if (e.fuse > 0) {
      e.fuse -= dt;
      vx *= .15; vy *= .15;
      if (Math.random() < .4) addPart(e.x, e.y, '#ffb36b', 90, 2);
      if (e.fuse <= 0) { explodeBomber(e); return; }
    } else {
      vx = dx / d * sp * 1.45; vy = dy / d * sp * 1.45;
      if (d < 78) { e.fuse = .7; SFX.alarm(); }
    }
  } else if (e.type === 'summoner') {
    if (d < 320) { vx = -dx / d * sp * 1.1; vy = -dy / d * sp * 1.1; }
    else if (d < 460) { vx = 0; vy = 0; }
    e.timer -= dt;
    if (e.timer <= 0) {
      e.timer = 4.2;
      if (S.enemies.length < 170) {
        for (let k = 0; k < 2; k++) S.pending.push({ type: 'swarm', x: e.x + rnd(-34, 34), y: e.y + rnd(-34, 34) });
        addRing(e.x, e.y, e.color, 10, 320, .4);
        SFX.zap();
      }
    }
  } else if (e.type === 'boss') {
    bossThink(e, dt, dx, dy, d);
    return;
  }

  /* 迅捷词缀冲刺：压过普通移动 */
  if (e.dashT > 0) {
    e.dashT -= dt;
    vx = e.dx * e.speed * 4.4;
    vy = e.dy * e.speed * 4.4;
    if (Math.random() < .5) addPart(e.x, e.y, e.color, 70, 2);
  }

  /* v3：只做水平翻转，不再旋转。e.ang 仍保留（BOSS 冲撞/对弈招要用） */
  e.spd = Math.hypot(vx, vy);
  if (Math.abs(vx) > 8) e.face = vx < 0 ? -1 : 1;
  if (e.sqT > 0) e.sqT -= dt;

  e.x += vx * dt;
  e.y += vy * dt;
  /* 冲撞也不会飞出世界 */
  if (e.x < e.r) e.x = e.r; else if (e.x > WORLD.w - e.r) e.x = WORLD.w - e.r;
  if (e.y < e.r) e.y = e.r; else if (e.y > WORLD.h - e.r) e.y = WORLD.h - e.r;
}

/* ---------- 更新 ---------- */
/* =========================================================
   特效基建 0.26.0：方向性屏震 + 裂痕残留（decal）+ BOSS 领域特效
   ========================================================= */
function shakeDir(x, y, power) {
  /* 从攻击源指向玩家的方向猛推一下镜头 */
  const a = Math.atan2(S.player.y - y, S.player.x - x);
  S.shakeVX = (S.shakeVX || 0) + Math.cos(a) * power;
  S.shakeVY = (S.shakeVY || 0) + Math.sin(a) * power;
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  return 'rgba(' + parseInt(h.substr(0, 2), 16) + ',' + parseInt(h.substr(2, 2), 16) + ',' + parseInt(h.substr(4, 2), 16) + ',' + a + ')';
}

/* 裂痕残留：招式把地面打裂，6 秒后慢慢淡掉（战场越打越碎） */
function addDecal(x, y, big, color) {
  S.decals.push({ x: x, y: y, big: big ? 1.6 : 1, color: color || '#c96a3a', born: S.t });
  if (S.decals.length > 26) S.decals.shift();
}

function drawDecals() {
  const LIFE = 6;   /* 用户拍板：残留 6 秒，要的就是乱 */
  for (let i = S.decals.length - 1; i >= 0; i--) {
    const c = S.decals[i];
    const age = S.t - c.born;
    if (age > LIFE) { S.decals.splice(i, 1); continue; }
    const fade = age > LIFE - 1.5 ? (LIFE - age) / 1.5 : 1;
    ctx.save();
    for (let k = 0; k < 4; k++) {
      const a0 = k / 4 * RAD + c.x * .13 + c.y * .07;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      for (let j = 1; j <= 3; j++) {
        const aa = a0 + Math.sin(c.born * 9 + k * 3.7 + j * 2.9) * .28;
        ctx.lineTo(c.x + Math.cos(aa) * 26 * j * c.big, c.y + Math.sin(aa) * 26 * j * c.big);
      }
      ctx.globalAlpha = .55 * fade;
      ctx.strokeStyle = '#241512';
      ctx.lineWidth = 3.2 * c.big;
      ctx.stroke();
      ctx.globalAlpha = .75 * fade;
      ctx.strokeStyle = c.color;
      ctx.lineWidth = 1.1 * c.big;
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ---------- 领域特效：BOSS 把周围地面同化成自己的元素领域 ----------
   不是换颜色：每种 look 一套动态纹样（裂谷/余烬/巨齿/浮冰/扭曲/脉冲） */
const DOMAIN_LOOK = {
  horn: 'cracks', fire: 'embers', maw: 'teeth',
  crystal: 'shards', void: 'warp', eye: 'pulse',
};

function drawDomains() {
  for (const e of S.enemies) {
    if (e.type !== 'boss') continue;
    const R = e.r * 4.4 + (e.phase || 1) * 26;
    const v = visRect();
    if (e.x + R < S.cam.x || e.x - R > S.cam.x + v.w ||
        e.y + R < S.cam.y || e.y - R > S.cam.y + v.h) continue;
    const pat = DOMAIN_LOOK[e.look] || 'pulse';
    const alpha = e.phase >= 3 ? .15 : .10;
    ctx.save();
    /* 底色：元素色浸染地面 */
    const grad = ctx.createRadialGradient(e.x, e.y, e.r * .6, e.x, e.y, R);
    grad.addColorStop(0, hexA(e.color, alpha));
    grad.addColorStop(1, hexA(e.color, 0));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, RAD); ctx.fill();
    /* 图案层 */
    ctx.globalAlpha = Math.min(.45, alpha * 2.4);
    ctx.strokeStyle = e.color; ctx.fillStyle = e.color;
    if (pat === 'cracks') {
      ctx.lineWidth = 2;
      for (let k = 0; k < 6; k++) {
        const a0 = k / 6 * RAD + S.t * .1;
        ctx.beginPath(); ctx.moveTo(e.x, e.y);
        for (let j = 1; j <= 4; j++) {
          const aa = a0 + Math.sin(k * 5.1 + j * 2.3) * .22;
          ctx.lineTo(e.x + Math.cos(aa) * R * .3 * j, e.y + Math.sin(aa) * R * .3 * j);
        }
        ctx.stroke();
      }
    } else if (pat === 'embers') {
      for (let k = 0; k < 8; k++) {
        const pr = (S.t * 34 + k * 47) % (R - 20);
        const aa = k / 8 * RAD + Math.sin(S.t * 1.3 + k) * .6;
        ctx.globalAlpha = Math.min(.6, alpha * 3 * pr / R);
        ctx.beginPath(); ctx.arc(e.x + Math.cos(aa) * (R - pr), e.y + Math.sin(aa) * (R - pr), 2.4, 0, RAD); ctx.fill();
      }
    } else if (pat === 'teeth') {
      ctx.lineWidth = 1.6;
      for (let k = 0; k < 10; k++) {
        const aa = k / 10 * RAD + S.t * .25;
        const rr = R * .82;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(aa - .09) * rr, e.y + Math.sin(aa - .09) * rr);
        ctx.lineTo(e.x + Math.cos(aa) * rr * .62, e.y + Math.sin(aa) * rr * .62);
        ctx.lineTo(e.x + Math.cos(aa + .09) * rr, e.y + Math.sin(aa + .09) * rr);
        ctx.closePath(); ctx.stroke();
      }
    } else if (pat === 'shards') {
      for (let k = 0; k < 7; k++) {
        const aa = k / 7 * RAD - S.t * .2;
        ctx.save();
        ctx.translate(e.x + Math.cos(aa) * R * .55, e.y + Math.sin(aa) * R * .55);
        ctx.rotate(aa + S.t);
        ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(5, 6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    } else if (pat === 'warp') {
      ctx.setLineDash([10, 14]); ctx.lineWidth = 1.6;
      for (let k = 0; k < 3; k++) {
        const rr = 26 + (S.t * 30 + k * R / 3) % R;
        ctx.globalAlpha = Math.min(.5, alpha * 3 * (1 - rr / R));
        ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, RAD); ctx.stroke();
      }
      ctx.setLineDash([]);
    } else {   /* pulse：同心脉冲 */
      ctx.lineWidth = 1.8;
      for (let k = 0; k < 3; k++) {
        const rr = R * .3 + (S.t * 26 + k * R / 3) % (R * .7);
        ctx.globalAlpha = Math.min(.5, alpha * 3 * (1 - rr / R));
        ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, RAD); ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function update(dt) {
  const p = S.player, st = S.st;

  if (S.hitStop > 0) { S.hitStop -= dt; dt *= .15; }
  S.t += dt;
  /* 方向性屏震：沿攻击方向推一下再指数衰减（比纯随机震动更有打击感） */
  S.shakeVX *= Math.exp(-7 * dt); S.shakeVY *= Math.exp(-7 * dt);
  if (S.mode === 'play') S.stageT += dt;

  /* 秒伤：0.25s 一格，回看 3 秒 */
  S.dpsTick -= dt;
  if (S.dpsTick <= 0) {
    S.dpsTick += .25;
    S.dpsBuf[S.dpsIdx] = S.dmgAcc;
    S.dpsIdx = (S.dpsIdx + 1) % 12;
    S.dmgAcc = 0;
    let sum = 0;
    for (let i = 0; i < 12; i++) sum += S.dpsBuf[i];
    S.dps = sum / 3;
    if (S.dps > S.dpsPeak) S.dpsPeak = S.dps;
  }

  let ix = 0, iy = 0;
  if (keys['KeyA'] || keys['ArrowLeft']) ix--;
  if (keys['KeyD'] || keys['ArrowRight']) ix++;
  if (keys['KeyW'] || keys['ArrowUp']) iy--;
  if (keys['KeyS'] || keys['ArrowDown']) iy++;
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy);
    if (l > 6) { const m = Math.min(1, l / 60); ix = dx / l * m; iy = dy / l * m; }
  }
  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }
  if (mag > .02) { p.ax = ix; p.ay = iy; }
  if (p.slowT > 0) p.slowT -= dt;
  if (S.hiveGrab) { ix = 0; iy = 0; }   /* 0.43.0：被藤蔓抓住，这一帧不听摇杆 */
  const pm = p.slowT > 0 ? .55 : 1;   /* 被冰霜冻慢 */
  p.x = clamp(p.x + ix * st.speed * pm * dt, p.r, WORLD.w - p.r);
  p.y = clamp(p.y + iy * st.speed * pm * dt, p.r, WORLD.h - p.r);

  if (p.inv > 0) p.inv -= dt;
  if (st.regen > 0) p.hp = Math.min(p.maxHp, p.hp + st.regen * dt);

  updateWeapons(dt);

  /* 陨星火雨：预警→砸落→留火坑 */
  if (S.meteors && S.meteors.length) {
    for (let i = S.meteors.length - 1; i >= 0; i--) {
      const m = S.meteors[i];
      m.t -= dt;
      if (m.t > 0) continue;
      S.meteors.splice(i, 1);
      aoeDamage(m.x, m.y, m.r, m.dmg, '#ff8a5c');
      addHazard('fire', m.x, m.y, { r: 52, dps: 11, color: '#ff7a3d', life: m.burn, warm: .1 });
      addRing(m.x, m.y, '#ff8a5c', 13, m.r * 3, .36);
      addRing(m.x, m.y, '#ffffff', 5, m.r * 1.6, .18);
      S.shake = Math.min(13, S.shake + 5);
      for (let k = 0; k < 12; k++) addPart(m.x, m.y, k % 2 ? '#ff8a5c' : '#ffd24a', rnd(90, 320), 3);
      SFX.kill();
    }
  }

  /* 精英·雷电词缀：预警落雷劈玩家 */
  if (S.estrikes && S.estrikes.length) {
    for (let i = S.estrikes.length - 1; i >= 0; i--) {
      const s2 = S.estrikes[i];
      s2.t -= dt;
      if (s2.t > 0) continue;
      S.estrikes.splice(i, 1);
      addRing(s2.x, s2.y, '#ffe95a', 9, s2.r * 3, .3);
      if (S.bolts.length > 26) S.bolts.shift();
      S.bolts.push({ pts: [{ x: s2.x, y: s2.y - 540 }, { x: s2.x, y: s2.y }], life: .24, max: .24, color: '#ffe95a' });
      if (Math.hypot(p.x - s2.x, p.y - s2.y) < s2.r + p.r) damagePlayer(s2.dmg, s2.x, s2.y);
      SFX.zap();
    }
  }

  /* 玩家弹丸 */
  for (let i = S.bullets.length - 1; i >= 0; i--) {
    const b = S.bullets[i];
    b.tx = b.x; b.ty = b.y;   /* 记录上一帧位置，绘制时画拖尾 */

    /* 回旋镖：飞出后折返，回程可再次命中 */
    if (b.boom) {
      b.fly += dt;
      b.rot = (b.rot || 0) + 16 * dt;
      if (!b.back && b.fly > b.outTime) b.back = true;
      if (b.back) {
        const ang = Math.atan2(p.y - b.y, p.x - b.x);
        b.vx += Math.cos(ang) * 3000 * dt;
        b.vy += Math.sin(ang) * 3000 * dt;
        const sp2 = Math.hypot(b.vx, b.vy);
        if (sp2 > 900) { b.vx = b.vx / sp2 * 900; b.vy = b.vy / sp2 * 900; }
        if (S.t - (b.lastClear || 0) > .22) { b.hit.length = 0; b.lastClear = S.t; }
        if (Math.hypot(p.x - b.x, p.y - b.y) < 26) b.life = 0;
      }
    }

    /* 追踪飞弹：转向最近未命中敌人 */
    if (b.hom && b.life > 0) {
      let tg = null, bd = 1e9;
      for (const e of S.enemies) {
        if (e.hp <= 0 || b.hit.includes(e)) continue;
        const dd = d2(b.x, b.y, e.x, e.y);
        if (dd < bd) { bd = dd; tg = e; }
      }
      if (tg) {
        const ha = Math.atan2(tg.y - b.y, tg.x - b.x);
        const a0 = Math.atan2(b.vy, b.vx);
        let da = ha - a0;
        while (da > Math.PI) da -= RAD;
        while (da < -Math.PI) da += RAD;
        const na = a0 + clamp(da, -b.hom * dt, b.hom * dt);
        const sp0 = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp0; b.vy = Math.sin(na) * sp0;
      }
    }
    /* 水雷：出手后慢慢漂到几乎停住，悬在场中等敌人撞 */
    if (b.mine) {
      b.vx *= Math.max(0, 1 - 1.2 * dt);
      b.vy *= Math.max(0, 1 - 1.2 * dt);
      b.y += Math.sin(S.t * 3 + (b.born || 0)) * 6 * dt;
    }

    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let dead = b.life <= 0;
    if (dead && b.mine) explodeMine(b);   /* 到期没等到人，原地自爆 */
    if (!dead) {
      for (const e of S.enemies) {
        if (e.hp <= 0 || b.hit.includes(e)) continue;
        const rr = b.r + hiveHitR(e);
        if (d2(b.x, b.y, e.x, e.y) < rr * rr) {
          if (b.mine) { explodeMine(b); dead = true; break; }
          hitEnemy(e, b.dmg, b.color, b.x, b.y, b.critB);
          if (b.chill) e.slowT = Math.max(e.slowT || 0, b.chill);
          b.hit.push(e);
          if (b.boom) { /* 无限贯穿，靠折返结束 */ }
          else if (b.pierce > 0) b.pierce--; else dead = true;
          break;
        }
      }
    }
    if (dead) { S.bullets.splice(i, 1); bulletPool.push(b); }
  }

  /* 敌人子弹：支持波形飞行 / 重力 / 追踪 / 落点效果 */
  for (let i = S.ebullets.length - 1; i >= 0; i--) {
    const b = S.ebullets[i];
    if (b.wave) {
      const age = S.t - b.born;
      const side = b.ang0 + Math.PI / 2;
      const wob = Math.cos(age * 7) * b.amp;
      b.x += (b.vx + Math.cos(side) * wob) * dt;
      b.y += (b.vy + Math.sin(side) * wob) * dt;
    } else {
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    if (b.gravity) b.vy += b.gravity * dt;
    if (b.homing) {
      const ha = Math.atan2(p.y - b.y, p.x - b.x);
      const sp0 = Math.hypot(b.vx, b.vy) || 1;
      b.vx += Math.cos(ha) * b.homing * dt;
      b.vy += Math.sin(ha) * b.homing * dt;
      const ns = Math.hypot(b.vx, b.vy) || 1;
      if (ns > sp0 * 1.12) { b.vx = b.vx / ns * sp0 * 1.12; b.vy = b.vy / ns * sp0 * 1.12; }
    }
    if (b.grow) b.r += b.grow * dt;
    if (b.fan) fanSplit(b);
    b.life -= dt;

    let dead = b.life <= 0;
    if (!dead) {
      const rr = b.r + p.r;
      if (d2(b.x, b.y, p.x, p.y) < rr * rr) {
        damagePlayer(b.dmg, b.x, b.y);
        if (b.chillP) p.slowT = Math.max(p.slowT || 0, b.chillP);   /* 冰霜词缀：冻慢玩家 */
        dead = true;
      }
    }
    if (dead) {
      if (b.onEnd) ebulletEnd(b);
      S.ebullets.splice(i, 1);
    }
  }

  /* 敌人：AI + 软分离 + 接触伤害 */
  for (const e of S.enemies) {
    if (e.hp <= 0) continue;
    if (e.slowT > 0) e.slowT -= dt;
    if (e.flash > 0) e.flash -= dt;
    const wasGone = e.gone;
    updateEnemyAI(e, dt, p);
    /* 钻地（0.37.1 修）：AI 必须照常跑 —— 破土靠的就是 bossThink 里 b.t 的推进。
       以前这一句在 updateEnemyAI 之前，钻下去以后 AI 不再被调用，
       b.t 永远不涨，整只卡在地下再也不出来（双子终极形态「一直在原地不动」的根因）。
       改成 AI 之后再用「更新前的状态」跳过碰撞：破土那一帧也不额外吃一次接触伤害。 */
    if (wasGone) continue;

    let dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy);
    const contact = e.r + p.r;
    if (d < contact) {
      const nx = d > .001 ? dx / d : 1, ny = d > .001 ? dy / d : 0;
      e.x = p.x - nx * contact;
      e.y = p.y - ny * contact;
      d = contact;
    }
    if (d <= contact + 1 && e.st !== 'wind' && !(e.growT > 0)) damagePlayer(e.dmg, e.x, e.y);
  }

  /* BOSS 的蛇身 / 手臂 / 双子连线，以及地面火池冰墙 */
  updatePacks(dt);
  updateBossExtras(dt);
  updateHazards(dt);

  /* 清理死亡 */
  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const e = S.enemies[i];
    if (e.hp > 0) continue;
    S.kills++;
    const big = e.r > 16;
    addRing(e.x, e.y, e.color, big ? 14 : 8, big ? 520 : 340, big ? .42 : .28);
    addRing(e.x, e.y, '#ffffff', 3, big ? 260 : 170, .16);
    if (big) S.hitStop = Math.max(S.hitStop, .05);
    else if (S.hitStop <= 0 && Math.random() < .12) S.hitStop = .022;
    SFX.kill();
    addBoom(e.x, e.y, big);
    const n = big ? 16 : 8;
    for (let k = 0; k < n; k++) addPart(e.x, e.y, e.color, rnd(70, 280), big ? 4 : 3);
    addGem(e.x, e.y, e.xp);

    if (e.type === 'splitter') {
      for (let k = 0; k < 3; k++) spawnAt('swarm', e.x + rnd(-18, 18), e.y + rnd(-18, 18));
    }
    S.coins += Math.round((e.type === 'boss' ? 60 : e.type === 'elite' ? 25 : 1) * diff().gold);
    if (e.type === 'boss') {
      const bi = S.bosses.indexOf(e);
      if (bi >= 0) S.bosses.splice(bi, 1);
      /* 双子族：崩解那只已经播过「被撕开」，同族全灭时只宣布一次 */
      const pk = packOf(e);
      const quiet = e.packBroken || (pk && pk.announced);
      if (pk) pk.announced = true;
      const left = S.bosses.length;
      const isRush = S.runMode === 'rush';
      if (!quiet) {
        announce(left > 0 ? '一个 BOSS 倒下' : (isRush ? 'BOSS 击破' : 'BOSS 全部击破'),
          left > 0 ? ('还剩 ' + left + ' 个')
            : (isRush ? '回复 25 点生命 · 下一个马上来' : '回复 25 点生命 · 金币 +60'), '#ff9ec2', true);
        S.player.hp = Math.min(S.player.maxHp, S.player.hp + 25);
      }
      S.flash = .8;
      S.shake = 16;
    }
    if (e.type === 'elite') announce('精英击破', '金币 +25', '#ffd24a', false);
    if (S.st.lifesteal > 0 && S.player.hp < S.player.maxHp) {
      const heal = S.st.lifesteal * (e.type === 'swarm' ? .5 : e.type === 'boss' ? 14 : 1);
      S.player.hp = Math.min(S.player.maxHp, S.player.hp + heal);
    }
    S.enemies.splice(i, 1);
  }

  /* 经验宝石 */
  for (let i = S.gems.length - 1; i >= 0; i--) {
    const g = S.gems[i];
    const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < 20) {
      gainXP(g.v);
      SFX.pick();
      addPart(g.x, g.y, '#4be0c0', 120, 2);
      S.gems.splice(i, 1);
      continue;
    }
    if (d < st.pickup) {
      const mv = Math.min(d, 380 * dt);
      g.x += dx / d * mv; g.y += dy / d * mv;
    }
  }

  /* 粒子 */
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const q = S.parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= 1 - 2.4 * dt; q.vy *= 1 - 2.4 * dt;
    q.life -= dt;
    if (q.life <= 0) { S.parts.splice(i, 1); partPool.push(q); }
  }

  /* 素材帧爆炸计时 */
  for (let i = S.booms.length - 1; i >= 0; i--) {
    S.booms[i].t += dt;
    if (S.booms[i].t >= S.booms[i].life) S.booms.splice(i, 1);
  }

  /* 飘字 / 冲击环 / 闪电 */
  for (let i = S.texts.length - 1; i >= 0; i--) {
    const t = S.texts[i];
    t.y += t.vy * dt;
    t.vy *= 1 - 1.8 * dt;
    t.life -= dt;
    if (t.life <= 0) S.texts.splice(i, 1);
  }
  for (let i = S.rings.length - 1; i >= 0; i--) {
    const r = S.rings[i];
    r.r += r.grow * dt;
    r.life -= dt;
    if (r.life <= 0) S.rings.splice(i, 1);
  }
  for (let i = S.bolts.length - 1; i >= 0; i--) {
    const b = S.bolts[i];
    b.life -= dt;
    if (b.life <= 0) S.bolts.splice(i, 1);
  }

  /* 巨剑刀光衰减 */
  if (S.slashes && S.slashes.length) {
    for (let i = S.slashes.length - 1; i >= 0; i--) {
      S.slashes[i].life -= dt;
      if (S.slashes[i].life <= 0) S.slashes.splice(i, 1);
    }
  }

  if (S.hurtFlash > 0) S.hurtFlash = Math.max(0, S.hurtFlash - dt * 3);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.6);
  if (S.banner) {
    S.banner.life -= dt;
    if (S.banner.life <= 0) S.banner = null;
  }

  updateShrouds(dt);
  updateNight(dt);

  /* 波次驱动 / 狂潮补位：不再无条件刷怪/刷 BOSS */
  if (S.runMode === 'arena') updateArena(dt);      /* 测试场地：不刷小怪，只托管 BOSS 重生 */
  else if (S.runMode === 'rush') updateRush(dt);
  else updateWaves(dt);

  /* 召唤队列（避免遍历中改数组） */
  if (S.pending.length) {
    for (const q of S.pending) spawnAt(q.type, q.x, q.y, q.extra);
    S.pending.length = 0;
  }

  /* 摄像机：视野永远以操作角色为中心，不随地图边缘钳制——
     手机摇杆是固定位置，角色跑到屏幕边缘时操控手感很差；
     边界感知交给虚线边界线 + 贴边红光（drawEdgeWarning） */
  const vw = W / SET.view, vh = H / SET.view;
  const tx = p.x - vw / 2;
  const ty = p.y - vh / 2;
  const k = Math.min(1, dt * 9);
  S.cam.x += (tx - S.cam.x) * k;
  S.cam.y += (ty - S.cam.y) * k;

  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 32);

  updateHUD();

  if (S.pendingLevels > 0 && S.mode === 'play') showLevelUp();
}

/* ---------- 绘制 ---------- */
function stageTheme() {
  return (S && S.stage && THEMES[S.stage.theme]) || THEMES.waste;
}

function drawGrid(vw, vh) {
  const th = stageTheme();
  const step = 90;
  const x0 = Math.floor(S.cam.x / step) * step;
  const y0 = Math.floor(S.cam.y / step) * step;
  ctx.strokeStyle = th.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x < S.cam.x + vw + step; x += step) { ctx.moveTo(x, S.cam.y); ctx.lineTo(x, S.cam.y + vh); }
  for (let y = y0; y < S.cam.y + vh + step; y += step) { ctx.moveTo(S.cam.x, y); ctx.lineTo(S.cam.x + vw, y); }
  ctx.stroke();

  /* 主题装饰点：按网格交点撒一些，营造地表质感 */
  ctx.fillStyle = th.dot;
  for (let x = x0; x < S.cam.x + vw + step; x += step) {
    for (let y = y0; y < S.cam.y + vh + step; y += step) {
      const h = ((x * 73856093) ^ (y * 19349663)) >>> 0;
      if (h % 5 === 0) {
        const r = 2 + (h % 4);
        ctx.beginPath();
        ctx.arc(x + (h % 23), y + (h % 31), r, 0, RAD);
        ctx.fill();
      }
    }
  }

  ctx.save();
  ctx.strokeStyle = th.edge;
  ctx.lineWidth = 4;
  ctx.setLineDash([22, 14]);
  ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
  ctx.setLineDash([]);
  ctx.strokeStyle = th.corner;
  ctx.lineWidth = 6;
  const L = 60;
  const corners = [[0, 0, 1, 1], [WORLD.w, 0, -1, 1], [0, WORLD.h, 1, -1], [WORLD.w, WORLD.h, -1, -1]];
  for (const [cx, cy, sx, sy] of corners) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + sy * L); ctx.lineTo(cx, cy); ctx.lineTo(cx + sx * L, cy);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEdgeWarning() {
  const p = S.player, R = 160;
  const edges = [
    { d: p.x, seg: [0, 0, WORLD.w, 0] },
    { d: WORLD.w - p.x, seg: [0, WORLD.h, WORLD.w, WORLD.h] },
    { d: p.y, seg: [0, 0, 0, WORLD.h] },
    { d: WORLD.h - p.y, seg: [WORLD.w, 0, WORLD.w, WORLD.h] },
  ];
  for (const e of edges) {
    if (e.d >= R) continue;
    const a = 1 - e.d / R;
    ctx.beginPath();
    ctx.moveTo(e.seg[0], e.seg[1]);
    ctx.lineTo(e.seg[2], e.seg[3]);
    ctx.strokeStyle = 'rgba(255,120,90,' + (.2 + a * .6).toFixed(3) + ')';
    ctx.lineWidth = 3 + a * 10;
    ctx.stroke();
  }
}

function drawBolt(bo) {
  const a = Math.max(0, bo.life / bo.max);
  ctx.globalCompositeOperation = 'lighter';
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    ctx.moveTo(bo.pts[0].x, bo.pts[0].y);
    for (let i = 1; i < bo.pts.length; i++) {
      const A = bo.pts[i - 1], B = bo.pts[i];
      const seg = 4;
      for (let k = 1; k <= seg; k++) {
        const t = k / seg;
        const x = A.x + (B.x - A.x) * t;
        const y = A.y + (B.y - A.y) * t;
        const j = k === seg ? 0 : 7;
        ctx.lineTo(x + rnd(-j, j), y + rnd(-j, j));
      }
    }
    if (pass === 0) {
      ctx.strokeStyle = withAlpha(bo.color, a * .55);
      ctx.lineWidth = 7;
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,' + (a * .9).toFixed(2) + ')';
      ctx.lineWidth = 1.8;
    }
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* 地震带：地面一圈圈亮起、上刺、缩回。
   亮地是空心环（无伤害），上刺是实心带 + 一圈尖刺（唯一有伤害的一瞬），
   缩回只剩很快褪掉的残影。因为每圈相位错开，画面上会看到"这一圈在刺、隔壁刚亮"。 */
function drawTide(h) {
  const pd = Math.hypot(S.player.x - h.x, S.player.y - h.y);
  const half = h.w * .5;

  for (let k = 0; k < h.n; k++) {
    const local = S.t - h.born - k * h.dt;
    const prev = (h.ahead || 0) * h.dt;
    if (local < -prev || local > h.T) continue;
    const c = h.r0 + k * h.pitch;
    if (Math.abs(c - pd) > 900) continue;      /* 屏幕外的圈不画 */

    if (local < 0) {
      /* 提前预警：还没轮到它上刺，先淡淡亮着让你看清位置 */
      const s = 1 + local / prev;              /* 0 → 1，越临近越亮 */
      ctx.globalAlpha = .35 + s * .3;
      ctx.beginPath();
      ctx.arc(h.x, h.y, c, 0, RAD);
      ctx.strokeStyle = withAlpha(h.color, .07 + s * .13);
      ctx.lineWidth = h.w;
      ctx.stroke();
      ctx.setLineDash([7, 9]);
      ctx.beginPath();
      ctx.arc(h.x, h.y, c, 0, RAD);
      ctx.strokeStyle = withAlpha(h.color, .28 + s * .4);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      continue;
    }

    const q = local / h.T;
    const rIn = c - half, rOut = c + half;

    if (q < h.warn) {
      /* 亮地：站在上面不掉血，越接近上刺越亮 */
      const s = q / h.warn;
      ctx.globalAlpha = .45 + s * .55;
      ctx.beginPath();
      ctx.arc(h.x, h.y, c, 0, RAD);
      ctx.strokeStyle = withAlpha(h.color, .10 + s * .18);
      ctx.lineWidth = h.w;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(h.x, h.y, rIn, 0, RAD);
      ctx.strokeStyle = withAlpha(h.color, .45 + s * .45);
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(h.x, h.y, rOut, 0, RAD);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (q < h.warn + h.spike) {
      /* 上刺：整圈同时冒，这是唯一要躲的一瞬；半程升起、半程落下 */
      const sub = (q - h.warn) / h.spike;               /* 0~1 */
      const lift = sub < .5 ? sub * 2 : (1 - sub) * 2;  /* 升-降包络 */
      ctx.beginPath();
      ctx.arc(h.x, h.y, c, 0, RAD);
      ctx.strokeStyle = withAlpha(h.color, .5);
      ctx.lineWidth = h.w;
      ctx.stroke();

      const cnt = Math.min(72, Math.max(10, Math.round(RAD * c / 46)));
      const hgt = (half + 6) * (0.25 + lift * .75), wid = 9;
      ctx.beginPath();
      for (let j = 0; j < cnt; j++) {
        const a = j / cnt * RAD, ca = Math.cos(a), sa = Math.sin(a);
        const bx = h.x + ca * c, by = h.y + sa * c;
        ctx.moveTo(bx + sa * wid * .5, by - ca * wid * .5);
        ctx.lineTo(bx - sa * wid * .5, by + ca * wid * .5);
        ctx.lineTo(bx + ca * hgt, by + sa * hgt);
        ctx.closePath();
      }
      ctx.fillStyle = withAlpha(h.color, .8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,245,225,.85)';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(h.x, h.y, rIn, 0, RAD);
      ctx.strokeStyle = 'rgba(255,250,240,.9)';
      ctx.lineWidth = 2.4;
      ctx.stroke();
    } else {
