  /* 疾行者：四足猎兽 */
  sprint(x, y, r) {
    const p = ART.sprint;
    artShadow(x, y, r);
    artLimb(x - r*.62, y + r*.22, x - r*.82, y + r*.90, r*.12, p);
    artLimb(x - r*.30, y + r*.30, x - r*.48, y + r*.94, r*.11, p);

    artPainter(() => {
      ctx.moveTo(x - r*.80, y - r*.02);
      ctx.quadraticCurveTo(x - r*1.32, y - r*.30, x - r*1.54, y - r*.64);
      ctx.quadraticCurveTo(x - r*1.24, y - r*.18, x - r*.78, y + r*.14);
      ctx.closePath();
    }, p, x, y, r, 1.6);

    artPainter(() => {
      ctx.moveTo(x + r*.62, y - r*.10);
      ctx.quadraticCurveTo(x + r*.30, y - r*.46, x - r*.20, y - r*.36);
      ctx.quadraticCurveTo(x - r*.70, y - r*.26, x - r*.82, y + r*.06);
      ctx.quadraticCurveTo(x - r*.66, y + r*.42, x - r*.10, y + r*.40);
      ctx.quadraticCurveTo(x + r*.42, y + r*.36, x + r*.62, y - r*.10);
      ctx.closePath();
    }, p, x, y, r, 2);

    artShell(x - r*.16, y - r*.22, r, -.22, .62, p.e, .5);

    artLimb(x + r*.34, y + r*.28, x + r*.26, y + r*.94, r*.12, p);
    artLimb(x + r*.10, y + r*.32, x - r*.04, y + r*.96, r*.11, p);

    artPainter(() => {
      ctx.moveTo(x + r*.60, y - r*.22);
      ctx.quadraticCurveTo(x + r*1.02, y - r*.30, x + r*1.32, y - r*.02);
      ctx.quadraticCurveTo(x + r*1.04, y + r*.14, x + r*.62, y + r*.14);
      ctx.quadraticCurveTo(x + r*.44, y + r*.02, x + r*.60, y - r*.22);
      ctx.closePath();
    }, p, x, y, r, 1.8);

    artPainter(() => {
      ctx.moveTo(x + r*.52, y - r*.24);
      ctx.lineTo(x + r*.40, y - r*.64);
      ctx.lineTo(x + r*.72, y - r*.34);
      ctx.closePath();
    }, p, x, y, r, 1.4);

    artEye(x + r*.88, y - r*.06, r*.09, p.e, 6);
  },

  /* 重装：牛头巨兽 */
  brute(x, y, r) {
    const p = ART.brute;
    artShadow(x, y, r);
    artLimb(x - r*.44, y + r*.30, x - r*.60, y + r*.96, r*.20, p);
    artLimb(x + r*.30, y + r*.32, x + r*.46, y + r*.98, r*.20, p);

    artPainter(() => {
      ctx.moveTo(x + r*.42, y - r*.52);
      ctx.quadraticCurveTo(x - r*.10, y - r*.72, x - r*.62, y - r*.40);
      ctx.quadraticCurveTo(x - r*.86, y + r*.02, x - r*.66, y + r*.40);
      ctx.quadraticCurveTo(x - r*.10, y + r*.56, x + r*.46, y + r*.38);
      ctx.quadraticCurveTo(x + r*.72, y - r*.06, x + r*.42, y - r*.52);
      ctx.closePath();
    }, p, x, y, r, 2.2);

    artShell(x - r*.14, y - r*.24, r, -.15, .6, p.e, .5);

    for (const s of [-1, 1]) {
      artPainter(() => {
        ctx.moveTo(x + r*.34, y + s * r*.34);
        ctx.quadraticCurveTo(x + r*.86, y + s * r*.88, x + r*1.22, y + s * r*.62);
        ctx.quadraticCurveTo(x + r*.84, y + s * r*.58, x + r*.34, y + s * r*.10);
        ctx.closePath();
      }, p, x, y, r, 1.8);
    }

    artPainter(() => {
      ctx.moveTo(x + r*.36, y - r*.34);
      ctx.quadraticCurveTo(x + r*.86, y - r*.26, x + r*.84, y + r*.06);
      ctx.quadraticCurveTo(x + r*.80, y + r*.34, x + r*.34, y + r*.30);
      ctx.closePath();
    }, p, x, y, r, 2);
    artEye(x + r*.66, y + r*.02, r*.11, p.e, 6);
  },

  /* 冲撞兽：低伏带角 */
  charger(x, y, r) {
    const p = ART.charger;
    artShadow(x, y, r);
    artLimb(x - r*.50, y + r*.26, x - r*.68, y + r*.86, r*.12, p);
    artLimb(x + r*.20, y + r*.30, x + r*.26, y + r*.88, r*.12, p);

    artPainter(() => {
      ctx.moveTo(x + r*.72, y + r*.06);
      ctx.quadraticCurveTo(x + r*.40, y - r*.40, x - r*.20, y - r*.44);
      ctx.quadraticCurveTo(x - r*.72, y - r*.34, x - r*.76, y + r*.10);
      ctx.quadraticCurveTo(x - r*.44, y + r*.42, x + r*.10, y + r*.38);
      ctx.quadraticCurveTo(x + r*.54, y + r*.34, x + r*.72, y + r*.06);
      ctx.closePath();
    }, p, x, y, r, 2);

    artShell(x - r*.10, y - r*.26, r, -.12, .6, p.e, .5);

    artPainter(() => {
      ctx.moveTo(x + r*.66, y - r*.16);
      ctx.quadraticCurveTo(x + r*1.06, y - r*.14, x + r*1.20, y + r*.06);
      ctx.quadraticCurveTo(x + r*1.02, y + r*.26, x + r*.64, y + r*.20);
      ctx.closePath();
    }, p, x, y, r, 1.8);

    artPainter(() => {
      ctx.moveTo(x + r*1.00, y - r*.14);
      ctx.quadraticCurveTo(x + r*1.46, y - r*.40, x + r*1.56, y - r*.04);
      ctx.quadraticCurveTo(x + r*1.44, y + r*.10, x + r*1.02, y + r*.08);
      ctx.closePath();
    }, p, x, y, r, 1.8);

    artEye(x + r*.90, y + r*.04, r*.095, p.e, 5.5);
  },

  /* 施法者：水母 */
  caster(x, y, r) {
    const p = ART.caster;
    artShadow(x, y, r, .28);
    for (let k = 0; k < 4; k++) {
      const ox = (k - 1.5) * r * .34;
      const wob = Math.sin(S.t * 1.6 + k * 1.1) * r * .16;
      ctx.beginPath();
      ctx.moveTo(x + ox * .6, y + r * .18);
      ctx.bezierCurveTo(x + ox + wob, y + r * .62, x + ox * 1.3 + wob * 1.4, y + r * .92, x + ox * 1.2 + wob, y + r * 1.18);
      ctx.strokeStyle = 'rgba(4,4,8,.8)'; ctx.lineWidth = r * .12; ctx.lineCap = 'round'; ctx.stroke();
      ctx.strokeStyle = p.m; ctx.lineWidth = r * .10; ctx.stroke();
      ctx.strokeStyle = hexA(p.e, .5); ctx.lineWidth = 1.1; ctx.stroke();
      ctx.lineCap = 'butt';
    }

    artPainter(() => {
      ctx.moveTo(x - r*.86, y + r*.16);
      ctx.quadraticCurveTo(x - r*.80, y - r*.62, x, y - r*.68);
      ctx.quadraticCurveTo(x + r*.80, y - r*.62, x + r*.86, y + r*.16);
      ctx.quadraticCurveTo(x + r*.52, y + r*.02, x + r*.26, y + r*.18);
      ctx.quadraticCurveTo(x, y + r*.02, x - r*.26, y + r*.18);
      ctx.quadraticCurveTo(x - r*.52, y + r*.02, x - r*.86, y + r*.16);
      ctx.closePath();
    }, p, x, y, r, 2);

    ctx.beginPath();
    ctx.moveTo(x - r*.40, y + r*.04);
    ctx.quadraticCurveTo(x - r*.30, y - r*.40, x, y - r*.44);
    ctx.quadraticCurveTo(x + r*.30, y - r*.40, x + r*.40, y + r*.04);
    ctx.quadraticCurveTo(x, y - r*.10, x - r*.40, y + r*.04);
    ctx.closePath();
    const ig = ctx.createLinearGradient(x, y - r*.4, x, y + r*.1);
    ig.addColorStop(0, hexA(p.e, .38)); ig.addColorStop(1, hexA(p.e, .08));
    ctx.fillStyle = ig; ctx.fill();

    artShell(x, y - r*.30, r, 0, .66, p.e, .5);
    artEye(x, y - r*.14, r*.12, p.e, 5.5);
  },

  /* 分裂体：多囊软体 */
  splitter(x, y, r) {
    const p = ART.splitter;
    artShadow(x, y, r);
    artLimb(x - r*.40, y + r*.34, x - r*.54, y + r*.88, r*.11, p);
    artLimb(x + r*.28, y + r*.36, x + r*.40, y + r*.90, r*.11, p);

    artPainter(() => { ctx.arc(x - r*.48, y - r*.18, r*.34, 0, RAD); }, p, x, y, r, 1.6);
    artPainter(() => { ctx.arc(x - r*.10, y - r*.44, r*.30, 0, RAD); }, p, x, y, r, 1.6);

    artPainter(() => {
      ctx.moveTo(x + r*.62, y + r*.10);
      ctx.quadraticCurveTo(x + r*.52, y - r*.52, x - r*.02, y - r*.52);
      ctx.quadraticCurveTo(x - r*.54, y - r*.44, x - r*.54, y + r*.06);
      ctx.quadraticCurveTo(x - r*.50, y + r*.52, x + r*.02, y + r*.50);
      ctx.quadraticCurveTo(x + r*.54, y + r*.46, x + r*.62, y + r*.10);
      ctx.closePath();
    }, p, x, y, r, 2);

    for (const [cx, cy, rr] of [[x - r*.48, y - r*.18, r*.16], [x - r*.10, y - r*.44, r*.14]]) {
      const lg = ctx.createRadialGradient(cx, cy - rr*.3, 0, cx, cy, rr);
      lg.addColorStop(0, hexA(p.e, .52)); lg.addColorStop(1, hexA(p.e, .10));
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, RAD); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - rr*.3, cy - rr*.35, rr*.22, 0, RAD);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
    }

    artShell(x + r*.08, y - r*.24, r, -.1, .5, p.e, .48);
    artEye(x + r*.26, y + r*.02, r*.10, p.e, 5.5);
  },

  /* 盾卫：持盾骨架 */
  shield(x, y, r) {
    const p = ART.shield;
    artShadow(x, y, r);
    artLimb(x - r*.18, y + r*.36, x - r*.32, y + r*.94, r*.10, p);
    artLimb(x + r*.14, y + r*.36, x + r*.22, y + r*.94, r*.10, p);

    artPainter(() => {
      ctx.moveTo(x + r*.22, y - r*.30);
      ctx.quadraticCurveTo(x - r*.24, y - r*.34, x - r*.30, y + r*.06);
      ctx.quadraticCurveTo(x - r*.20, y + r*.40, x + r*.20, y + r*.38);
      ctx.quadraticCurveTo(x + r*.34, y + r*.02, x + r*.22, y - r*.30);
      ctx.closePath();
    }, p, x, y, r, 1.8);

    artPainter(() => {
      ctx.moveTo(x + r*.04, y - r*.40);
      ctx.quadraticCurveTo(x + r*.34, y - r*.44, x + r*.34, y - r*.18);
      ctx.quadraticCurveTo(x + r*.30, y + r*.02, x + r*.02, y + r*.02);
      ctx.quadraticCurveTo(x - r*.18, y - r*.16, x + r*.04, y - r*.40);
      ctx.closePath();
    }, p, x, y, r, 1.6);

    const sfn = () => {
      ctx.moveTo(x + r*.40, y - r*.56);
      ctx.quadraticCurveTo(x + r*.98, y - r*.34, x + r*.92, y + r*.06);
      ctx.quadraticCurveTo(x + r*.94, y + r*.48, x + r*.40, y + r*.68);
      ctx.quadraticCurveTo(x + r*.58, y + r*.06, x + r*.40, y - r*.56);
      ctx.closePath();
    };
    ctx.beginPath(); sfn();
    const sg = ctx.createLinearGradient(x + r*.40, y - r*.6, x + r*.95, y + r*.6);
    sg.addColorStop(0, '#4a5670'); sg.addColorStop(.45, '#2a3348'); sg.addColorStop(1, '#141a27');
    ctx.fillStyle = sg; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(4,4,8,.9)'; ctx.stroke();
    ctx.beginPath(); sfn();
    ctx.lineWidth = 1.1; ctx.strokeStyle = hexA(p.e, .68); ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + r*.70, y - r*.44);
    ctx.quadraticCurveTo(x + r*.82, y + r*.06, x + r*.70, y + r*.54);
    ctx.strokeStyle = hexA(p.e, .52); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + r*.56, y - r*.44);
    ctx.quadraticCurveTo(x + r*.64, y + r*.02, x + r*.56, y + r*.46);
    ctx.strokeStyle = 'rgba(210,225,255,.26)'; ctx.lineWidth = 2.4; ctx.stroke();

    artEye(x + r*.20, y - r*.20, r*.09, p.e, 5.5);
  },

  /* 自爆者：刺球 */
  bomber(x, y, r) {
    const p = ART.bomber;
    artShadow(x, y, r, .45);
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * RAD + .2;
      const bx = x + Math.cos(a) * r * .62, by = y + Math.sin(a) * r * .62;
      const px = Math.cos(a + 1.5708) * r * .17, py = Math.sin(a + 1.5708) * r * .17;
      artPainter(() => {
        ctx.moveTo(bx + px, by + py);
        ctx.lineTo(x + Math.cos(a) * r * 1.16, y + Math.sin(a) * r * 1.16);
        ctx.lineTo(bx - px, by - py);
        ctx.closePath();
      }, p, x, y, r, 1.4);
    }

    artPainter(() => { ctx.arc(x, y, r * .68, 0, RAD); }, p, x, y, r, 2.2);

    const hg = ctx.createRadialGradient(x - r*.18, y - r*.26, 0, x - r*.18, y - r*.26, r*.32);
    hg.addColorStop(0, 'rgba(255,220,220,.38)'); hg.addColorStop(1, 'rgba(255,220,220,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x - r*.18, y - r*.26, r*.32, 0, RAD); ctx.fill();

    artLimb(x + r*.02, y - r*.66, x + r*.18, y - r*1.04, 2.2, p);
    artEye(x, y, r*.18, p.e, 4.6);
  },

  /* 召唤者：兜帽法师 */
  summoner(x, y, r) {
    const p = ART.summoner;
    artShadow(x, y, r);
    artPainter(() => {
      ctx.moveTo(x + r*.10, y - r*.50);
      ctx.quadraticCurveTo(x + r*.42, y - r*.10, x + r*.36, y + r*.72);
      ctx.quadraticCurveTo(x, y + r*.94, x - r*.42, y + r*.74);
      ctx.quadraticCurveTo(x - r*.54, y + r*.10, x - r*.26, y - r*.50);
      ctx.closePath();
    }, p, x, y, r, 2);

    ctx.beginPath();
    ctx.moveTo(x - r*.20, y + r*.10); ctx.quadraticCurveTo(x - r*.28, y + r*.50, x - r*.34, y + r*.72);
    ctx.moveTo(x + r*.14, y + r*.10); ctx.quadraticCurveTo(x + r*.20, y + r*.50, x + r*.28, y + r*.72);
    ctx.strokeStyle = 'rgba(4,4,8,.42)'; ctx.lineWidth = 1.6; ctx.stroke();

    artPainter(() => {
      ctx.moveTo(x - r*.26, y - r*.44);
      ctx.quadraticCurveTo(x - r*.32, y - r*.94, x + r*.02, y - r*.94);
      ctx.quadraticCurveTo(x + r*.36, y - r*.92, x + r*.32, y - r*.42);
      ctx.quadraticCurveTo(x + r*.02, y - r*.26, x - r*.26, y - r*.44);
      ctx.closePath();
    }, p, x, y, r, 1.8);

    artPainter(() => {
      ctx.moveTo(x - r*.14, y - r*.50);
      ctx.quadraticCurveTo(x + r*.02, y - r*.76, x + r*.18, y - r*.48);
      ctx.quadraticCurveTo(x + r*.02, y - r*.34, x - r*.14, y - r*.50);
      ctx.closePath();
    }, { e: p.e, d: 'rgba(2,2,6,.98)', m: 'rgba(2,2,6,.98)', l: 'rgba(2,2,6,.98)' }, x, y, r, 1);

    artEye(x + r*.02, y - r*.50, r*.085, p.e, 6);

    for (const s of [-1, 1]) {
      const gx = x + s * r * .58, gy = y + r * .10;
      const fg = ctx.createRadialGradient(gx, gy, 0, gx, gy, r * .42);
      fg.addColorStop(0, hexA(p.e, .52)); fg.addColorStop(1, hexA(p.e, 0));
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(gx, gy, r*.42, 0, RAD); ctx.fill();
      ctx.beginPath(); ctx.arc(gx, gy, r*.07, 0, RAD);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  },
};

/* 未知类型（含精英）回落到重装形体；配色从 e.color 现场派生 */
function artFallback(e) {
  const c = e.color || '#ffd24a';
  return { e: c, d: mixHex(c, '#05050a', .82), m: mixHex(c, '#05050a', .62), l: mixHex(c, '#05050a', .42) };
}

/* 朝向的绘制系数：face 是连续值（-1 ~ 1），转身途中会经过 0。
   这里保底 22% 宽，避免过零那一帧整只消失 —— 那样是闪，不是转身 */
function faceS(e) {
  const f = e.face === undefined ? 1 : e.face;
  return (f < 0 ? -1 : 1) * Math.max(.22, Math.abs(f));
}

function drawEnemyArt(e) {
  const p = ART[e.type] || artFallback(e);
  const r = e.r;

  /* 形变四层。注意：角色永远正面朝镜头，所以"速度感"是水平压扁 + 垂直拉长，
     不再是 0.29.0 那样沿移动方向拉伸（那需要 rotate 才成立） */
  const br = 1 + Math.sin(S.t * 4.2 + (e.ph || 0)) * .045;
  let sx = br, sy = br;
  if ((e.spd || 0) > 8) { sx *= .955; sy *= 1.05; }
  if (e.sqT > 0) {
    const k = Math.min(1, e.sqT / .14);
    sx *= 1 - .17 * k;
    sy *= 1 + .23 * k;
  }

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.scale(faceS(e), 1);             /* 只翻转，不旋转 */
  ctx.scale(sx, sy);
  ctx.translate(-e.x, -e.y);          /* 抵消，让形体函数继续用绝对坐标 */

  const kind = SHAPE_OF[e.type] || (e.type === 'elite' ? 'brute' : 'grunt');
  const fn = DRAW_ENEMY[kind] || DRAW_ENEMY.grunt;
  /* 小怪也有这个方块（只是体积小、闪得快），一并修掉 */
  ART_FLASH = e.flash > 0 ? Math.min(.8, e.flash * 8) : 0;
  try { fn(e.x, e.y, r); } finally { ART_FLASH = 0; }

  ctx.restore();
}

/* =========================================================
   BOSS 美术 v3 —— 正视写实体积（0.33.0）
   和小怪同一套管道（artPainter/artLimb/artShell/artEye），
   BOSS 明暗比小怪抬一档做视觉焦点。
   分派键：e.bossId（beast/hive/dragon/serpent/frost/vEye/vTwin/hollow/abyss）
   ========================================================= */
const BOSS_ART = {
  beast:  { e:'#e0607e', d:'#250e13', m:'#471f28', l:'#6d3643' },
  hive:   { e:'#59d98a', d:'#0e2517', m:'#1f472e', l:'#366d4b' },
  dragon: { e:'#ff7a3d', d:'#25150e', m:'#472b1f', l:'#6d4736' },
  serpent:{ e:'#ffb36b', d:'#25190e', m:'#47321f', l:'#6d5136' },
  frost:  { e:'#7fe0ff', d:'#0e2025', m:'#1f3e47', l:'#36606d' },
  vEye:   { e:'#c37bff', d:'#1b0e25', m:'#351f47', l:'#54366d' },
  vTwin:  { e:'#8a5cff', d:'#140e25', m:'#2a1f47', l:'#46366d' },
  hollow: { e:'#ff4d6d', d:'#250e12', m:'#471f26', l:'#6d3640' },
  abyss:  { e:'#ff8a5c', d:'#25140e', m:'#472a1f', l:'#6d4636' },
};

/* 地面领域光：比小怪光晕大一圈，暗示"这是我的地盘" */
function bossDomain(e, p, a) {
  const x = e.x, y = e.y, r = e.r;
  ctx.save();
  ctx.translate(x, y + r * .95); ctx.scale(1, .34);
  const g = ctx.createRadialGradient(0, 0, r * .2, 0, 0, r * 2.3);
  g.addColorStop(0, hexA(p.e, a || .16));
  g.addColorStop(.55, hexA(p.e, (a || .16) * .45));
  g.addColorStop(1, hexA(p.e, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.3, 0, RAD); ctx.fill();
  ctx.restore();
}

const BOSS_DRAW = {

  /* ---------- 荒原巨兽：俯身重甲 + 巨口獠牙 + 额头独角 ---------- */
  beast(e) {
    const p = BOSS_ART.beast;
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .17);
    artShadow(x, y, r);

    artLimb(x - r*.46, y + r*.30, x - r*.66, y + r*.92, r*.19, p);
    artLimb(x - r*.10, y + r*.40, x - r*.20, y + r*.96, r*.18, p);

    /* 躯干 */
    artPainter(() => {
      ctx.moveTo(x + r*.62, y + r*.12);
      ctx.quadraticCurveTo(x + r*.66, y - r*.62, x - r*.02, y - r*.74);
      ctx.quadraticCurveTo(x - r*.76, y - r*.72, x - r*.86, y - r*.16);
      ctx.quadraticCurveTo(x - r*.94, y + r*.30, x - r*.56, y + r*.46);
      ctx.lineTo(x + r*.54, y + r*.44);
      ctx.quadraticCurveTo(x + r*.68, y + r*.32, x + r*.62, y + r*.12);
      ctx.closePath();
    }, p, x, y, r, 2.4);

    /* 背甲分片 */
    const seams = [[-.58, -.52, -.42, .30], [-.10, -.72, -.02, .40], [.34, -.58, .44, .34]];
    for (const [sx, sy, ex, ey] of seams) {
      ctx.beginPath();
      ctx.moveTo(x + r*sx, y + r*sy);
      ctx.quadraticCurveTo(x + r*(sx+.06), y + r*((sy+ey)/2), x + r*ex, y + r*ey);
      ctx.strokeStyle = 'rgba(4,4,8,.5)'; ctx.lineWidth = 2.6; ctx.stroke();
    }
    artShell(x - r*.10, y - r*.28, r, -.34, .82, p.e, .52);

    artLimb(x + r*.40, y + r*.34, x + r*.56, y + r*.94, r*.20, p);
    artLimb(x - r*.02, y + r*.40, x - r*.10, y + r*.98, r*.19, p);

    /* 头 */
    artPainter(() => {
      ctx.moveTo(x + r*.54, y - r*.18);
      ctx.quadraticCurveTo(x + r*1.02, y - r*.26, x + r*1.16, y - r*.02);
      ctx.quadraticCurveTo(x + r*1.04, y + r*.22, x + r*.54, y + r*.20);
      ctx.closePath();
    }, p, x, y, r, 2.2);

    /* 口裂 + 獠牙 */
    ctx.beginPath();
    ctx.moveTo(x + r*.66, y - r*.02);
    ctx.quadraticCurveTo(x + r*.98, y + r*.02, x + r*1.13, y);
    ctx.strokeStyle = 'rgba(2,2,6,.92)'; ctx.lineWidth = r*.045; ctx.stroke();
    for (let k = 0; k < 4; k++) {
      const u = k / 3;
      const fx = x + r*(.70 + u * .38), fy = y + r*.01;
      ctx.beginPath();
      ctx.moveTo(fx, fy - r*.05);
      ctx.lineTo(fx + r*.02, fy + r*.10);
      ctx.lineTo(fx + r*.06, fy - r*.04);
      ctx.closePath();
      ctx.fillStyle = '#e8d9dc'; ctx.fill();
    }

    /* 额头独角 */
    const hornPal = { e: p.e, d: p.m, m: p.l, l: p.e };
    artPainter(() => {
      ctx.moveTo(x + r*.44, y - r*.40);
      ctx.quadraticCurveTo(x + r*.72, y - r*1.02, x + r*1.20, y - r*.98);
      ctx.quadraticCurveTo(x + r*.88, y - r*.64, x + r*.82, y - r*.26);
      ctx.closePath();
    }, hornPal, x, y, r, 2.2);

    artEye(x + r*.86, y - r*.14, r*.07, p.e, 6);
    artEye(x + r*.78, y + r*.10, r*.055, p.e, 5);
  },

  /* ---------- 腐林母体：肉巢 + 五卵 + 三条粗垂须 ---------- */
  hive(e) {
    const p = BOSS_ART.hive;
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .18);
    artShadow(x, y, r, .5);

    for (let k = 0; k < 3; k++) {
      const ox = (k - 1) * r * .38;
      const wob = Math.sin(S.t * 1.4 + k * 1.2) * r * .08;
      artLimb(x + ox * .7, y + r * .34, x + ox * 1.1 + wob, y + r * 1.04, r * .14, p);
    }

    artPainter(() => { ctx.ellipse(x - r*.52, y - r*.10, r*.30, r*.36, -.3, 0, RAD); }, p, x, y, r, 1.8);
    artPainter(() => { ctx.ellipse(x + r*.50, y - r*.04, r*.26, r*.32, .25, 0, RAD); }, p, x, y, r, 1.8);

    /* 主躯：不规则蠕动轮廓 */
    artPainter(() => {
      const N = 20;
      for (let i = 0; i <= N; i++) {
        const a = i / N * RAD;
        const w = 1 + Math.sin(a * 3 + S.t * 1.1) * .065
                    + Math.sin(a * 5 - S.t * .85) * .038
                    + Math.sin(a * 7 + S.t * 1.6) * .020;
        const px = x + Math.cos(a) * r * .56 * w;
        const py = y + Math.sin(a) * r * .68 * w;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    }, p, x, y, r, 2.4);

    artShell(x - r*.02, y - r*.36, r, -.1, .70, p.e, .48);

    /* 五颗卵，大小差三倍、有的半埋 */
    const eggs = [
      [x - r*.36, y - r*.20, r*.13, 0, .55],
      [x + r*.28, y - r*.32, r*.19, 2.1, .75],
      [x + r*.02, y + r*.12, r*.25, 4.2, .95],
      [x - r*.44, y + r*.24, r*.11, 1.2, .55],
      [x + r*.44, y + r*.16, r*.14, 3.3, .70],
    ];
    for (const [ex, ey, er, ph, dep] of eggs) {
      const pulse = 1 + Math.sin(S.t * 2.0 + ph) * .07;
      ctx.beginPath(); ctx.arc(ex, ey, er * pulse, 0, RAD);
      const g2 = ctx.createRadialGradient(ex - er*.3, ey - er*.35, 0, ex, ey, er * pulse);
      g2.addColorStop(0, hexA(p.e, .80 * dep));
      g2.addColorStop(.55, hexA(p.e, .32 * dep));
      g2.addColorStop(1, hexA(p.e, .04));
      ctx.fillStyle = g2; ctx.fill();
      ctx.strokeStyle = hexA(p.e, .42); ctx.lineWidth = 1.3; ctx.stroke();
      ctx.beginPath(); ctx.arc(ex - er*.32, ey - er*.36, er*.20, 0, RAD);
      ctx.fillStyle = 'rgba(240,255,245,' + (.30 * dep) + ')'; ctx.fill();
    }

    ctx.beginPath();
    ctx.moveTo(x - r*.20, y + r*.30);
    ctx.quadraticCurveTo(x + r*.02, y + r*.46, x + r*.24, y + r*.28);
    ctx.strokeStyle = 'rgba(2,6,4,.9)'; ctx.lineWidth = r*.05; ctx.stroke();
  },

  /* ---------- 蛇形（两家共用）：按 e.segs 画节 ---------- */
  _serpent(e, p, fins) {
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .17);
    artShadow(x, y, r, .42);

    const segs = e.segs && e.segs.length ? e.segs : null;
    if (!segs) {
      artPainter(() => { ctx.arc(x, y, r, 0, RAD); }, p, x, y, r, 2);
      return;
    }

    for (let i = segs.length - 1; i >= 0; i--) {
      const s = segs[i];
      const t = i / Math.max(1, segs.length - 1);
      const pp = { e: p.e, d: mixHex(p.d, '#000000', t * .5), m: mixHex(p.m, p.d, t * .45), l: mixHex(p.l, p.m, t * .4) };

      /* 背鳍：中后段，小而密 */
      if (fins && i > 0 && i < segs.length - 1) {
        const rr = s.r * .9;
        ctx.beginPath();
        ctx.moveTo(s.x - rr*.55, s.y - rr*.85);
        ctx.quadraticCurveTo(s.x - rr*.18, s.y - rr*1.55, s.x + rr*.05, s.y - rr*.92);
        ctx.quadraticCurveTo(s.x + rr*.26, s.y - rr*1.42, s.x + rr*.52, s.y - rr*.80);
        ctx.closePath();
        const fg = ctx.createLinearGradient(s.x, s.y - rr*1.6, s.x, s.y - rr*.7);
        fg.addColorStop(0, hexA(p.e, .78)); fg.addColorStop(1, hexA(p.e, .10));
        ctx.fillStyle = fg; ctx.fill();
      }

      artPainter(() => { ctx.arc(s.x, s.y, s.r, 0, RAD); }, pp, x, y, r, 1.2);
    }

    /* 头：用第一段的位置，画一个更大的头 */
    const h = segs[0];
    const hp = { e: p.e, d: p.d, m: p.m, l: p.l };
    artPainter(() => {
      ctx.moveTo(h.x + h.r * 1.55, h.y + h.r * .05);
      ctx.quadraticCurveTo(h.x + h.r * .70, h.y - h.r * 1.05, h.x - h.r * .40, h.y - h.r * .60);
      ctx.quadraticCurveTo(h.x - h.r * .70, h.y, h.x - h.r * .40, h.y + h.r * .64);
      ctx.quadraticCurveTo(h.x + h.r * .70, h.y + h.r * .95, h.x + h.r * 1.55, h.y + h.r * .05);
      ctx.closePath();
    }, hp, x, y, r, 2);

    /* 头角 */
    const hornPal = { e: p.e, d: p.m, m: p.l, l: p.e };
    artPainter(() => {
      ctx.moveTo(h.x - h.r*.10, h.y - h.r*.62);
      ctx.quadraticCurveTo(h.x + h.r*.30, h.y - h.r*1.45, h.x + h.r*1.05, h.y - h.r*1.10);
      ctx.quadraticCurveTo(h.x + h.r*.42, h.y - h.r*.95, h.x - h.r*.10, h.y - h.r*.34);
      ctx.closePath();
    }, hornPal, x, y, r, 1.8);

    artEye(h.x + h.r*.42, h.y - h.r*.18, h.r*.16, p.e, 6);
  },

  dragon(e)  { BOSS_DRAW._serpent(e, BOSS_ART.dragon, true); },
  serpent(e) { BOSS_DRAW._serpent(e, BOSS_ART.serpent, true); },

  /* ---------- 冰原领主：八边冰晶 + 背刺 + 裂光 ---------- */
  frost(e) {
    const p = BOSS_ART.frost;
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .17);
    artShadow(x, y, r, .35);

    for (let k = 0; k < 7; k++) {
      const a = -Math.PI * .82 + k * Math.PI * .155;
      const bx = x + Math.cos(a) * r * .58, by = y + Math.sin(a) * r * .58;
      const tx = x + Math.cos(a) * r * (1.30 + (k % 3) * .12);
      const ty = y + Math.sin(a) * r * (1.30 + (k % 3) * .12);
      const px = Math.cos(a + 1.5708) * r * .15, py = Math.sin(a + 1.5708) * r * .15;
      artPainter(() => {
        ctx.moveTo(bx + px, by + py); ctx.lineTo(tx, ty); ctx.lineTo(bx - px, by - py);
        ctx.closePath();
      }, p, x, y, r, 1.4);
    }

    artPainter(() => {
      for (let i = 0; i <= 8; i++) {
        const a = i / 8 * RAD + .22;
        const rr = r * .86 * (1 + Math.sin(a * 4 + S.t * .8) * .015);
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * .92;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    }, p, x, y, r, 2.6);

    const cracks = [[-.50, -.30, -.06, .06], [-.06, .06, .24, -.22], [-.06, .06, .10, .52]];
    for (const [x1, y1, x2, y2] of cracks) {
      ctx.beginPath();
      ctx.moveTo(x + r*x1, y + r*y1); ctx.lineTo(x + r*x2, y + r*y2);
      ctx.strokeStyle = hexA(p.e, .75); ctx.lineWidth = 2.2; ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(x - r*.34, y - r*.44); ctx.lineTo(x - r*.06, y - r*.20); ctx.lineTo(x - r*.16, y + r*.06);
    ctx.closePath();
    ctx.fillStyle = hexA(p.e, .14); ctx.fill();

    for (let k = 0; k < 3; k++) {
      const cx = x + (k - 1) * r * .44;
      const hg = ctx.createRadialGradient(cx, y + r*.86, 0, cx, y + r*.86, r*.42);
      hg.addColorStop(0, hexA(p.e, .20)); hg.addColorStop(1, hexA(p.e, 0));
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(cx, y + r*.86, r*.42, 0, RAD); ctx.fill();
    }

    artEye(x + r*.28, y - r*.06, r*.10, p.e, 6);
    artEye(x - r*.16, y - r*.06, r*.10, p.e, 6);
  },

  /* ---------- 虚空之影：扁平体 + 巨眼竖瞳 + 裂隙 ---------- */
  vEye(e) {
    const p = BOSS_ART.vEye;
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .20);
    artShadow(x, y, r, .3);

    for (let k = 0; k < 7; k++) {
      const a = S.t * .5 + k * RAD / 7;
      const r0 = r * 1.06, r1 = r * (1.42 + (k % 3) * .10);
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0 * .9);
      ctx.lineTo(x + Math.cos(a + .07) * r1, y + Math.sin(a + .07) * r1 * .9);
      ctx.strokeStyle = hexA(p.e, .5); ctx.lineWidth = 2.2; ctx.stroke();
    }

    artPainter(() => {
      ctx.moveTo(x + r*.86, y);
      ctx.quadraticCurveTo(x + r*.80, y - r*.66, x, y - r*.72);
      ctx.quadraticCurveTo(x - r*.80, y - r*.66, x - r*.86, y);
      ctx.quadraticCurveTo(x - r*.80, y + r*.66, x, y + r*.72);
      ctx.quadraticCurveTo(x + r*.80, y + r*.66, x + r*.86, y);
      ctx.closePath();
    }, p, x, y, r, 2.6);

    /* 巨眼 */
    ctx.beginPath();
    ctx.ellipse(x + r*.04, y, r*.62, r*.50, 0, 0, RAD);
    const eg = ctx.createRadialGradient(x + r*.04, y - r*.10, 0, x + r*.04, y, r*.62);
    eg.addColorStop(0, hexA(p.e, .26)); eg.addColorStop(1, 'rgba(2,2,8,.92)');
    ctx.fillStyle = eg; ctx.fill();
    ctx.strokeStyle = hexA(p.e, .7); ctx.lineWidth = 2.4; ctx.stroke();

    ctx.beginPath(); ctx.arc(x + r*.04, y, r*.30, 0, RAD);
    const ig = ctx.createRadialGradient(x + r*.04, y, 0, x + r*.04, y, r*.30);
    ig.addColorStop(0, '#ffffff'); ig.addColorStop(.5, p.e); ig.addColorStop(1, hexA(p.e, .22));
    ctx.fillStyle = ig; ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + r*.04, y, r*.07, r*.26, 0, 0, RAD);
    ctx.fillStyle = '#05040a'; ctx.fill();

    ctx.beginPath();
    ctx.ellipse(x + r*.04, y, r*.62, r*.50, 0, Math.PI*1.05, Math.PI*1.95);
    ctx.strokeStyle = p.d; ctx.lineWidth = r*.09; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + r*.04, y, r*.62, r*.50, 0, Math.PI*.05, Math.PI*.95);
    ctx.strokeStyle = p.d; ctx.lineWidth = r*.09; ctx.stroke();
    ctx.lineCap = 'butt';
  },

  /* ---------- 虚空双瞳：单球单眼（两个实体各画一个，连线另画） ---------- */
  vTwin(e) {
    const p = BOSS_ART.vTwin;
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .18);
    artShadow(x, y, r, .3);

    artPainter(() => {
      ctx.moveTo(x + r*.92, y);
      ctx.quadraticCurveTo(x + r*.86, y - r*.86, x, y - r*.92);
      ctx.quadraticCurveTo(x - r*.86, y - r*.86, x - r*.92, y);
      ctx.quadraticCurveTo(x - r*.86, y + r*.86, x, y + r*.92);
      ctx.quadraticCurveTo(x + r*.86, y + r*.86, x + r*.92, y);
      ctx.closePath();
    }, p, x, y, r, 2.4);

    artShell(x, y - r*.36, r, 0, .68, p.e, .48);

    /* 眼：朝对面的那一颗看 */
    let look = 0;
    if (e.twin && e.twin.x !== undefined) look = Math.atan2(e.twin.y - y, e.twin.x - x);
    const ex = x + Math.cos(look) * r * .16;
    const ey = y + Math.sin(look) * r * .16;

    ctx.beginPath(); ctx.arc(ex, ey, r*.40, 0, RAD);
    ctx.fillStyle = 'rgba(2,2,8,.92)'; ctx.fill();
    ctx.strokeStyle = hexA(p.e, .68); ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(ex, ey, r*.20, 0, RAD);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.beginPath();
    ctx.arc(ex + Math.cos(look)*r*.05, ey + Math.sin(look)*r*.05, r*.11, 0, RAD);
    ctx.fillStyle = p.e; ctx.fill();
    const g2 = ctx.createRadialGradient(ex, ey, 0, ex, ey, r*1.0);
    g2.addColorStop(0, hexA(p.e, .30)); g2.addColorStop(1, hexA(p.e, 0));
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(ex, ey, r*1.0, 0, RAD); ctx.fill();
  },

  /* ---------- 深渊空洞：球体空洞 + 双臂（用 e.arms） ---------- */
  hollow(e) {
    const p = BOSS_ART.hollow;
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .18);
    artShadow(x, y, r);

    artLimb(x - r*.30, y + r*.50, x - r*.42, y + r*.94, r*.15, p);
    artLimb(x + r*.26, y + r*.50, x + r*.36, y + r*.95, r*.15, p);

    artPainter(() => {
      ctx.moveTo(x + r*.62, y + r*.06);
      ctx.quadraticCurveTo(x + r*.60, y - r*.66, x, y - r*.74);
      ctx.quadraticCurveTo(x - r*.62, y - r*.66, x - r*.62, y + r*.06);
      ctx.quadraticCurveTo(x - r*.58, y + r*.64, x, y + r*.64);
      ctx.quadraticCurveTo(x + r*.58, y + r*.64, x + r*.62, y + r*.06);
      ctx.closePath();
    }, p, x, y, r, 2.6);

    artShell(x - r*.04, y - r*.34, r, -.06, .74, p.e, .5);

    const holes = [[.46, .92], [.32, .70], [.18, .42]];
    for (const [hr, aa] of holes) {
      ctx.beginPath(); ctx.arc(x, y + r*.02, r * hr, 0, RAD);
      ctx.fillStyle = 'rgba(2,2,6,' + aa + ')'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y + r*.02, r*.46, 0, RAD);
    ctx.strokeStyle = hexA(p.e, .58); ctx.lineWidth = 2.2; ctx.stroke();
    const cg = ctx.createRadialGradient(x, y + r*.02, 0, x, y + r*.02, r*.20);
    cg.addColorStop(0, hexA(p.e, .85)); cg.addColorStop(1, hexA(p.e, 0));
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(x, y + r*.02, r*.20, 0, RAD); ctx.fill();

    /* 双臂：按 e.arms 的位置画（位置由 updateBossExtras 驱动），画在本体之上 */
    if (e.arms && e.arms.length) {
      for (const arm of e.arms) {
        for (let i = arm.seg.length - 1; i >= 0; i--) {
          const s = arm.seg[i];
          if (i < arm.seg.length - 1) {
            const nx = arm.seg[i + 1];
            /* e.arms 的节半径偏小，线宽要补偿，否则手臂细得像火柴棍 */
            artLimb(s.x, s.y, nx.x, nx.y, Math.max(r * .17, s.r * 3.2), p);
          }
        }
        const tip = arm.seg[arm.seg.length - 1];
        const prev = arm.seg[arm.seg.length - 2];
        if (prev) {
          const ang = Math.atan2(tip.y - prev.y, tip.x - prev.x);
          ctx.lineCap = 'round';
          for (let k = -1; k <= 1; k++) {
            ctx.beginPath();
            ctx.moveTo(tip.x, tip.y);
            ctx.lineTo(tip.x + Math.cos(ang + k * .6) * r * .34, tip.y + Math.sin(ang + k * .6) * r * .34);
            ctx.strokeStyle = hexA(p.e, .9);
            ctx.lineWidth = r * .07;
            ctx.stroke();
          }
          ctx.lineCap = 'butt';
        }
      }
    }
  },

  /* ---------- 深渊之口：环形十六齿 + 喉底 ---------- */
  abyss(e) {
    const p = BOSS_ART.abyss;
    const x = e.x, y = e.y, r = e.r;
    bossDomain(e, p, .19);
    artShadow(x, y, r);

    artPainter(() => {
      const N = 22;
      for (let i = 0; i <= N; i++) {
        const a = i / N * RAD;
        const w = 1 + Math.sin(a * 3 + S.t * 1.0) * .05 + Math.sin(a * 6 - S.t * .9) * .028;
        const px = x + Math.cos(a) * r * .90 * w;
        const py = y + Math.sin(a) * r * .84 * w;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
    }, p, x, y, r, 2.8);

    artShell(x - r*.06, y - r*.34, r, -.06, .78, p.e, .46);

    /* 环形利齿 */
    const N = 16;
    const open = .48 + Math.sin(S.t * 1.15) * .10;
    const toothPal = { e: '#e8dcd6', d: '#6b5a52', m: '#a89a92', l: '#d8cac2' };
    for (let k = 0; k < N; k++) {
      const a = k / N * RAD;
      const rOut = r * .76, rIn = r * .76 * (1 - open * .58);
      const aa = a + .10, ab = a - .10;
      artPainter(() => {
        ctx.moveTo(x + Math.cos(aa) * rOut, y + Math.sin(aa) * rOut * .92);
        ctx.lineTo(x + Math.cos(a) * rIn, y + Math.sin(a) * rIn * .92);
        ctx.lineTo(x + Math.cos(ab) * rOut, y + Math.sin(ab) * rOut * .92);
        ctx.closePath();
      }, toothPal, x, y, r, 1.1);
    }

    ctx.beginPath(); ctx.arc(x, y, r * .30, 0, RAD);
    ctx.fillStyle = 'rgba(3,2,5,.95)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, r * .30, 0, RAD);
    ctx.strokeStyle = hexA(p.e, .42); ctx.lineWidth = 2; ctx.stroke();
    const cg = ctx.createRadialGradient(x, y, 0, x, y, r*.16);
    cg.addColorStop(0, hexA(p.e, .80)); cg.addColorStop(1, hexA(p.e, 0));
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(x, y, r*.16, 0, RAD); ctx.fill();
  },
};

function drawBossShape(e) {
  const g = e.color;
  ctx.globalCompositeOperation = 'lighter';
  const phScale0 = e.phase >= 3 ? 1.15 : e.phase === 2 ? 1.08 : 1;
  drawGlow(e.x, e.y, e.r * phScale0 * (e.flash > 0 ? 4.4 : 3.4), g, e.flash > 0 ? .9 : .55);
  ctx.globalCompositeOperation = 'source-over';

  /* ---- 本体：按 bossId 分派（v3 正视写实） ---- */
  const bfn = BOSS_DRAW[e.bossId] || BOSS_DRAW.beast;

  /* 0.37.0：BOSS 形变层。以前这里是裸调 bfn(e)，BOSS 是零形变——
     一张完全静止的矢量图在屏幕上平移，这是「僵硬」的另一半原因。
     参数口径：BOSS 呼吸必须比小怪慢（2.2Hz vs 4.2Hz），幅度也更小，
     快而小会显虚，慢而沉才是「重」。 */
  /* 0.39.0 硬直喘息：rest 期间呼吸放慢、幅度加大（catch 姿态最明显），
     让「站定那 0.6 秒」也有起伏，而不是一个静止图层 */
  const restK = e.rest > 0 ? (e.pose === 'catch' ? 1 : .5) : 0;
  const br = 1 + Math.sin(S.t * (2.2 - .7 * restK) + (e.ph || 0)) * (.026 + .048 * restK);
  let msx = br, msy = br;
  if ((e.spd || 0) > 8) { msx *= .975; msy *= 1.025; }          /* 移动挤压 */
  if (e.sqT > 0) {                                              /* 受击反挤 */
    const kq = Math.min(1, e.sqT / .14);
    msx *= 1 - .13 * kq; msy *= 1 + .17 * kq;
  }
  if (e.winding > 0) {                                          /* 蓄力高频抖 */
    const w = Math.sin(S.t * 42) * .016;
    msx *= 1 + w; msy *= 1 - w;
  }
  if (e.charging > 0) { msx *= 1.12; msy *= .92; }              /* 冲撞：压扁拉宽 */
  /* 踏步：身体随脚步一抬一落，越重的东西抬得越低 */
  /* 踏步：走起来正常抬，硬直里小幅颠，完全静止时才真的不抬脚 */
  const stepK = (e.spd || 0) > 4 ? 1 : (e.rest > 0 ? .3 : 0);
  const stepY = stepK ? Math.abs(Math.sin(e.stepPh || 0)) * (e.r * .045) * stepK : 0;

  ctx.save();
  ctx.translate(e.x, e.y - stepY);
  ctx.scale(faceS(e), 1);             /* 只翻转不旋转（billboard）；0.39.0 有过渡 */
  ctx.scale(msx, msy);
  ctx.translate(-e.x, -e.y);          /* 抵消，形体函数继续用绝对坐标 */
  ART_FLASH = e.flash > 0 ? Math.min(.75, e.flash * 7) : 0;
  try { bfn(e); } finally { ART_FLASH = 0; }
  ctx.restore();

  /* ---- 阶段形态：P2 旋转虚线外环，P3 尖刺环 ---- */
  const phScale = e.phase >= 3 ? 1.15 : e.phase === 2 ? 1.08 : 1;
  if (e.phase >= 2) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(S.t * (e.phase >= 3 ? 1.6 : .9));
    ctx.strokeStyle = e.phase >= 3 ? 'rgba(255,80,110,.75)' : withAlpha(g, .55);
    ctx.lineWidth = e.phase >= 3 ? 3.5 : 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(0, 0, e.r * phScale * 1.28, 0, RAD); ctx.stroke();
    ctx.setLineDash([]);
    if (e.phase >= 3) {
      ctx.fillStyle = 'rgba(255,90,120,.85)';
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * RAD;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - .09) * e.r * phScale * 1.05, Math.sin(a - .09) * e.r * phScale * 1.05);
        ctx.lineTo(Math.cos(a) * e.r * phScale * 1.52, Math.sin(a) * e.r * phScale * 1.52);
        ctx.lineTo(Math.cos(a + .09) * e.r * phScale * 1.05, Math.sin(a + .09) * e.r * phScale * 1.05);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(e.x, e.y, e.r * 2.6, '#ff4d6d', .28 + Math.sin(S.t * 6) * .08);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }

  /* ---- 力竭破绽环（画在本体之后，不会被盖） ---- */
  if (e.rest > 0) {
    ctx.save();
    ctx.strokeStyle = '#ffd24a';
    ctx.globalAlpha = .55 + Math.sin(S.t * 8) * .25;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([7, 7]);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.75, 0, RAD); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('破绽！', e.x, e.y - e.r * 2.0);
    ctx.restore();
  }

  /* 阶段标记：脚下三格进度 */
  if (e.phase > 1) {
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 8, 0, RAD);
    ctx.strokeStyle = withAlpha(g, .45 + Math.sin(S.t * 6) * .2);
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

/* 双子之间的连线（带电） */
function drawTwinLinks() {
  for (const e of S.bosses) {
    if (e.shape !== 'twin' || !e.twin || e.twin.hp <= 0 || e.hp <= 0) continue;
    if (e.twinPart !== 0) continue;
    const t = e.twin;
    const flick = .55 + Math.sin(S.t * 22) * .25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    const seg = 6;
    for (let i = 1; i <= seg; i++) {
      const k = i / seg;
      const x = e.x + (t.x - e.x) * k;
      const y = e.y + (t.y - e.y) * k;
      const j = i === seg ? 0 : 8;
      ctx.lineTo(x + rnd(-j, j), y + rnd(-j, j));
    }
    ctx.strokeStyle = 'rgba(180,140,255,' + flick.toFixed(2) + ')';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (flick * .8).toFixed(2) + ')';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.restore();
  }
}
function drawOffscreenHints() {
  if (!SET.hints) return;
  const cx = (S.player.x - S.cam.x) * SET.view;
  const cy = (S.player.y - S.cam.y) * SET.view;
  const pad = 16;
  let shown = 0;
  ctx.save();
  for (const e of S.enemies) {
    if (e.hp <= 0) continue;
    const sx = (e.x - S.cam.x) * SET.view;
    const sy = (e.y - S.cam.y) * SET.view;
    if (sx > 2 && sx < W - 2 && sy > 2 && sy < H - 2) continue;
    if (shown >= 12) break;
    shown++;
    const a = Math.atan2(sy - cy, sx - cx);
    /* 从玩家屏幕位置沿方向打到屏幕边框 */
    let t = 1e9;
    const ca = Math.cos(a), sa = Math.sin(a);
    if (Math.abs(ca) > 1e-4) t = Math.min(t, ((ca > 0 ? W - pad : pad) - cx) / ca);
    if (Math.abs(sa) > 1e-4) t = Math.min(t, ((sa > 0 ? H - pad : pad) - cy) / sa);
    if (!isFinite(t) || t < 0) continue;
    const px = cx + ca * t;
    const py = cy + sa * t;
    const big = e.type === 'boss' || e.type === 'elite';
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.beginPath();
    const s = big ? 11 : 7;
    ctx.moveTo(s, 0); ctx.lineTo(-s * .8, s * .8); ctx.lineTo(-s * .8, -s * .8);
    ctx.closePath();
    ctx.fillStyle = big ? (e.color || '#ff4d6d') : 'rgba(255,150,170,.62)';
    ctx.globalAlpha = big ? .95 : .7;
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = stageTheme().bg;
  ctx.fillRect(0, 0, W, H);

  const vw = W / SET.view, vh = H / SET.view;
  const sh = S.shake * SET.shake;

  ctx.save();
  ctx.scale(SET.view, SET.view);
  ctx.translate(-S.cam.x + rnd(-sh, sh) + S.shakeVX * SET.shake, -S.cam.y + rnd(-sh, sh) + S.shakeVY * SET.shake);

  drawGrid(vw, vh);
  drawEdgeWarning();
  drawDomains();
  drawDecals();
  drawHazards();

  /* 经验宝石 */
  ctx.globalCompositeOperation = 'lighter';
  for (const g of S.gems) {
    const s = 5 + Math.sin(S.t * 6 + g.ph) * 1.4;
    drawGlow(g.x, g.y, s * 3.4, '#4be0c0', .8);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const g of S.gems) {
    const s = 5 + Math.sin(S.t * 6 + g.ph) * 1.4;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y - s); ctx.lineTo(g.x + s, g.y);
    ctx.lineTo(g.x, g.y + s); ctx.lineTo(g.x - s, g.y);
    ctx.closePath();
    ctx.fillStyle = '#8affec';
    ctx.fill();
  }

  /* 游钻（0.40.0）：地下位置提示——裂纹拖尾由 addDecal 一路留下，
     这里只画当前位置的闷震圈；收圈阶段颜色转暖，读作「它贴近了」 */
  for (const e of S.bosses) {
    const b = e.burrow;
    if (!b) continue;
    const kk = Math.min(1, b.t / b.dur);
    const hot = kk > .72 ? (kk - .72) / .28 : 0;
    const pulse = .5 + .5 * Math.sin(S.t * 9);
    ctx.save();
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(96,64,38,' + (.38 + .22 * pulse).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * .75 + pulse * 5, 0, RAD); ctx.stroke();
    if (hot > 0) {
      ctx.strokeStyle = 'rgba(255,138,64,' + (.2 + .45 * hot).toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 12, 0, RAD); ctx.stroke();
    }
    ctx.restore();
  }

  /* 双子连线（画在敌人之前，让本体盖住线头） */
  drawTwinLinks();

  /* 敌人 */
  for (const e of S.enemies) {
    /* 0.37.0 性能：视野剔除。
       密集怪卡的根因是填充率不是指令数——实测 150 只怪，同样 2547 次 stroke，
       在视野内光栅化 20.67ms/帧、在视野外只要 6.63ms。
       屏幕外的怪根本不该画。BOSS 不剔除（同屏最多两只，它的领域光晕伸得远）。 */
    if (e.type !== 'boss' &&
        (e.x < S.cam.x - 160 || e.x > S.cam.x + vw + 160 ||
         e.y < S.cam.y - 160 || e.y > S.cam.y + vh + 160)) continue;
    /* BOSS：形态各异，走专用绘制 */
    if (e.type === 'boss') {
      if (e.gone) continue;
      if (e.winding > 0) {
        const pulse = .45 + Math.sin(S.t * 26) * .22;
        const reach = 620;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + (e.cdx || 0) * reach, e.y + (e.cdy || 0) * reach);
        ctx.strokeStyle = 'rgba(255,70,70,' + pulse.toFixed(2) + ')';
        ctx.lineWidth = 6 + Math.sin(S.t * 26) * 2;
        ctx.setLineDash([20, 12]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
      const liftY = (e.bossId === 'beast' ? beastLiftY(e) : 0) +
        ((e.bossId === 'hive' && e.hiveGiant && e.hiveGiant.arc) || 0);  /* 跳踩弧线 / 大跳腾空 */
      if (liftY > 0) { ctx.save(); ctx.translate(0, -liftY); }
      const hg = (e.bossId === 'hive' && e.hiveGiant) ? e.hiveGiant.scale : 1;
      if (hg > 1) { ctx.save(); ctx.translate(e.x, e.y); ctx.scale(hg, hg); ctx.translate(-e.x, -e.y); }
      drawBossShape(e);
      if (hg > 1) ctx.restore();
      if (e.bossId === 'beast') drawBeastGiant(e);   /* 0.42.0：两臂两腿/手搓石球/土坡/跳影 */
      if (liftY > 0) ctx.restore();
      continue;
    }

    if (e.type === 'charger' && e.st === 'wind') {
      const ang = Math.atan2(S.player.y - e.y, S.player.x - e.x);
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(ang) * 250, e.y + Math.sin(ang) * 250);
      ctx.strokeStyle = 'rgba(255,120,80,.5)';
      ctx.lineWidth = 3;
      ctx.setLineDash([9, 7]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (e.hive) {
      drawHiveMinion(e);      /* 0.43.0：出土中的枯木怪 / 定角豌豆射手（占位画法） */
    } else {
      if (e.r > 25) {
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(e.x, e.y, e.r * 2.6, e.color, .5);
        ctx.globalCompositeOperation = 'source-over';
      }
      /* 0.29.0：形态化绘制（内含呼吸/挤压/朝向/受击形变） */
      drawEnemyArt(e);
    }

    if (e.slowT > 0) {
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, RAD);
      ctx.strokeStyle = 'rgba(201,163,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
    }

    if (e.maxHp > 300) {
      const bw = e.r * 2.2, hp = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(e.x - bw / 2, e.y - e.r - 15, bw, 5);
      ctx.fillStyle = e.type === 'boss' ? '#ff4d6d' : '#ffd24a';
      ctx.fillRect(e.x - bw / 2, e.y - e.r - 15, bw * hp, 5);
    }

    /* 精英词缀：彩色光环 + 头顶词缀名 */
    if (e.type === 'elite' && e.affix && e.affix.length) {
      for (let k = 0; k < e.affix.length; k++) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r + 6 + k * 4, 0, RAD);
        ctx.strokeStyle = AFFIXES[e.affix[k]].color;
        ctx.globalAlpha = .55;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.font = '700 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,.6)';
      const label = e.affix.map(a => AFFIXES[a].name).join('·');
      ctx.strokeText(label, e.x, e.y - e.r - 20);
      ctx.fillStyle = AFFIXES[e.affix[0]].color;
      ctx.fillText(label, e.x, e.y - e.r - 20);
      ctx.textAlign = 'left';
    }
  }

  drawHiveProps();   /* 0.43.0：阳光植物 / 超级食人花 / 大招两只手 */

  /* 弹丸：自己的弹幕可调透明度，也可以选择盖在敌人弹幕上面 */
  const drawPlayerBullets = () => {
    ctx.globalAlpha = SET.bAlpha;
    ctx.globalCompositeOperation = 'lighter';
    for (const b of S.bullets) {
      if (b.tx !== undefined && (b.tx !== b.x || b.ty !== b.y)) {
        ctx.strokeStyle = b.color;
        ctx.globalAlpha = .32 * SET.bAlpha;
        ctx.lineWidth = b.r;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(b.tx, b.ty); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    ctx.globalAlpha = SET.bAlpha;
    for (const b of S.bullets) drawGlow(b.x, b.y, b.r * (b.laser ? 4.2 : 3.4), b.color, .9);
    ctx.globalCompositeOperation = 'source-over';
    for (const b of S.bullets) {
      if (b.boom) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot || 0);
        const R = b.r;
        ctx.beginPath();
        ctx.moveTo(0, -R); ctx.lineTo(R * .55, 0); ctx.lineTo(0, R); ctx.lineTo(-R * .55, 0);
        ctx.closePath();
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.85)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
        continue;
      }
      const tail = b.laser ? .055 : .03;
      ctx.beginPath();
      ctx.moveTo(b.x - b.vx * tail, b.y - b.vy * tail);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = withAlpha(b.color, .7);
      ctx.lineWidth = b.r * 1.7;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * .58, 0, RAD);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  };

  const drawEnemyBullets = () => {
    ctx.globalCompositeOperation = 'lighter';
    for (const b of S.ebullets) drawGlow(b.x, b.y, b.r * 3.6, b.color, .85);
    ctx.globalCompositeOperation = 'source-over';
    for (const b of S.ebullets) {
      const core = b.kind === 'ice' ? '#e8fbff'
        : b.kind === 'fire' ? '#ffe6b8'
          : b.kind === 'void' ? '#e8d4ff'
            : b.kind === 'spore' ? '#d4f5b8'
              : b.kind === 'rock' ? '#ffd0b8'
                : '#ffd7de';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, RAD);
      ctx.fillStyle = core;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 3, 0, RAD);
      ctx.strokeStyle = withAlpha(b.color, .7);
      ctx.lineWidth = 2;
      ctx.stroke();
      if (b.kind === 'fire') {
        ctx.beginPath();
        ctx.arc(b.x + rnd(-1.5, 1.5), b.y - b.r * .55, b.r * .5, 0, RAD);
        ctx.fillStyle = 'rgba(255,210,120,.85)';
        ctx.fill();
      } else if (b.kind === 'ice') {
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - b.r * 1.5);
        ctx.lineTo(b.x + b.r * .6, b.y);
        ctx.lineTo(b.x, b.y + b.r * 1.5);
        ctx.lineTo(b.x - b.r * .6, b.y);
        ctx.closePath();
        ctx.strokeStyle = 'rgba(200,245,255,.75)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  };

  if (SET.bLayer === 'over') { drawEnemyBullets(); drawPlayerBullets(); }
  else { drawPlayerBullets(); drawEnemyBullets(); }

  /* 环绕光球 */
  if (S.orbs.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (const o of S.orbs) drawGlow(o.x, o.y, o.r * 4.4, '#c9a3ff', .85);
    ctx.globalCompositeOperation = 'source-over';
    for (const o of S.orbs) {
      if (o.slow) {
        ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 7, 0, RAD);
        ctx.strokeStyle = 'rgba(201,163,255,.35)'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, RAD);
      ctx.fillStyle = '#efe4ff'; ctx.fill();
      ctx.beginPath(); ctx.arc(o.x - o.r * .25, o.y - o.r * .25, o.r * .4, 0, RAD);
      ctx.fillStyle = '#ffffff'; ctx.fill();
    }
  }

  for (const bo of S.bolts) drawBolt(bo);

  /* 陨星火雨：预警圈 + 下落的陨石 */
  if (S.meteors && S.meteors.length) {
    for (const m of S.meteors) {
      const pr = 1 - Math.max(0, m.t) / m.max;
      ctx.globalAlpha = .35 + Math.sin(S.t * 20) * .18;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * .85, 0, RAD);
      ctx.strokeStyle = '#ff8a5c';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
      const ry = m.y - (1 - pr) * 430;
      const rx = m.x + (1 - pr) * 130;
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(rx, ry, 26, '#ff8a5c', .95);
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.moveTo(rx - 10, ry);
      ctx.lineTo(rx + 130 * (1 - pr) * .3, ry - 40);
      ctx.strokeStyle = 'rgba(255,138,92,.55)';
      ctx.lineWidth = 4;
      ctx.stroke();
    }
  }

  /* 精英·雷电词缀：脚下预警圈 */
  if (S.estrikes && S.estrikes.length) {
    for (const s2 of S.estrikes) {
      ctx.globalAlpha = .4 + Math.sin(S.t * 22) * .22;
      ctx.beginPath();
      ctx.arc(s2.x, s2.y, s2.r, 0, RAD);
      ctx.strokeStyle = '#ffe95a';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* 巨剑横扫的刀光 */
  if (S.slashes && S.slashes.length) {
    for (const s2 of S.slashes) {
      const a = Math.max(0, s2.life / s2.max);
      ctx.globalAlpha = a * .9;
      ctx.beginPath();
      ctx.arc(s2.x, s2.y, s2.range * (.55 + (1 - a) * .45), s2.a - s2.arc / 2, s2.a + s2.arc / 2);
      ctx.strokeStyle = s2.col;
      ctx.lineWidth = 13;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#fff2dd';
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.lineCap = 'butt';
  }

  /* 守护壁垒的金色领域 */
  if (S.aura && S.aura.on > 0) {
    const aw2 = S.weapons.find(w => w.id === 'aegis');
    const rad = WEAPONS.aegis.levels[aw2.lv - 1].radius;
    const pulse = 1 + Math.sin(S.t * 10) * .04;
    ctx.globalAlpha = .16;
    ctx.beginPath();
    ctx.arc(S.player.x, S.player.y, rad * pulse, 0, RAD);
    ctx.fillStyle = '#ffd24a';
    ctx.fill();
    ctx.globalAlpha = .8;
    ctx.beginPath();
    ctx.arc(S.player.x, S.player.y, rad * pulse, 0, RAD);
    ctx.strokeStyle = '#ffd24a';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  for (const q of S.parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;

  for (const r of S.rings) {
    ctx.globalAlpha = Math.max(0, r.life / r.max) * .8;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, RAD);
    ctx.strokeStyle = r.color; ctx.lineWidth = 2.5; ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* 素材帧爆炸：火球两帧交替叠加发光淡出 + 烟雾上飘 */
  for (const q of S.booms) {
    const pr = Math.min(1, q.t / q.life);
    const R = q.r0 * (.6 + pr * 1.8);
    const fi = SPR.imgs[q.t * 22 % 2 < 1 ? 'fire' : 'fire2'];
    const sm = SPR.imgs.smoke;
    ctx.save();
    ctx.translate(q.x, q.y);
    ctx.rotate(q.rot + q.spin * q.t);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1 - pr;
    if (fi) ctx.drawImage(fi, -R, -R, R * 2, R * 2);
    ctx.globalCompositeOperation = 'source-over';
    const sr = R * 1.25;
    ctx.globalAlpha = (1 - pr) * .45;
    if (sm) ctx.drawImage(sm, -sr, -sr - pr * 26, sr * 2, sr * 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* 伤害飘字 */
  ctx.textAlign = 'center';
  for (const t of S.texts) {
    const age = t.max - t.life;
    const sc = t.big ? 1 + Math.max(0, .45 - age * 2.4) * 1.6 : 1;
    const a = Math.max(0, t.life / t.max);
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.scale(sc, sc);
    ctx.globalAlpha = a;
    ctx.font = '700 ' + t.size + 'px sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.strokeText(t.text, 0, 0);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  /* 无人机 */
  if (S.drones && S.drones.length) {
    ctx.globalCompositeOperation = 'lighter';
    for (const d of S.drones) drawGlow(d.x, d.y, 26, WEAPONS.drone.color, .7);
    ctx.globalCompositeOperation = 'source-over';
    for (const d of S.drones) {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(S.t * 3);
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.lineTo(8, 0); ctx.lineTo(0, 8); ctx.lineTo(-8, 0);
      ctx.closePath();
      ctx.fillStyle = WEAPONS.drone.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 暗雾：盖在敌人与敌弹之上、玩家之下（0.36.0 虚空之影的信息剥夺） */
  drawShrouds();

  /* 玩家 */
  const p = S.player;
  const pc = (S.char && S.char.color) || '#5ad9ff';
  /* 沙暴吹起：影子留地上，整个本体（光环+方块+箭头）提起来——一眼看出悬空 */
  const pLift = S.pLift || 0;
  if (pLift > 0) {
    ctx.save();
    ctx.globalAlpha = .4;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + p.r * .55, p.r * .95, p.r * .42, 0, 0, RAD);
    ctx.fillStyle = '#241608';
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(0, -pLift);
  }
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(p.x, p.y, p.r * 4.6, pc, .5);
  ctx.globalCompositeOperation = 'source-over';

  const blink = p.inv > 0 && Math.floor(p.inv * 14) % 2 === 0;
  ctx.globalAlpha = blink ? .35 : 1;
  /* 角色外圈：一层薄环，让不同角色的颜色更好认 */
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 4, 0, RAD);
  ctx.strokeStyle = withAlpha(pc, .45);
  ctx.lineWidth = 2;
  ctx.stroke();

  /* 有自定义头像时，主角本体就是这张照片 */
  if (AVA.ready && AVA.img) {
    const rr = p.r * 1.32;
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr, 0, RAD);
    ctx.closePath();
    ctx.clip();
    try { ctx.drawImage(AVA.img, p.x - rr, p.y - rr, rr * 2, rr * 2); } catch (err) { }
    ctx.restore();
    ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, RAD);
    ctx.strokeStyle = pc; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, rr + 3, 0, RAD);
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, RAD);
    ctx.fillStyle = pc; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(10,20,40,.5)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .72, 0, RAD);
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fill();
    ctx.fillStyle = 'rgba(10,20,40,.9)';
    ctx.font = '700 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((S.char && S.char.mark) || '雷', p.x, p.y + 1);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
  ctx.beginPath();
  ctx.moveTo(p.x + p.ax * (p.r + 9), p.y + p.ay * (p.r + 9));
  ctx.lineTo(p.x + p.ax * 6 - p.ay * 5, p.y + p.ay * 6 + p.ax * 5);
  ctx.lineTo(p.x + p.ax * 6 + p.ay * 5, p.y + p.ay * 6 - p.ax * 5);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.globalAlpha = 1;
  if (pLift > 0) ctx.restore();   /* 悬空态收回来，别影响暗幕和 HUD */

  /* 长夜：全屏暗幕最后盖（挖掉锥形光与玩家微光），HUD 之前 */
  drawNight();

  ctx.restore();

  /* ---- 屏幕空间 ---- */

  /* 屏幕外的敌人：边缘小箭头提示，别让玩家不知道怪从哪边来 */
  drawOffscreenHints();

  /* BOSS 血条（0.30.0 简化）：多 BOSS 同屏只画一条——
     正在打的 = 离玩家最近的活 BOSS，名字后面 ×N 表示还剩几个 */
  const bf = bossFocus();
  if (bf) {
    const b = bf.b;
    const nm = bf.packName
      ? (bf.bodies > 1
        ? (bf.packName + ' ×' + bf.bodies)
        : (b.bossName || bf.packName))
        + (bf.n > 1 ? '  |  还有 ' + (bf.n - 1) + ' 个' : '')
      : ((b.bossName || 'BOSS') + (bf.n > 1 ? ' ×' + bf.n : ''));
    const bw = Math.min(SET.mobile ? 340 : 520, W - 40);
    const bx = (W - bw) / 2;
    const by = SET.mobile ? 96 : 78;
    ctx.font = '600 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    const tw = ctx.measureText(nm).width;
    ctx.fillStyle = 'rgba(8,12,22,.72)';
    ctx.fillRect(W / 2 - tw / 2 - 6, by - 16, tw + 12, 14);
    ctx.fillStyle = '#ffd8e0';
    ctx.fillText(nm, W / 2, by - 5);
    ctx.textAlign = 'left';

    ctx.fillStyle = 'rgba(8,12,22,.8)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(bx, by, bw, 8);
    ctx.fillStyle = b.color || '#ff4d6d';
    ctx.fillRect(bx, by, bw * Math.max(0, b.hp / b.maxHp), 8);
    /* 阶段刻度：66% / 33% */
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(bx + bw * .66, by, 1, 8);
    ctx.fillRect(bx + bw * .33, by, 1, 8);
  }

  if (S.player.hp < S.player.maxHp * .35) {
    const pulse = .16 + Math.sin(S.t * 7) * .09;
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .28, W / 2, H / 2, Math.max(W, H) * .72);
    g.addColorStop(0, 'rgba(255,30,60,0)');
    g.addColorStop(1, 'rgba(255,30,60,' + pulse.toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (S.hurtFlash > 0) {
    const a = Math.min(.5, S.hurtFlash * .45);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .22, W / 2, H / 2, Math.max(W, H) * .7);
    g.addColorStop(0, 'rgba(255,40,60,0)');
    g.addColorStop(1, 'rgba(255,40,60,' + a.toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.beginPath();
    ctx.arc(W / 2, H / 2, Math.min(W, H) * .42, S.hurtDir - .42, S.hurtDir + .42);
    ctx.strokeStyle = 'rgba(255,90,90,' + (S.hurtFlash * .65).toFixed(3) + ')';
    ctx.lineWidth = 16;
    ctx.stroke();
  }

  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .42, W / 2, H / 2, Math.max(W, H) * .78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (S.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (S.flash * .5).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (S.banner) drawBanner(S.banner);

  if (joy) {
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 46, 0, RAD);
    ctx.fillStyle = 'rgba(120,160,240,.12)'; ctx.fill();
    ctx.strokeStyle = 'rgba(140,180,255,.35)'; ctx.lineWidth = 2; ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy;
    const l = Math.min(46, Math.hypot(dx, dy)) || 0;
    const a = Math.atan2(dy, dx);
    ctx.beginPath();
    ctx.arc(joy.ox + Math.cos(a) * l, joy.oy + Math.sin(a) * l, 20, 0, RAD);
    ctx.fillStyle = 'rgba(90,217,255,.55)'; ctx.fill();
  }
}

function drawBanner(b) {
  const fadeIn = Math.min(1, (1 - b.life / b.max) * 6);
  const fadeOut = Math.min(1, b.life / .3);
  const a = Math.min(fadeIn, fadeOut);
  const y = Math.min(H * .24, 190);
  const size = b.big ? Math.min(38, Math.max(22, W * .055)) : 17;

  ctx.textAlign = 'center';
  ctx.globalAlpha = a;

  const grd = ctx.createLinearGradient(0, y - size * 2, 0, y + size * .9);
  grd.addColorStop(0, withAlpha(b.color, 0));
  grd.addColorStop(.55, withAlpha(b.color, .14));
  grd.addColorStop(1, withAlpha(b.color, 0));
  ctx.fillStyle = grd;
  ctx.fillRect(0, y - size * 2, W, size * 3);

  ctx.font = '800 ' + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.lineWidth = b.big ? 6 : 4;
  ctx.strokeStyle = 'rgba(0,0,0,.55)';
  ctx.strokeText(b.text, W / 2, y);
  ctx.fillStyle = b.color;
  ctx.fillText(b.text, W / 2, y);

  if (b.sub) {
    ctx.font = '600 ' + Math.round(size * .46) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(230,240,255,.85)';
    ctx.fillText(b.sub, W / 2, y + size * .82);
  }

  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ---------- HUD ---------- */
function updateHUD() {
  arenaHudSync();
  el.time.textContent = fmtTime(S.t);
  el.kills.textContent = '击杀 ' + S.kills;
  el.lv.textContent = 'Lv.' + S.level;
  if (el.lv2) el.lv2.textContent = 'Lv.' + S.level;
  el.hpTxt.textContent = Math.ceil(S.player.hp) + '/' + S.player.maxHp;
  el.hp.style.width = (S.player.hp / S.player.maxHp * 100) + '%';
  el.xp.style.width = (S.xp / S.xpNeed * 100) + '%';

  const d = Math.round(S.dps);
  el.dps.textContent = 'DPS ' + d;
  el.dps.style.color = d >= 1500 ? '#ff6b6b' : d >= 600 ? '#ffb36b' : d >= 200 ? '#7fe0ff' : '#8fa6d8';

  if (el.score) el.score.textContent = '分数 ' + scoreNow();

  if (el.wave) {
    if (S.runMode === 'rush') {
      const rw = S.rushWave || 1;
      const bg = rushBossGroups();
      const left = bg + (S.bossQueue ? S.bossQueue.length : 0);
      const capNow = S.bossCap || 1;
      /* 手机上顶栏窄，用短写法免得撞到右侧按钮 */
      el.wave.textContent = SET.mobile
        ? ('狂潮' + rw + '轮 BOSS' + bg + '/' + capNow + ' 剩' + left)
        : ('狂潮 ' + rw + '轮 · BOSS ' + bg + '/' + capNow + ' · 本轮剩' + left);
      el.wave.style.color = '#ffd24a';
      el.wave.title = '第 ' + rw + ' 轮 · 同屏上限：' + (RUSH_CAPS[RUSHCAP] || RUSH_CAPS.normal).name;
      return;
    }
    const total = currentWaves().length;
    const stageName = S.stage ? S.stage.name : '';
    const loopTxt = S.loop > 0 ? ('×' + (S.loop + 1) + ' ') : '';
    const left = S.waveLeft > 0 ? (' · 剩' + S.waveLeft) : '';
    el.wave.textContent = loopTxt + stageName + ' ' + Math.min(S.waveIdx + 1, total) + '/' + total + left;
    el.wave.style.color = diff().color;
    el.wave.title = diff().name;
  }
}

function renderWeapons() {
  el.weps.innerHTML = S.weapons.map(w => {
    const d = WEAPONS[w.id];
    let dots = '';
    for (let i = 0; i < d.maxLv; i++) {
      dots += '<s style="background:' + (i < w.lv ? d.color : 'rgba(255,255,255,.13)') + '"></s>';
    }
    return '<div class="wchip" style="border-color:' + withAlpha(d.color, .5) + '">' +
      '<i style="background:' + d.color + '"></i>' +
      '<b>' + d.name + '</b>' +
      '<em>' + d.levels[w.lv - 1].form + '</em>' +
      '<span class="dots">' + dots + '</span>' +
      '</div>';
  }).join('');
}

function announce(text, sub, color, big) {
  S.banner = { text, sub, color: color || '#ffffff', life: big ? 1.35 : .85, max: big ? 1.35 : .85, big: !!big };
  if (big) { S.flash = .6; S.shake = Math.min(15, S.shake + 7); }
}

function toggleMute() {
  SFX.muted = !SFX.muted;
  localStorage.setItem('sv_mute', SFX.muted ? '1' : '0');
  document.getElementById('muteBtn').textContent = SFX.muted ? '静音' : '音效';
}

/* ---------- 升级 ---------- */
function buildPool() {
  const pool = [];

  for (const w of S.weapons) {
    const def = WEAPONS[w.id];
    if (w.lv >= def.maxLv) continue;
    const nx = def.levels[w.lv];
    pool.push({
      name: def.name,
      desc: nx.desc,
      tag: 'Lv.' + w.lv + ' → Lv.' + (w.lv + 1) + (nx.milestone ? ' · 质变' : ''),
      color: def.color,
      ms: !!nx.milestone,
      apply() {
        w.lv++;
        renderWeapons();
        announce(def.name + ' Lv.' + w.lv, nx.form, def.color, !!nx.milestone);
        if (nx.milestone) SFX.evolve();
      },
    });
  }

  /* 武器上限 = BALANCE.wm（设置中心「武器数量」可调，默认 6 把）。
     拿满后三选一只出升级/被动；一次升级只随机抛 2 把新武器，
     否则升级全是「拿新枪」没人升旧枪 */
  const wmCap = Math.min(BALANCE.wm || 6, Object.keys(WEAPONS).length);
  if (S.weapons.length < wmCap) {
    const owned = new Set(S.weapons.map(w => w.id));
    const cands = Object.keys(WEAPONS).filter(id => !owned.has(id));
    const shown = [];
    while (shown.length < 2 && cands.length) {
      shown.push(cands.splice((Math.random() * cands.length) | 0, 1)[0]);
    }
    for (const id of shown) {
      const def = WEAPONS[id];
      pool.push({
        name: '新武器 · ' + def.name,
        desc: def.intro,
        tag: '解锁 · ' + def.levels[0].form,
        color: def.color,
        ms: true,
        apply() {
          if (S.weapons.length >= Math.min(BALANCE.wm || 6, Object.keys(WEAPONS).length)) return;
          S.weapons.push({ id: id, lv: 1, timer: 0 });
          renderWeapons();
          announce(def.name, '新武器解锁', def.color, true);
          SFX.evolve();
        },
      });
    }
  }

  for (const u of PASSIVES) {
    if (Math.random() < .55) continue;
    pool.push({ name: u.name, desc: u.desc, tag: '被动强化', color: '#8fa6d8', apply: () => u.apply(S.st, S.player) });
  }

  let guard = 0;
  while (pool.length < 3 && guard++ < 20) {
    const u = PASSIVES[Math.floor(Math.random() * PASSIVES.length)];
    pool.push({ name: u.name, desc: u.desc, tag: '被动强化', color: '#8fa6d8', apply: () => u.apply(S.st, S.player) });
  }
  return pool;
}

function showLevelUp() {
  S.mode = 'levelup';
  /* 升级喘息位：清除玩家 220px 内的敌方弹幕（全场不清，外围照常压过来） */
  const p = S.player, R = 220;
  let cleared = 0;
  for (let i = S.ebullets.length - 1; i >= 0; i--) {
    const b = S.ebullets[i];
    if (d2(b.x, b.y, p.x, p.y) < R * R) {
      addPart(b.x, b.y, b.color || '#9fd0ff', rnd(40, 140), 2);
      S.ebullets.splice(i, 1);
      cleared++;
    }
  }
  if (cleared) {
    addRing(p.x, p.y, '#9fd0ff', 8, R, .4);
    SFX.zap();
  }
  SFX.level();
  const pool = buildPool();
  S.roll = [];
  while (S.roll.length < 3 && pool.length) {
    S.roll.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  showOverlay(
    '<h1>升级 Lv.' + S.level + '</h1>' +
    '<p>每把武器 5 个形态 · 3 级与 5 级质变</p>' +
    '<div class="cards">' +
    S.roll.map((u, i) =>
      '<button class="card" data-i="' + i + '" style="--c:' + (u.color || '#7f8db3') + '">' +
      (u.ms ? '<span class="ms">质变</span>' : '') +
      '<b>' + u.name + '</b>' +
      '<small>' + u.desc + '</small>' +
      '<i>' + u.tag + ' · 按 ' + (i + 1) + '</i>' +
      '</button>'
    ).join('') +
    '</div>'
  );
  ov.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', () => pickUpgrade(+c.getAttribute('data-i')));
  });
}

function pickUpgrade(i) {
  if (S.mode !== 'levelup') return;
  const u = S.roll[i];
  if (!u) return;
  u.apply();
  S.pendingLevels--;
  if (S.pendingLevels > 0) showLevelUp();
  else { S.mode = 'play'; closeOverlay(); }
}

/* ---------- 状态切换 ---------- */
function showOverlay(html) {
  ov.classList.remove('hide');
  ov.innerHTML = '<div class="panel">' + html + '</div>';
  document.body.classList.add('ov-open');
}

function closeOverlay() {
  dexStop();
  ov.classList.add('hide');
  document.body.classList.remove('ov-open');
}

/* 主菜单里隐藏游戏内 HUD / 按钮 */
function setMenuMode(on) {
  document.body.classList.toggle('in-menu', !!on);
}

let LOG_SEL = null;      /* 当前选中的版本 */
let LOG_BACK = 'start';  /* 返回目标：start / settings / game / pause / over */

function showChangelog(fromSettings) {
  if (fromSettings) LOG_BACK = 'settings';
  try { localStorage.setItem('sv_logver', CHANGELOG[0].v); } catch (e) { }   /* 看过就记，别再自动弹 */
  if (S.mode === 'play') { S.mode = 'settings'; joy = null; }
  else if (S.mode !== 'settings') S.mode = 'settings';
  if (!LOG_SEL || !CHANGELOG.some(c => c.v === LOG_SEL)) LOG_SEL = CHANGELOG[0].v;

  const cur = CHANGELOG[0].v;
  const list = CHANGELOG.map(c =>
    '<button data-log="' + c.v + '" class="' + (c.v === LOG_SEL ? 'on' : '') + '">' +
    '<b>' + c.v + (c.v === cur ? ' <span class="cur">新</span>' : '') + '</b><i>' + c.d + '</i></button>').join('');
  const c = CHANGELOG.find(x => x.v === LOG_SEL);
  const body = '<h3>' + c.v + ' · ' + c.t + '<time>' + c.d + '</time></h3><ul>' +
    c.items.map(i => '<li>' + i + '</li>').join('') + '</ul>';

  showOverlay(
    '<h1>更新日志</h1>' +
    '<div class="logwrap"><div class="loglist">' + list + '</div>' +
    '<div class="logbody" id="logbody">' + body + '</div></div>' +
    '<div style="margin-top:14px"><button class="btn" id="logback">返回</button></div>'
  );
  document.querySelectorAll('[data-log]').forEach(b => {
    b.addEventListener('click', () => {
      LOG_SEL = b.getAttribute('data-log');
      /* 只换选中态和右侧内容，不重建左列 —— 滚动条不会跳回顶部 */
      document.querySelectorAll('[data-log]').forEach(x => x.classList.toggle('on', x === b));
      const cc = CHANGELOG.find(x => x.v === LOG_SEL);
      document.getElementById('logbody').innerHTML =
        '<h3>' + cc.v + ' · ' + cc.t + '<time>' + cc.d + '</time></h3><ul>' +
        cc.items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
    });
  });
  document.getElementById('logback').onclick = () => {
    if (LOG_BACK === 'settings') showSettings(SET_BACK || 'start');
    else if (LOG_BACK === 'game') { S.mode = 'play'; setMenuMode(false); closeOverlay(); }
    else if (LOG_BACK === 'pause') pauseGame();
    else if (LOG_BACK === 'over') gameOverPanelOnly();
    else showStart();
  };
}
