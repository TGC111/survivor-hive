      /* 缩回：刺沉下去，只留一层很快褪掉的残影 */
      const rem = 1 - h.warn - h.spike;
      if (rem <= 0) continue;
      const s = (q - h.warn - h.spike) / rem;
      const a = 1 - s;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(h.x, h.y, c, 0, RAD);
      ctx.strokeStyle = withAlpha(h.color, .16 * a);
      ctx.lineWidth = h.w * (.5 + s * .5);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(h.x, h.y, rIn, 0, RAD);
      ctx.strokeStyle = withAlpha(h.color, .45 * a);
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

/* 地面危险区：火池 / 毒潭 / 冰墙 / 扩散冲击环 / 落石预警 */
/* 虚空凝视的扇形视线（0.36.0）：蓄能时只有一条虚线与中轴线，
   真正扫过来时才是实心紫锥——先看见线，再看见锥，两层预警 */
function drawGaze(h, fade, warn) {
  const a0 = h.rot - h.h * .5, a1 = h.rot + h.h * .5;
  if (warn) {
    ctx.strokeStyle = 'rgba(216,180,255,' + (.45 + Math.sin(S.t * 22) * .2).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 10]);
    ctx.beginPath();
    ctx.moveTo(h.x, h.y);
    ctx.lineTo(h.x + Math.cos(h.rot) * h.w, h.y + Math.sin(h.rot) * h.w);
    ctx.stroke();
    ctx.setLineDash([]);
    /* 两条边界线：提前看出锥有多宽 */
    ctx.globalAlpha = .3;
    ctx.beginPath();
    ctx.moveTo(h.x, h.y);
    ctx.lineTo(h.x + Math.cos(a0) * h.w, h.y + Math.sin(a0) * h.w);
    ctx.moveTo(h.x, h.y);
    ctx.lineTo(h.x + Math.cos(a1) * h.w, h.y + Math.sin(a1) * h.w);
    ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }
  const grd = ctx.createRadialGradient(h.x, h.y, 20, h.x, h.y, h.w);
  grd.addColorStop(0, 'rgba(232,206,255,.52)');
  grd.addColorStop(.42, 'rgba(160,100,255,.26)');
  grd.addColorStop(1, 'rgba(120,60,220,0)');
  ctx.beginPath();
  ctx.moveTo(h.x, h.y);
  ctx.arc(h.x, h.y, h.w, a0, a1);
  ctx.closePath();
  ctx.fillStyle = grd;
  ctx.fill();
  ctx.strokeStyle = 'rgba(236,210,255,.6)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawHazards() {
  for (const h of S.hazards) {
    const fade = Math.min(1, h.life / .35);
    const warn = h.warm > 0 && (S.t - h.born) < h.warm;
    ctx.save();
    ctx.globalAlpha = fade;

    if (h.kind === 'tide') { drawTide(h); ctx.restore(); continue; }
    if (h.kind === 'gaze') { drawGaze(h, fade, warn); ctx.restore(); continue; }
    if (h.kind === 'sand') {   /* 0.42.1 沙暴：收缩圈=摔落倒计时，风从头到尾看得见 */
      const p = S.player;
      const wl = Math.hypot(h.wx || 0, h.wy || 0) || 1;
      const ux = h.wx / wl, uy = h.wy / wl;
      /* 风道：三道流线从上游刮到玩家，别跟脚下粒子混 */
      for (let i2 = 0; i2 < 3; i2++) {
        const off = (i2 - 1) * 26;
        const len = 150 + ((S.t * 480 + i2 * 61) % 130);
        const sx = p.x - ux * len - uy * off, sy = p.y - uy * len + ux * off;
        const ex2 = p.x - uy * off, ey2 = p.y + ux * off;
        ctx.strokeStyle = 'rgba(216,176,120,' + (.22 + .2 * Math.sin(S.t * 9 + i2 * 2)).toFixed(2) + ')';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex2, ey2); ctx.stroke();
      }
      /* 旋转沙尘：围着人转的一圈 */
      for (let i2 = 0; i2 < 8; i2++) {
        const a2 = S.t * 6 + i2 / 8 * RAD;
        ctx.fillStyle = 'rgba(216,176,120,.4)';
        ctx.beginPath();
        ctx.arc(p.x + Math.cos(a2) * 34, p.y + Math.sin(a2) * 34 - 10, 4 + i2 % 3, 0, RAD);
        ctx.fill();
      }
      /* 摔落倒计时：圈从 108 收缩到脚底，快落地时转红闪 */
      const prog = 1 - Math.max(0, h.life) / (h.life0 || 1.5);
      const rr = 108 * (1 - prog) + 16;
      const hot = prog > .62;
      ctx.globalAlpha = hot ? (.75 + .25 * Math.sin(S.t * 30)) : .8;
      ctx.strokeStyle = hot ? 'rgba(255,120,80,.95)' : 'rgba(255,220,150,.85)';
      ctx.lineWidth = hot ? 4.5 : 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, RAD); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore(); continue;
    }

    if (h.kind === 'blades') {
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      const nb = h.n || 1;
      for (let i = 0; i < nb; i++) {
        ctx.save();
        ctx.rotate(i * RAD / nb);
        ctx.fillStyle = warn ? withAlpha(h.color, .18) : withAlpha(h.color, .72);
        ctx.fillRect(h.r - h.w * .5, -h.h * .5, h.w, h.h);
        ctx.strokeStyle = warn ? withAlpha(h.color, .55) : 'rgba(255,255,255,.55)';
        ctx.lineWidth = 2;
        ctx.strokeRect(h.r - h.w * .5, -h.h * .5, h.w, h.h);
        ctx.restore();
      }
      ctx.restore(); continue;
    }

    if (h.kind === 'ring') {
      const R = Math.max(2, h.r);
      const half = Math.max(.02, h.gapW);
      const a0 = h.gapA + half;                 /* 缺口一侧 */
      const a1 = h.gapA + RAD - half;           /* 绕过缺口，画到另一侧 */

      if (warn) {
        /* 预警：缺口近处给一小块绿色光斑定方向，两条边界线拉到远处，
           远处也知道往哪边跑；不铺满整屏，否则三波叠起来糊成一团 */
        const blink = .30 + Math.sin(S.t * 18) * .14;
        ctx.beginPath();
        ctx.arc(h.x, h.y, R, 0, RAD);
        ctx.strokeStyle = 'rgba(255,190,130,.20)';
        ctx.lineWidth = 2;
        ctx.setLineDash([9, 9]);
        ctx.stroke();
        ctx.setLineDash([]);

        const L = 240;
        const grd = ctx.createRadialGradient(h.x, h.y, 14, h.x, h.y, L);
        grd.addColorStop(0, 'rgba(110,255,190,' + (blink * .5).toFixed(2) + ')');
        grd.addColorStop(1, 'rgba(110,255,190,0)');
        ctx.beginPath();
        ctx.moveTo(h.x, h.y);
        ctx.arc(h.x, h.y, L, h.gapA - half, h.gapA + half);
        ctx.closePath();
        ctx.fillStyle = grd;
        ctx.fill();

        const far = h.maxR || 520;
        ctx.setLineDash([12, 10]);
        for (const s of [-1, 1]) {
          const aa = h.gapA + s * half;
          const ex = Math.cos(aa), ey = Math.sin(aa);
          ctx.beginPath();
          ctx.moveTo(h.x + ex * (R + 8), h.y + ey * (R + 8));
          ctx.lineTo(h.x + ex * far, h.y + ey * far);
          ctx.strokeStyle = 'rgba(120,255,190,' + (blink * .75).toFixed(2) + ')';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.setLineDash([]);
      } else {
        /* 激活：画成一段带缺口的环带 */
        ctx.beginPath();
        ctx.arc(h.x, h.y, R, a0, a1);
        ctx.strokeStyle = withAlpha(h.color, .52);
        ctx.lineWidth = h.thick;
        ctx.lineCap = 'butt';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(h.x, h.y, R, a0, a1);
        ctx.strokeStyle = 'rgba(255,255,255,.5)';
        ctx.lineWidth = 3;
        ctx.stroke();

        /* 缺口两端画个断口，明确"这里断了可以过" */
        for (const s of [-1, 1]) {
          const aa = h.gapA + s * half;
          const ex = Math.cos(aa), ey = Math.sin(aa);
          ctx.beginPath();
          ctx.moveTo(h.x + ex * (R - h.thick * .5), h.y + ey * (R - h.thick * .5));
          ctx.lineTo(h.x + ex * (R + h.thick * .5), h.y + ey * (R + h.thick * .5));
          ctx.strokeStyle = 'rgba(180,255,220,.95)';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
      }
    } else if (h.kind === 'vine' || h.kind === 'mist') {
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      ctx.fillStyle = warn ? withAlpha(h.color, .18)
        : withAlpha(h.color, h.kind === 'mist' ? .28 : .6);
      ctx.fillRect(-h.w * .5, -h.h * .5, h.w, h.h);
      if (h.kind === 'vine') {
        ctx.strokeStyle = warn ? withAlpha(h.color, .55) : 'rgba(255,255,255,.6)';
        ctx.lineWidth = 2;
        for (let vx = -h.w * .5; vx < h.w * .5; vx += 34) {
          ctx.beginPath();
          ctx.moveTo(vx, -h.h * .5);
          ctx.lineTo(vx + 17, -h.h * .5 - 9);
          ctx.stroke();
        }
      }
      ctx.restore(); continue;
    } else if (h.w > 0) {
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      if (h.kind === 'beam') {
        ctx.fillStyle = warn ? 'rgba(180,140,255,.16)' : withAlpha(h.color, .5);
        ctx.fillRect(-h.w / 2, -h.h / 2, h.w, h.h);
        if (!warn) {
          ctx.fillStyle = 'rgba(255,255,255,.75)';
          ctx.fillRect(-h.w / 2, -h.h * .15, h.w, h.h * .3);
        }
      } else {
        ctx.fillStyle = warn ? 'rgba(130,220,255,.14)' : withAlpha(h.color, .30);
        ctx.fillRect(-h.w / 2, -h.h / 2, h.w, h.h);
        ctx.beginPath();
        for (let x = -h.w / 2; x < h.w / 2; x += 28) {
          ctx.moveTo(x, h.h / 2);
          ctx.lineTo(x + 14, h.h / 2 + 10);
          ctx.lineTo(x + 28, h.h / 2);
        }
        ctx.strokeStyle = warn ? 'rgba(150,230,255,.5)' : withAlpha(h.color, .9);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.strokeRect(-h.w / 2, -h.h / 2, h.w, h.h);
      }
    } else {
      const pulse = 1 + Math.sin(S.t * 7 + h.x * .05) * .05;
      const grd = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, Math.max(4, h.r * pulse * 1.3));
      grd.addColorStop(0, withAlpha(h.color, warn ? .12 : .34));
      grd.addColorStop(.62, withAlpha(h.color, warn ? .07 : .16));
      grd.addColorStop(1, withAlpha(h.color, 0));
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r * pulse * 1.3, 0, RAD);
      ctx.fill();

      if (warn) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, RAD);
        ctx.strokeStyle = withAlpha(h.color, .85);
        ctx.lineWidth = 2;
        ctx.setLineDash([7, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      } else if (h.kind === 'spike') {
        for (let k = 0; k < 5; k++) {
          const a2 = k / 5 * RAD + S.t * .7;
          const sx = h.x + Math.cos(a2) * h.r * .52;
          const sy = h.y + Math.sin(a2) * h.r * .52;
          ctx.beginPath();
          ctx.moveTo(sx, sy - 18);
          ctx.lineTo(sx + 7, sy + 7);
          ctx.lineTo(sx - 7, sy + 7);
          ctx.closePath();
          ctx.fillStyle = withAlpha(h.color, .92);
          ctx.fill();
        }
      } else if (h.kind === 'meteor') {
        /* 地爆天星：聚形时越滚越大；起飞后石头本体在空中飞，地面影子标落点 */
        if (h.st !== 'fly' && h.st !== 'slam') {
          const k = Math.min(1, (h.age || 0) / h.T);
          ctx.setLineDash([10, 8]);
          ctx.beginPath(); ctx.arc(h.x, h.y, h.r1, 0, RAD);
          ctx.strokeStyle = 'rgba(255,150,90,' + (.28 + k * .5).toFixed(2) + ')';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.setLineDash([]);
          for (let j = 0; j < 5; j++) {
            const fr = ((S.t * .8 + j * .21) % 1);
            const a = j / 5 * RAD + S.t * .7;
            const dd = h.r1 * (1.65 - fr * .65);
            ctx.globalAlpha = fade * fr * .8;
            ctx.fillStyle = '#a97b52';
            ctx.beginPath();
            ctx.arc(h.x + Math.cos(a) * dd, h.y + Math.sin(a) * dd, 4 + k * 3, 0, RAD);
            ctx.fill();
          }
          ctx.globalAlpha = fade;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r, 0, RAD);
          ctx.fillStyle = withAlpha('#8a6a52', .85);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(h.x - h.r * .25, h.y - h.r * .25, h.r * .45, 0, RAD);
          ctx.fillStyle = 'rgba(255,220,170,.25)';
          ctx.fill();
        } else {
          /* 落点预警圈 + 地面影子（影子中心=砸点），石头本体在空中带拖尾 */
          const kk = h.st === 'slam' ? 1 : Math.min(1, h.flyT / h.flyDur);
          ctx.setLineDash([10, 8]);
          ctx.beginPath(); ctx.arc(h.tx, h.ty, h.r1 + 12, 0, RAD);
          ctx.strokeStyle = 'rgba(255,120,70,' + (.35 + kk * .5).toFixed(2) + ')';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = fade * (h.st === 'slam' ? .3 : .5 * (.4 + kk * .6));
          ctx.beginPath(); ctx.ellipse(h.tx, h.ty + h.r1 * .12, h.r * .95, h.r * .34, 0, 0, RAD);
          ctx.fillStyle = '#000';
          ctx.fill();
          ctx.globalAlpha = fade;
          const lift = (h.arc || 0) * 120;
          ctx.beginPath();
          ctx.arc(h.x, h.y - lift, h.r, 0, RAD);
          ctx.fillStyle = h.st === 'slam' ? '#e08a4a' : '#8a6a52';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(h.x - h.r * .25, h.y - lift - h.r * .25, h.r * .45, 0, RAD);
          ctx.fillStyle = 'rgba(255,220,170,.3)';
          ctx.fill();
          if (h.st === 'fly') {
            for (let j = 1; j <= 3; j++) {
              ctx.globalAlpha = fade * .3 / j;
              ctx.beginPath();
              ctx.arc(h.x - (h.x - h.sx) * .05 * j, h.y - lift - (h.y - h.sy) * .05 * j,
                h.r * (.82 - j * .16), 0, RAD);
              ctx.fillStyle = '#a97b52';
              ctx.fill();
            }
            ctx.globalAlpha = fade;
          }
        }
      } else if (h.kind === 'rock') {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r * .62, 0, RAD);
        ctx.fillStyle = withAlpha(h.color, .45);
        ctx.fill();
      } else if (h.kind === 'void') {
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r * .42, 0, RAD);
        ctx.strokeStyle = 'rgba(225,190,255,.9)';
        ctx.lineWidth = 3;
        ctx.stroke();
        for (let k = 0; k < 3; k++) {
          const rr = h.r * (.55 + k * .22) * (1 - ((S.t * .8 + k * .3) % 1) * .3);
          ctx.beginPath();
          ctx.arc(h.x, h.y, rr, 0, RAD);
          ctx.strokeStyle = 'rgba(180,140,255,' + (.35 - k * .08).toFixed(2) + ')';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
}

/* BOSS 外形：蛇身 / 带手臂的空洞怪 / 双子（连线单独画） */
/* =========================================================
   敌人美术 v3 —— 正视写实体积（0.34.0）
   和 0.29.0 的根本区别：**不再 rotate**。角色永远正面朝镜头，
   只做水平翻转（e.face），这样才能画腿、画体态。
   四层管道：渐变体积 → 暗轮廓 → 顶部边缘光 → 细元素色勾边
   ========================================================= */

/* 四档配色：e 元素色（轮廓光/高光） d 暗部 m 中间调 l 亮面
   e 值等于 TYPES[x].color，是玩家的辨识色，不许改 */
const SHAPE_OF = {
  grunt: 'grunt', swarm: 'swarm', sprint: 'sprint', brute: 'brute',
  charger: 'charger', caster: 'caster', splitter: 'splitter', shield: 'shield',
  bomber: 'bomber', summoner: 'summoner', elite: 'brute',
};

const ART = {
  grunt:   { e:'#e0607e', d:'#1c0a0e', m:'#37181f', l:'#572b35' },
  swarm:   { e:'#e05e9a', d:'#1c0a12', m:'#371826', l:'#572b3f' },
  sprint:  { e:'#f0a34a', d:'#1c140a', m:'#372918', l:'#57432b' },
  brute:   { e:'#8b6ce0', d:'#0f0a1c', m:'#201837', l:'#372b57' },
  charger: { e:'#ff8a5c', d:'#1c0f0a', m:'#372118', l:'#57372b' },
  caster:  { e:'#6ea8ff', d:'#0a111c', m:'#182437', l:'#2b3d57' },
  splitter:{ e:'#59d98a', d:'#0a1c11', m:'#183724', l:'#2b573c' },
  shield:  { e:'#a9b6d6', d:'#0a0f1c', m:'#182137', l:'#2b3857' },
  bomber:  { e:'#ff5d5d', d:'#1c0a0a', m:'#371818', l:'#572b2b' },
  summoner:{ e:'#c37bff', d:'#140a1c', m:'#291837', l:'#432b57' },
};

/* ---- 绘制件 ---- */

/* 0.38.0 受击闪白开关：>0 时，每个部件用自己的轮廓再填一层白。
   以前白闪是「source-atop + fillRect 一个矩形」，而背景每帧都被不透明底色铺满，
   source-atop 会连背景一起染白 —— 于是暴击 BOSS 时能看到一个方块。 */
let ART_FLASH = 0;

function mixHex(a, b, t) {
  const pa = a.replace('#', ''), pb = b.replace('#', '');
  const r = Math.round(parseInt(pa.slice(0,2),16) + (parseInt(pb.slice(0,2),16) - parseInt(pa.slice(0,2),16)) * t);
  const g = Math.round(parseInt(pa.slice(2,4),16) + (parseInt(pb.slice(2,4),16) - parseInt(pa.slice(2,4),16)) * t);
  const bl = Math.round(parseInt(pa.slice(4,6),16) + (parseInt(pb.slice(4,6),16) - parseInt(pa.slice(4,6),16)) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

function artPainter(fn, p, x, y, r, lw) {
  ctx.beginPath(); fn();
  /* 身体只用中间调→暗部，亮面留给边缘光，否则整块会发亮变糖果色 */
  const g = ctx.createLinearGradient(x - r * .38, y - r * 1.05, x + r * .26, y + r * 1.05);
  g.addColorStop(0, p.m); g.addColorStop(.45, p.m); g.addColorStop(1, p.d);
  ctx.fillStyle = g; ctx.fill();

  ctx.lineWidth = lw || 1.8; ctx.strokeStyle = 'rgba(4,4,8,.85)'; ctx.stroke();

  /* 边缘光：沿轮廓描一条细亮线。
     0.37.0 性能改动：原来是「clip 到形状内 + r*0.26 粗描边」，靠裁剪只留内侧那半。
     clip 是 Canvas2D 里最贵的操作之一，而 150 只怪同屏时每帧要 clip 近 300 次。
     改成不裁剪的细描边（一半压在外侧，视觉上同样是轮廓光），
     实测 clip 归零，而所有尺寸的轮廓光都还在——自爆者这类小体积危险怪不能被削暗。
     同时删掉原来的第 3 次 0.9px 元素色细边：肉眼不可见，纯浪费一次 stroke。 */
  ctx.beginPath(); fn();
  ctx.lineWidth = Math.min(r * .12, 2.6);
  ctx.strokeStyle = hexA(p.e, .42);
  ctx.stroke();

  /* 受击闪白：贴这个部件自己的 path 再填一层，形状严丝合缝 */
  if (ART_FLASH > 0) {
    ctx.beginPath(); fn();
    ctx.fillStyle = 'rgba(255,255,255,' + ART_FLASH + ')';
    ctx.fill();
  }
}

function artShadow(x, y, r, a) {
  ctx.save();
  ctx.translate(x, y + r * .94); ctx.scale(1, .28);
  const al = a === undefined ? .60 : a;
  /* 0.37.0 性能：小怪的影子用一个纯色椭圆就够（40px 以下看不出渐变边缘），
     BOSS/精英（r>=26）保留渐变，那是它们的体积感来源 */
  if (r >= 26) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * .95);
    g.addColorStop(0, 'rgba(0,0,0,' + al + ')');
    g.addColorStop(.6, 'rgba(0,0,0,' + (al * .4) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * .95, 0, RAD); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(0,0,0,' + (al * .55) + ')';
    ctx.beginPath(); ctx.arc(0, 0, r * .80, 0, RAD); ctx.fill();
  }
  ctx.restore();
}

function artLimb(x1, y1, x2, y2, w, p) {
  const g = ctx.createLinearGradient(x1, y1 - w, x2, y2 + w);
  g.addColorStop(0, p.l); g.addColorStop(.5, p.m); g.addColorStop(1, p.d);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = 'rgba(4,4,8,.85)'; ctx.lineWidth = w + 2.6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = g; ctx.lineWidth = w; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = hexA(p.e, .36); ctx.lineWidth = 1; ctx.stroke();
  if (ART_FLASH > 0) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = 'rgba(255,255,255,' + ART_FLASH + ')';
    ctx.lineWidth = w; ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function artShell(x, y, r, rot, len, col, a) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  ctx.ellipse(0, 0, r * len, r * .34, 0, Math.PI * 1.05, Math.PI * 1.72);
  ctx.strokeStyle = hexA(col, a || .5);
  ctx.lineWidth = r * .052; ctx.lineCap = 'round'; ctx.stroke();
  ctx.lineCap = 'butt'; ctx.restore();
}

function artEye(x, y, r, core, gl) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * (gl || 6));
  g.addColorStop(0, hexA(core, .92));
  g.addColorStop(.22, hexA(core, .34));
  g.addColorStop(1, hexA(core, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * (gl || 6), 0, RAD); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, RAD);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r * .60, 0, RAD);
  ctx.fillStyle = core; ctx.fill();
}

/* ---- 10 个形体（正视，+X 为前方） ---- */
const DRAW_ENEMY = {

  /* 步兵：甲虫 */
  grunt(x, y, r) {
    const p = ART.grunt;
    artShadow(x, y, r);
    artLimb(x - r*.55, y + r*.30, x - r*.74, y + r*.90, r*.15, p);
    artLimb(x - r*.10, y + r*.44, x - r*.10, y + r*.98, r*.16, p);
    artLimb(x + r*.42, y + r*.38, x + r*.54, y + r*.92, r*.15, p);

    artPainter(() => {
      ctx.moveTo(x + r*.72, y + r*.30);
      ctx.quadraticCurveTo(x + r*.55, y - r*.85, x - r*.35, y - r*.80);
      ctx.quadraticCurveTo(x - r*.92, y - r*.72, x - r*.92, y + r*.05);
      ctx.quadraticCurveTo(x - r*.90, y + r*.42, x - r*.60, y + r*.46);
      ctx.lineTo(x + r*.62, y + r*.44);
      ctx.quadraticCurveTo(x + r*.80, y + r*.42, x + r*.72, y + r*.30);
      ctx.closePath();
    }, p, x, y, r, 2);

    ctx.beginPath();
    ctx.moveTo(x - r*.42, y - r*.74); ctx.quadraticCurveTo(x - r*.30, y - r*.18, x - r*.40, y + r*.40);
    ctx.moveTo(x + r*.06, y - r*.80); ctx.quadraticCurveTo(x + r*.16, y - r*.20, x + r*.10, y + r*.42);
    ctx.strokeStyle = 'rgba(4,4,8,.5)'; ctx.lineWidth = 1.8; ctx.stroke();

    artShell(x + r*.02, y - r*.28, r, -.55, .78, p.e, .55);

    artPainter(() => {
      ctx.moveTo(x + r*.70, y + r*.28);
      ctx.quadraticCurveTo(x + r*1.02, y + r*.18, x + r*1.00, y - r*.06);
      ctx.quadraticCurveTo(x + r*.96, y - r*.26, x + r*.66, y - r*.20);
      ctx.closePath();
    }, p, x, y, r, 1.8);
    artEye(x + r*.88, y + r*.02, r*.10, p.e, 6);
  },

  /* 虫群：飞虫 */
  swarm(x, y, r) {
    const p = ART.swarm;
    artShadow(x, y, r, .35);
    artLimb(x - r*.20, y + r*.10, x - r*.74, y + r*.56, r*.085, p);
    artLimb(x + r*.05, y + r*.16, x + r*.52, y + r*.62, r*.085, p);
    artLimb(x - r*.30, y + r*.05, x - r*.96, y + r*.20, r*.075, p);

    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x - r*.10, y - r*.10);
      ctx.quadraticCurveTo(x - r*.38, y + s * r*.78, x + r*.32, y + s * r*.52);
      ctx.quadraticCurveTo(x + r*.36, y + s * r*.10, x - r*.10, y - r*.10);
      ctx.closePath();
      const wg = ctx.createLinearGradient(x, y, x + r*.3, y + s * r*.6);
      wg.addColorStop(0, hexA(p.e, .32)); wg.addColorStop(1, hexA(p.e, .05));
      ctx.fillStyle = wg; ctx.fill();
      ctx.strokeStyle = hexA(p.e, .5); ctx.lineWidth = 1; ctx.stroke();
    }

    artPainter(() => {
      ctx.moveTo(x + r*.95, y + r*.05);
      ctx.quadraticCurveTo(x + r*.30, y - r*.34, x - r*.58, y - r*.20);
      ctx.quadraticCurveTo(x - r*.80, y, x - r*.58, y + r*.20);
      ctx.quadraticCurveTo(x + r*.30, y + r*.34, x + r*.95, y + r*.05);
      ctx.closePath();
    }, p, x, y, r, 1.6);

    artLimb(x + r*.90, y - r*.02, x + r*1.30, y - r*.34, 1, p);
    artLimb(x + r*.88, y + r*.06, x + r*1.28, y + r*.30, 1, p);
    artEye(x + r*.62, y, r*.09, p.e, 5.5);
