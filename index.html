    if (def.shape === 'twin') {
      const half = hpTotal;
      for (let k = 0; k < 2; k++) {
        const a2 = ang + (k ? .34 : -.34);
        const p2 = spawnPos(a2);
        const e = makeBoss(c, i, 2, p2, half);
        e.bossName = (c.name || def.name) + (k ? '·右瞳' : '·左瞳');
        e.twinPart = k;
        e.group = group;
        created.push(e);
      }
      created[created.length - 2].twin = created[created.length - 1];
      created[created.length - 1].twin = created[created.length - 2];
    } else {
      const e = makeBoss(c, i, n, pos, hpTotal);
      e.group = group;
      created.push(e);
    }
  }

  /* 同族成员（炎兽左/右）绑到同一个血池上：一起掉血、一起进阶段 */
  const byPack = {};
  for (const e of created) {
    const pid = e.def && e.def.pack;
    if (!pid) continue;
    (byPack[pid] = byPack[pid] || []).push(e);
  }
  for (const pid in byPack) {
    if (byPack[pid].length >= 2) {
      bindPack(pid, byPack[pid]);
      /* 同族算一个 BOSS 名额：狂潮上限数的是「组」，别让双子把名额吃成两个 */
      const g = byPack[pid][0].group;
      for (const e of byPack[pid]) e.group = g;
    }
  }

  for (const e of created) {
    S.enemies.push(e);
    S.bosses.push(e);
  }
  const names = created.map(b => b.bossName).filter((v, i, a) => a.indexOf(v) === i);
  announce(created.length > 1 ? '多 BOSS 来袭' : 'BOSS 来袭',
    names.join(' + ') + ' · 每个都有自己的招式',
    created[0].color, true);
  SFX.alarm();
}

function nearestEnemy(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (const e of S.enemies) {
    if (e.hp <= 0) continue;
    const d = d2(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function nearestUnhit(x, y, maxD, set) {
  let best = null, bd = maxD * maxD;
  for (const e of S.enemies) {
    if (e.hp <= 0 || set.has(e)) continue;
    const d = d2(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

/* ---------- 开火 ---------- */
function fireWeapon(w, s, target) {
  const p = S.player;
  const base = target ? Math.atan2(target.y - p.y, target.x - p.x) : -Math.PI / 2;
  const dmg = s.dmg * S.st.dmgMul;
  const spd = s.speed * S.st.bsMul;
  const col = s.hot ? '#ff7a3d' : WEAPONS[w.id].color;

  if (w.id === 'rifle' || w.id === 'shotgun') {
    const cnt = s.count;
    const step = cnt > 1 ? s.spread / (cnt - 1) : 0;
    for (let i = 0; i < cnt; i++) {
      const a = base + (i - (cnt - 1) / 2) * step;
      const life = w.id === 'shotgun' ? s.range / spd : 1.3;
      spawnBullet(a, spd, dmg, s.pierce || 0, life, col, s.size, false, 0, !!s.hot);
    }
  } else if (w.id === 'flame') {
    const cnt = s.count;
    const step = cnt > 1 ? s.spread / (cnt - 1) : 0;
    for (let i = 0; i < cnt; i++) {
      const a = base + (i - (cnt - 1) / 2) * step + rnd(-.05, .05);
      spawnBullet(a, spd * rnd(.9, 1.1), dmg, s.pierce, s.range / spd, i % 2 ? '#ff7a3d' : '#ffb36b', s.size * rnd(.8, 1.2), false, 0, true);
    }
    for (let k = 0; k < 3; k++) addPart(p.x + Math.cos(base) * 16, p.y + Math.sin(base) * 16, '#ffb36b', rnd(60, 160), 3);
  } else if (w.id === 'boom') {
    const cnt = s.count;
    const step = cnt > 1 ? s.spread / (cnt - 1) : 0;
    for (let i = 0; i < cnt; i++) {
      const a = base + (i - (cnt - 1) / 2) * step;
      spawnBullet(a, spd, dmg, 99, 3.2, WEAPONS.boom.color, s.size, false, 0, false);
      const b = S.bullets[S.bullets.length - 1];
      b.boom = true; b.back = false; b.fly = 0; b.outTime = .5; b.rot = 0; b.lastClear = 0;
    }
  } else if (w.id === 'laser') {
    for (let i = 0; i < s.count; i++) {
      const off = s.count > 1 ? (i - (s.count - 1) / 2) * s.off : 0;
      spawnBullet(base, spd, dmg, 99, 1.1, WEAPONS.laser.color, s.width / 2, true, off);
    }
  } else if (w.id === 'shard') {
    const cnt = s.count;
    const step = cnt > 1 ? s.spread / (cnt - 1) : 0;
    for (let i = 0; i < cnt; i++) {
      const a = base + (i - (cnt - 1) / 2) * step;
      spawnBullet(a, spd, dmg, s.pierce, 1.3, WEAPONS.shard.color, s.size, false, 0, false);
      S.bullets[S.bullets.length - 1].chill = s.chill;
    }
  } else if (w.id === 'fan') {
    const cnt = s.count;
    const step = cnt > 1 ? s.spread / (cnt - 1) : 0;
    for (let i = 0; i < cnt; i++) {
      const a = base + (i - (cnt - 1) / 2) * step + rnd(-.04, .04);
      spawnBullet(a, spd, dmg, s.pierce, 1.2, WEAPONS.fan.color, s.size, false, 0, false);
      S.bullets[S.bullets.length - 1].critB = s.critB;
    }
  } else if (w.id === 'arcane') {
    const cnt = s.count;
    const step = cnt > 1 ? .5 / (cnt - 1) : 0;
    for (let i = 0; i < cnt; i++) {
      const a = base + (i - (cnt - 1) / 2) * step + rnd(-.1, .1);
      spawnBullet(a, spd, dmg, 0, 2.6, WEAPONS.arcane.color, s.size, false, 0, false);
      S.bullets[S.bullets.length - 1].hom = s.turn;
    }
  } else if (w.id === 'tide') {
    const cnt = s.count;
    const step = cnt > 1 ? .7 / (cnt - 1) : 0;
    for (let i = 0; i < cnt; i++) {
      const a = base + (i - (cnt - 1) / 2) * step + rnd(-.12, .12);
      spawnBullet(a, spd, dmg, 0, 6, WEAPONS.tide.color, 9, false, 0, false);
      const b = S.bullets[S.bullets.length - 1];
      b.mine = true; b.blast = s.blast; b.chill = s.chill; b.born = S.t;
    }
  } else if (w.id === 'thunder') {
    /* 天雷：从视野内的敌人里随机挑落点，一道道劈下来 */
    const p2 = S.player;
    const pool = S.enemies.filter(e => e.hp > 0 && Math.hypot(e.x - p2.x, e.y - p2.y) < aimRange());
    for (let i = 0; i < s.count; i++) {
      const tg = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
      const sx = tg ? tg.x : p2.x + rnd(-220, 220);
      const sy = tg ? tg.y : p2.y + rnd(-220, 220);
      thunderStrike(sx, sy, s.blast, dmg);
    }
  } else if (w.id === 'meteor') {
    if (!S.meteors) S.meteors = [];
    const p2 = S.player;
    const tg = nearestEnemy(p2.x, p2.y, aimRange());
    const cx = tg ? tg.x : p2.x + rnd(-200, 200);
    const cy = tg ? tg.y : p2.y + rnd(-200, 200);
    for (let i = 0; i < s.count; i++) {
      S.meteors.push({ x: cx + rnd(-90, 90), y: cy + rnd(-90, 90), t: .5 + i * .16, max: .5 + i * .16,
        dmg: dmg, r: s.blast, burn: s.burn });
    }
    SFX.alarm();
  } else if (w.id === 'giant') {
    /* 巨剑：以玩家为圆心的扇形即时判定 + 击退 + 刀光 */
    const p2 = S.player;
    const a0 = (p2.ax || p2.ay) ? Math.atan2(p2.ay, p2.ax) : base;
    let hitAny = 0;
    for (const e of S.enemies) {
      if (e.hp <= 0) continue;
      const dd = Math.hypot(e.x - p2.x, e.y - p2.y);
      if (dd > s.range + hiveHitR(e)) continue;
      let da = Math.abs(Math.atan2(e.y - p2.y, e.x - p2.x) - a0);
      if (da > Math.PI) da = RAD - da;
      if (da > s.arc / 2) continue;
      hitEnemy(e, dmg, WEAPONS.giant.color, p2.x, p2.y);
      const nx = (e.x - p2.x) / (dd || 1), ny = (e.y - p2.y) / (dd || 1);
      e.x += nx * s.knock * .16; e.y += ny * s.knock * .16;
      hitAny++;
    }
    if (!S.slashes) S.slashes = [];
    S.slashes.push({ x: p2.x, y: p2.y, a: a0, arc: s.arc, range: s.range, life: .2, max: .2, col: WEAPONS.giant.color });
    if (hitAny) { S.shake = Math.min(11, S.shake + 3); SFX.kill(); }
  }
  SFX.shoot();
}

/* 范围伤害：圆内所有敌人结算一次 */
function aoeDamage(x, y, r, dmg, col, chill, sx, sy) {
  let n = 0;
  for (const e of S.enemies) {
    if (e.hp <= 0) continue;
    const dd = Math.hypot(e.x - x, e.y - y);
    if (dd < r + hiveHitR(e)) {
      hitEnemy(e, dmg, col, sx === undefined ? x : sx, sy === undefined ? y : sy);
      if (chill) e.slowT = Math.max(e.slowT || 0, chill);
      n++;
    }
  }
  return n;
}

/* 水雷爆炸 */
function explodeMine(b) {
  addRing(b.x, b.y, b.color, 10, b.blast * 2.6, .3);
  addRing(b.x, b.y, '#ffffff', 4, b.blast * 1.4, .16);
  for (let k = 0; k < 9; k++) addPart(b.x, b.y, k % 2 ? b.color : '#cfeaff', rnd(60, 220), 3);
  aoeDamage(b.x, b.y, b.blast, b.dmg, b.color, b.chill);
  SFX.block();
}

/* 天雷劈落 */
function thunderStrike(x, y, r, dmg) {
  aoeDamage(x, y, r, dmg, '#ffe95a');
  addRing(x, y, '#ffe95a', 9, r * 3.2, .3);
  addRing(x, y, '#ffffff', 4, r * 1.6, .15);
  for (let k = 0; k < 7; k++) addPart(x, y, k % 2 ? '#ffe95a' : '#fff8c8', rnd(80, 260), 3);
  if (S.bolts.length > 26) S.bolts.shift();
  S.bolts.push({ pts: [{ x: x, y: y - 540 }, { x: x, y: y }], life: .24, max: .24, color: '#ffe95a' });
  S.shake = Math.min(12, S.shake + 3);
  SFX.zap();
}

function fireChain(s, target) {
  const p = S.player;
  const pts = [{ x: p.x, y: p.y }];
  const hit = new Set();
  let cur = target, dmg = s.dmg * S.st.dmgMul;
  const col = WEAPONS.chain.color;
  for (let i = 0; i < s.chains && cur; i++) {
    hit.add(cur);
    pts.push({ x: cur.x, y: cur.y });
    hitEnemy(cur, dmg, col);
    for (let k = 0; k < 4; k++) addPart(cur.x, cur.y, col, rnd(70, 220), 2);
    dmg *= .88;
    cur = nearestUnhit(cur.x, cur.y, s.range, hit);
  }
  if (pts.length > 1) {
    if (S.bolts.length > 26) S.bolts.shift();
    S.bolts.push({ pts, life: .22, max: .22, color: col });
    SFX.zap();
  }
}

function updateWeapons(dt) {
  const p = S.player;

  /* ---- 环绕光球 ---- */
  const orbW = S.weapons.find(w => w.id === 'orbit');
  S.orbs.length = 0;
  if (orbW) {
    const s = WEAPONS.orbit.levels[orbW.lv - 1];
    const a0 = S.t * s.rot;
    for (let i = 0; i < s.count; i++) {
      const a = a0 + i * (RAD / s.count);
      const ox = p.x + Math.cos(a) * s.radius;
      const oy = p.y + Math.sin(a) * s.radius;
      S.orbs.push({ x: ox, y: oy, r: s.orbR, a: a, slow: s.slow });
      for (const e of S.enemies) {
        if (e.hp <= 0) continue;
        if (S.t - e.lastOrb < .28) continue;
        const rr = s.orbR + e.r;
        if (d2(ox, oy, e.x, e.y) < rr * rr) {
          hitEnemy(e, s.dmg * S.st.dmgMul, WEAPONS.orbit.color);
          e.lastOrb = S.t;
          e.slowT = s.slow ? .9 : 0;
          for (let k = 0; k < 4; k++) addPart(ox, oy, WEAPONS.orbit.color, rnd(50, 170), 2);
        }
      }
    }
  }

  /* ---- 哨戒无人机：绕身旋转，各自独立索敌开火 ---- */
  const dw = S.weapons.find(w => w.id === 'drone');
  if (!S.drones) S.drones = [];
  if (!dw) { S.drones.length = 0; }
  else {
    const s = WEAPONS.drone.levels[dw.lv - 1];
    const n = s.count;
    if (S.drones.length !== n) {
      S.drones.length = 0;
      for (let i = 0; i < n; i++) S.drones.push({ cd: Math.random() * .35, a: i / n * RAD, x: p.x, y: p.y });
    }
    for (let i = 0; i < n; i++) {
      const d = S.drones[i];
      d.a = S.t * .85 + i * (RAD / n);
      d.x = p.x + Math.cos(d.a) * 66;
      d.y = p.y + Math.sin(d.a) * 66;
      d.cd -= dt;
      if (d.cd > 0) continue;
      const tg = nearestEnemy(d.x, d.y, s.range);
      if (tg) {
        const ang = Math.atan2(tg.y - d.y, tg.x - d.x);
        spawnBulletAt(d.x, d.y, ang, s.speed, s.dmg * S.st.dmgMul, 0, .95, WEAPONS.drone.color, s.size, false, 0, false);
        d.cd = s.cd * S.st.cdMul;
      } else d.cd = .14;
    }
  }

  /* ---- 爆裂新星：周期性从身上炸开冲击环 ---- */
  const nw = S.weapons.find(w => w.id === 'nova');
  if (nw) {
    if (nw.timer === undefined) nw.timer = .6;
    nw.timer -= dt;
    if (nw.timer <= 0) {
      const s = WEAPONS.nova.levels[nw.lv - 1];
      nw.timer = s.cd * S.st.cdMul;
      addRing(p.x, p.y, '#ff9ec2', 14, s.radius * 3.0, .34);
      addRing(p.x, p.y, '#ffffff', 8, s.radius * 2.2, .2);
      S.shake = Math.min(12, S.shake + 4);
      for (const e of S.enemies) {
        if (e.hp <= 0) continue;
        const dd = Math.hypot(e.x - p.x, e.y - p.y);
        if (dd < s.radius + hiveHitR(e)) {
          hitEnemy(e, s.dmg * S.st.dmgMul, '#ff9ec2', p.x, p.y);
          const nx = (e.x - p.x) / (dd || 1), ny = (e.y - p.y) / (dd || 1);
          e.x += nx * s.knock * .18;
          e.y += ny * s.knock * .18;
        }
      }
      for (let k = 0; k < 10; k++) addPart(p.x, p.y, '#ff9ec2', rnd(120, 320), 3);
      SFX.block();
    }
  }

  /* ---- 守护壁垒：周期展开金色护罩，清弹幕 + 反伤磨血 ---- */
  const aw = S.weapons.find(w => w.id === 'aegis');
  if (!S.aura) S.aura = { on: 0, timer: 2, tick: 0 };
  if (!aw) S.aura.on = 0;
  else {
    const s = WEAPONS.aegis.levels[aw.lv - 1];
    if (S.aura.on > 0) {
      S.aura.on -= dt;
      /* 罩内敌方弹幕直接湮灭 */
      for (let i = S.ebullets.length - 1; i >= 0; i--) {
        const b = S.ebullets[i];
        if (d2(b.x, b.y, p.x, p.y) < s.radius * s.radius) {
          for (let k = 0; k < 2; k++) addPart(b.x, b.y, '#ffd24a', rnd(40, 120), 2);
          S.ebullets.splice(i, 1);
        }
      }
      /* 罩内敌人持续受伤 */
      S.aura.tick -= dt;
      if (S.aura.tick <= 0) {
        S.aura.tick = .3;
        for (const e of S.enemies) {
          if (e.hp <= 0) continue;
          if (Math.hypot(e.x - p.x, e.y - p.y) < s.radius + hiveHitR(e)) hitEnemy(e, s.dmg * S.st.dmgMul, WEAPONS.aegis.color, p.x, p.y);
        }
      }
    }
    S.aura.timer -= dt;
    if (S.aura.timer <= 0) {
      S.aura.timer = s.cd * S.st.cdMul;
      S.aura.on = s.dur;
      S.aura.tick = 0;
      addRing(p.x, p.y, '#ffd24a', 12, s.radius * 2.6, .32);
      SFX.block();
    }
  }

  for (const w of S.weapons) {
    if (w.id === 'orbit' || w.id === 'drone' || w.id === 'nova' || w.id === 'aegis') continue;
    if (w.timer === undefined) w.timer = 0;
    w.timer -= dt;
    if (w.timer > 0) continue;
    const s = WEAPONS[w.id].levels[w.lv - 1];
    /* 索敌上限跟随视野：屏幕上看不见的怪打不到，避免隔屏击杀 */
    const target = nearestEnemy(p.x, p.y, Math.max(360, aimRange()));
    if (!target) { w.timer = .1; continue; }
    if (w.id === 'chain') fireChain(s, target);
    else fireWeapon(w, s, target);
    w.timer = s.cd * S.st.cdMul;
  }
}

/* ---------- 玩家受伤 / 经验 ---------- */
function damagePlayer(d, sx, sy) {
  const p = S.player;
  if (ARENA.on && ARENA.god) return;            /* 测试场地：无敌 */
  if (p.inv > 0 || S.mode !== 'play') return;
  p.hp -= d * (1 - (S.st.armor || 0));
  p.inv = .55;
  S.shake = Math.min(16, S.shake + 9);
  S.hurtFlash = 1;
  if (sx !== undefined) S.hurtDir = Math.atan2(sy - p.y, sx - p.x);
  SFX.hurt();
  for (let i = 0; i < 12; i++) addPart(p.x, p.y, '#ff6b7a', rnd(80, 260), 3);
  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}

function gainXP(v) {
  if (ARENA.on) return;      /* 测试场地：不吃经验，别弹升级面板打断试招 */
  S.xp += v * (S.xpMul || 1);
  while (S.xp >= S.xpNeed) {
    S.xp -= S.xpNeed;
    S.level++;
    S.xpNeed = Math.floor(S.xpNeed * 1.16 + 1);
    S.pendingLevels++;
  }
}

/* ---------- 敌人 AI ---------- */
/* 敌弹：opt 里可以带形状、追踪、重力、正弦飞行、落点效果
   kind: orb 圆弹 / fire 火球 / ice 冰锥 / spore 孢囊 / void 虚空球 / rock 落石 */
function shootEnemyBullet(e, p, ang, spd, dmg, opt) {
  const cap = SET.mobile ? 210 : 300;
  if (S.ebullets.length > cap) return null;
  const o = opt || {};
  const ox = o.ox !== undefined ? o.ox : e.x;
  const oy = o.oy !== undefined ? o.oy : e.y;
  const a = ang !== undefined ? ang : Math.atan2(p.y - oy, p.x - ox);
  const v0 = spd || 215;
  const v = v0 * kDev('spd');          /* 调试台：弹速倍率 */
  const tnB = tuneOf(S.curMv);
  const b = {
    x: ox + Math.cos(a) * (o.off !== undefined ? o.off : (e.r + 4)),
    y: oy + Math.sin(a) * (o.off !== undefined ? o.off : (e.r + 4)),
    vx: Math.cos(a) * v, vy: Math.sin(a) * v,
    r: (o.r || 6) * kDev('size') * tnB.size,
    dmg: (dmg || (e.type === 'boss' ? 12 : 8)) * kDev('dmg') * tnB.dmg,
    life: o.life || 4.5, color: o.color || '#ff6b8a',
    kind: o.kind || 'orb', homing: o.homing || 0, grow: o.grow || 0,
    wave: o.wave || 0, amp: o.amp || 0, ang0: a, spin: o.spin || 0,
    gravity: o.gravity || 0, onEnd: o.onEnd || null,
    chillP: o.chillP || 0,
    y0: oy, born: S.t, hitOnce: false,
  };
  S.ebullets.push(b);
  SFX.eshot();
  return b;
}

/* ---------- 地面危险区（火池 / 冰墙 / 毒潭 / 冲击环） ---------- */
function addHazard(kind, x, y, opt) {
  const o = opt || {};
  /* 调试台（0.34.0）：出口统一乘倍率 —— 全局 × 当前招式，招式函数一个字不用改 */
  const tn = tuneOf(S.curMv);
  const kW = kDev('warn') * tn.warm;
  const kD = kDev('dmg') * tn.dmg;
  const kZ = kDev('size') * tn.size;
  const h = {
    kind: kind, x: x, y: y,
    r: (o.r || 70) * kZ, w: (o.w || 0) * kZ, h: (o.h || 0) * kZ, rot: o.rot || 0,
    max: o.life || 1, life: o.life || 1,
    warm: (o.warm || 0) * kW, dps: (o.dps || 16) * kD,
    color: o.color || '#ff7a3d', tick: 0, born: S.t,
    spin: o.spin || 0, grow: o.grow || 0, thick: (o.thick || 26) * kZ,
    n: o.n || 0,          /* 0.43.0 旋转刮刀：一把 hazard 带 n 把刀 */
    follow: o.follow || null,   /* 凝视跟本体走（0.41.0 永夜之轮用） */
    /* 冲击环专用：缺口中心角 / 缺口半宽 / 最大半径（到了就散） */
    gapA: o.gapA === undefined ? 0 : o.gapA,
    gapW: o.gapW || 0,
    maxR: (o.maxR || 0) * kZ,
    /* 地爆天星专用：初始半径 / 终径 / 聚形时长 / 爆炸伤害 */
    r0: (o.r0 || 0) * kZ, r1: (o.r1 || 0) * kZ, T: o.T || 1, boomDmg: (o.boomDmg || 0) * kD,
  };
  if (S.hazards.length > 26) S.hazards.shift();
  S.hazards.push(h);
  return h;
}

/* 点是否落在危险区内 */
function inHazard(h, px, py) {
  const dx = px - h.x, dy = py - h.y;
  if (h.kind === 'ring') {
    const d = Math.hypot(dx, dy);
    if (Math.abs(d - h.r) >= h.thick * .5 + 8) return false;
    /* 缺口：环被切开一段，站在缺口对应的角度里不会被扫到 */
    if (h.gapW > 0) {
      let da = Math.atan2(dy, dx) - h.gapA;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < h.gapW) return false;
    }
    return true;
  }
  /* 0.43.0 旋转刮刀：n 把刀绕本体转，判径向落在刀长内、切向落在刀厚内 */
  if (h.kind === 'blades') {
    const n = h.n || 1, dx = px - h.x, dy = py - h.y;
    for (let i = 0; i < n; i++) {
      const a = h.rot + i * RAD / n, ca = Math.cos(a), sa = Math.sin(a);
      const lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
      if (lx > h.r - h.w * .5 - 6 && lx < h.r + h.w * .5 + 6 &&
          Math.abs(ly) < h.h * .5 + 6) return true;
    }
    return false;
  }
  /* 虚空凝视：扇形视线（w=长度，h=张角），被扫到才掉血 */
  if (h.kind === 'gaze') {
    const dd = Math.hypot(dx, dy);
    if (dd > h.w) return false;
    let da = Math.atan2(dy, dx) - h.rot;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    return Math.abs(da) < h.h * .5;
  }
  if (h.w > 0) {
    /* 旋转矩形 */
    const c = Math.cos(-h.rot), s = Math.sin(-h.rot);
    const lx = dx * c - dy * s, ly = dx * s + dy * c;
    return Math.abs(lx) < h.w * .5 + 6 && Math.abs(ly) < h.h * .5 + 6;
  }
  return dx * dx + dy * dy < (h.r + 6) * (h.r + 6);
}

/* 环境伤害：绕开无敌帧，但 0.4 秒只结算一次，站在火里会持续掉血 */
function damagePlayerEnv(d, sx, sy) {
  const p = S.player;
  if (ARENA.on && ARENA.god) return;            /* 测试场地：无敌（环境伤也算） */
  if (S.mode !== 'play') return;
  if (S.envCd > 0) return;
  S.envCd = .40;
  const real = d * (1 - (S.st.armor || 0));
  p.hp -= real;
  S.hurtFlash = Math.max(S.hurtFlash, .55);
  S.shake = Math.min(12, S.shake + 3);
  if (sx !== undefined) S.hurtDir = Math.atan2(sy - p.y, sx - p.x);
  addText(p.x, p.y - 22, Math.round(real), '#ff9a6a', 13, false);
  for (let i = 0; i < 5; i++) addPart(p.x, p.y, '#ff8a5c', rnd(40, 140), 2);
  if (S.envCd > .38) SFX.hurt();
  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}

/* 敌弹飞完/命中后的余韵：火球落地成火池、孢囊炸成毒潭并分裂 */
function ebulletEnd(b) {
  if (b.onEnd === 'firepool') {
    /* 只有一部分火焰会留下火池，否则地面会被糊满 */
    if (Math.random() < .5 && b.x > 10 && b.x < WORLD.w - 10 && b.y > 10 && b.y < WORLD.h - 10) {
      addHazard('fire', b.x, b.y, { r: 30, dps: 17, color: '#ff7a3d', life: 3.0, warm: .05 });
      addRing(b.x, b.y, '#ffb36b', 6, 200, .22);
    }
  } else if (b.onEnd === 'poison') {
    addHazard('poison', b.x, b.y, { r: 62, dps: 14, color: '#8ae06a', life: 5.5, warm: .1 });
    for (let k = 0; k < 6; k++) {
      shootEnemyBullet(b, S.player, k / 6 * RAD, 155, 7, { color: '#8ae06a', kind: 'spore', r: 5, life: 1.6 });
    }
    addRing(b.x, b.y, '#8ae06a', 8, 320, .3);
  }
}

/* 扇形弹缝隙分裂（0.27.0）：弹间缝随距离拉大，宽到能塞下 3 个玩家（3×直径）
   就在缝正中补一发，缝一分为二；最多裂 2 代（再裂最小缝会小于一个身位），
   远处的密度永远压在「能躲」的线上 */
function fanSplit(b) {
  if (!b.fan || b.fan.da <= 0 || b.fan.gen >= 2) return null;
  const age = S.t - b.born;
  const spd = Math.hypot(b.vx, b.vy) || 1;
  if (spd * age * b.fan.da < S.player.r * 6) return null;
  const nda = b.fan.da * .5;
  const nb = shootEnemyBullet(b, S.player, b.ang0 + nda, spd, b.dmg,
    { color: b.color, kind: b.kind, r: b.r, life: Math.max(.5, b.life), off: 0 });
  if (nb) nb.fan = { da: nda, gen: b.fan.gen + 1 };
  b.fan = { da: nda, gen: b.fan.gen + 1 };
  return nb;
}

/* =========================================================
   虚空系专用：暗雾 + 长夜（0.36.0）
   ---------------------------------------------------------
   暗雾**不伤人**，只遮视野：画在敌人与敌弹之上、玩家之下——
   于是「你在雾里看不见它、也看不见飞来的弹，但你看得见自己」。
   压迫来自「不知道」，不是「打不过」；雾里它每次出招都有音效，
   所以不是瞎死，是得靠听觉+记忆走位。
   ========================================================= */
function addShroud(x, y, r, life) {
  if (!S.shrouds) S.shrouds = [];
  if (S.shrouds.length >= 7) S.shrouds.shift();
  S.shrouds.push({
    x: x, y: y, r: r, life: life, max: life,
    a: Math.random() * RAD, spin: (Math.random() < .5 ? -1 : 1) * rnd(.25, .6),
  });
}

function updateShrouds(dt) {
  if (!S.shrouds || !S.shrouds.length) return;
  for (let i = S.shrouds.length - 1; i >= 0; i--) {
    const s2 = S.shrouds[i];
    s2.life -= dt;
    s2.a += s2.spin * dt;
    if (s2.life <= 0) S.shrouds.splice(i, 1);
  }
}

function drawShrouds() {
  if (!S.shrouds || !S.shrouds.length) return;
  for (const s2 of S.shrouds) {
    const k = Math.min(1, s2.life / .5, (s2.max - s2.life) / .35 + .2);
    const grd = ctx.createRadialGradient(s2.x, s2.y, s2.r * .12, s2.x, s2.y, s2.r);
    grd.addColorStop(0, 'rgba(7,2,17,' + (.94 * k).toFixed(3) + ')');
    grd.addColorStop(.6, 'rgba(13,5,29,' + (.85 * k).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(22,9,44,0)');
    ctx.beginPath();
    ctx.arc(s2.x, s2.y, s2.r, 0, RAD);
    ctx.fillStyle = grd;
    ctx.fill();
    /* 涡旋纹：雾在流动，不是一块死黑 */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const a0 = s2.a + i * 2.1;
      ctx.beginPath();
      ctx.arc(s2.x, s2.y, s2.r * (.42 + i * .19), a0, a0 + 1.55);
      ctx.strokeStyle = 'rgba(150,90,255,' + (.11 * k).toFixed(3) + ')';
      ctx.lineWidth = 9;
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* 长夜：全屏暗幕 + 它眼下那束缓慢摆动的锥形光。
   用 evenodd 填充「整块屏幕减去（锥形 + 玩家微光）」，所以不需要离屏画布。
   锥内不打你（updateNight 发弹会跳过锥内角度）——光里是安全区，跟着光走。 */
function updateNight(dt) {
  const n = S.night;
  if (!n) return;
  n.t += dt;
  if (n.wheel) {
    n.ang += n.wheel.spin * dt;          /* 永夜之轮：匀速转，不摆动 */
  } else {
    n.ang += Math.sin(n.t * 1.7) * dt * 1.15;
  }
  const e = n.e;
  if (e && e.hp > 0) { n.x = e.x; n.y = e.y; }
  /* 永夜之轮二段：轮转起来之后，五道虚空凝视逆着车轮反向登场 */
  if (n.wheel && !n.fired && n.t >= n.beamAt && e && e.hp > 0) {
    n.fired = true;
    for (let k = 0; k < n.wheel.n; k++) {
      addHazard('gaze', n.x, n.y, {
        w: 980, h: .44, rot: n.ang + k * RAD / n.wheel.n,
        dps: 26, color: '#e0c0ff', life: n.dur - n.beamAt + .4,
        warm: 1.1, spin: -n.wheel.spin * .85, follow: e,
      });
    }
    S.shake = Math.min(20, S.shake + 9);
    SFX.alarm();
  }
  n.next -= dt;
  if (n.next <= 0 && n.t < n.dur - .5 && e && e.hp > 0) {
    n.next = n.wheel ? .95 : .62;
    const ph = n.ph || 2;
    for (let k = 0; k < 7; k++) {
      const a = Math.random() * RAD;
      let skip;
      if (n.wheel) {
        /* 五道光轮：光缝里不打，只从暗楔子里开火 */
        const seg = RAD / n.wheel.n;
        let off = (a - n.ang) % seg;
        if (off < 0) off += seg;
        if (off > seg / 2) off -= seg;
        skip = Math.abs(off) < n.wheel.arc * .5 + .1;
      } else {
        const da = Math.atan2(Math.sin(a - n.ang), Math.cos(a - n.ang));
        skip = Math.abs(da) < n.arc * .5 + .22;   /* 光里不打：安全区 */
      }
      if (skip) continue;
      shootEnemyBullet(e, S.player, a, 250, 12 + ph * 2, { color: '#c37bff', kind: 'void', r: 7, life: 3.2 });
    }
    SFX.eshot();
  }
  if (n.t >= n.dur) S.night = null;
}

function drawNight() {
  const n = S.night;
  if (!n) return;
  const p = S.player;
  const vw = W / SET.view, vh = H / SET.view;
  const fade = Math.max(0, Math.min(1, n.t / .3, (n.dur - n.t) / .45));
  ctx.save();
  ctx.beginPath();
  ctx.rect(S.cam.x - 140, S.cam.y - 140, vw + 280, vh + 280);
  if (n.wheel) {
    /* 永夜之轮：五条光缝按等弧长挖开暗幕（不挖玩家洞，避免 evenodd 咬掉微光） */
    for (let k = 0; k < n.wheel.n; k++) {
      const a = n.ang + k * RAD / n.wheel.n;
      ctx.moveTo(n.x, n.y);
      ctx.arc(n.x, n.y, n.len, a - n.wheel.arc * .5, a + n.wheel.arc * .5, false);
      ctx.closePath();
    }
  } else {
    ctx.moveTo(n.x, n.y);
    ctx.arc(n.x, n.y, n.len, n.ang - n.arc * .5, n.ang + n.arc * .5, false);
    ctx.closePath();
    ctx.moveTo(p.x + 92, p.y);
    ctx.arc(p.x, p.y, 92, 0, RAD, false);
    ctx.closePath();
  }
  ctx.fillStyle = 'rgba(3,1,9,' + (.968 * fade).toFixed(3) + ')';
  ctx.fill('evenodd');
  ctx.globalCompositeOperation = 'lighter';
  if (!n.wheel) {
    /* 单锥：锥形边与内部微光：告诉玩家光扫到哪、自己该往哪站 */
    ctx.beginPath();
    ctx.moveTo(n.x, n.y);
    ctx.arc(n.x, n.y, n.len, n.ang - n.arc * .5, n.ang + n.arc * .5, false);
    ctx.closePath();
    const grd = ctx.createRadialGradient(n.x, n.y, 16, n.x, n.y, n.len);
    grd.addColorStop(0, 'rgba(195,123,255,' + (.17 * fade).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(195,123,255,0)');
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = 'rgba(228,196,255,' + (.45 * fade).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
  } else {
    /* 车轮：五条光缝的微光与描边；玩家微光单独叠一层 */
    for (let k = 0; k < n.wheel.n; k++) {
      const a = n.ang + k * RAD / n.wheel.n;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.arc(n.x, n.y, n.len, a - n.wheel.arc * .5, a + n.wheel.arc * .5, false);
      ctx.closePath();
      const grd = ctx.createRadialGradient(n.x, n.y, 16, n.x, n.y, n.len);
      grd.addColorStop(0, 'rgba(195,123,255,' + (.13 * fade).toFixed(3) + ')');
      grd.addColorStop(1, 'rgba(195,123,255,0)');
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.strokeStyle = 'rgba(228,196,255,' + (.38 * fade).toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    const pg = ctx.createRadialGradient(p.x, p.y, 6, p.x, p.y, 92);
    pg.addColorStop(0, 'rgba(255,244,214,' + (.13 * fade).toFixed(3) + ')');
    pg.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(p.x, p.y, 92, 0, RAD); ctx.fill();
  }
  ctx.restore();
}

/* 正在打的 BOSS：离玩家最近且活着的那个（血条/锁定用，0.30.0 抽出来方便测试） */
function bossFocus() {
  const list = (S.bosses || []).filter(b => b.hp > 0);
  if (!list.length) return null;
  let focus = list[0], fd = Infinity;
  for (const b of list) {
    const dd = (b.x - S.player.x) * (b.x - S.player.x) + (b.y - S.player.y) * (b.y - S.player.y);
    if (dd < fd) { fd = dd; focus = b; }
  }
  /* 同族（双子）算一个目标：血条显示族名 + 还剩几个体，而不是顶着两条一样的血条 */
  const seen = {};
  let n = 0;
  for (const b of list) {
    const key = (b.pack && PACKS[b.pack]) ? ('p:' + b.pack) : ('e:' + list.indexOf(b));
    if (seen[key]) continue;
    seen[key] = 1; n++;
  }
  const packed = focus.pack && PACKS[focus.pack] ? PACKS[focus.pack] : null;
  const bodies = packed ? list.filter(b => b.pack === focus.pack).length : 1;
  return { b: focus, n: n, packName: packed ? packed.name : null, bodies: bodies };
}

function updateHazards(dt) {
  const p = S.player;
  if (S.envCd > 0) S.envCd -= dt;
  S.pLift = 0;   /* 沙暴每帧重新挂牌：有沙暴在场才悬空 */
  for (let i = S.hazards.length - 1; i >= 0; i--) {
    const h = S.hazards[i];

    /* 地震带：整条波列一个对象。每一圈独立算相位，
       只有「正在上刺」的那一瞬、且玩家站在这条带上才会受伤。 */
    if (h.kind === 'tide') {
      if (S.t - h.born > h.dur) { S.hazards.splice(i, 1); continue; }
      const half = h.w * .5;
      const dist = Math.hypot(p.x - h.x, p.y - h.y);
      let hit = false;
      for (let k = 0; k < h.n; k++) {
        const local = S.t - h.born - k * h.dt;
        if (local < 0 || local > h.T) continue;
        const q = local / h.T;
        /* 亮地阶段确实打到身上也不掉血，给足反应时间 */
        if (q < h.warn || q > h.warn + h.spike) continue;
        if (Math.abs(dist - (h.r0 + k * h.pitch)) <= half) { hit = true; break; }
      }
      if (hit) damagePlayerEnv(h.dps * .4, p.x, p.y);
      continue;
    }

    /* 地爆天星（0.31.0 重写）：聚形 → 整颗巨石腾空飞出去砸 → 砸地爆开
       飞的是石头本体，不发射任何炮弹；落点在起飞瞬间锁死，
       地面影子标出砸点 —— 大范围恐吓 + 逼你离开原地，但一定跑得掉 */
    if (h.kind === 'meteor') {
      h.age = (h.age || 0) + dt;
      if (h.st === 'fly') {
        h.flyT += dt;
        const kf = Math.min(1, h.flyT / h.flyDur);
        h.x = h.sx + (h.tx - h.sx) * kf;
        h.y = h.sy + (h.ty - h.sy) * kf;
        h.arc = Math.sin(Math.PI * kf);          /* 抛物线视觉高度（只影响绘制） */
        if (Math.random() < .5) addPart(h.x, h.y, '#a97b52', 70, 2);
        if (kf >= 1) {
          h.st = 'slam'; h.boom = true; h.slamAt = h.age;
          const db = Math.hypot(p.x - h.tx, p.y - h.ty);
          if (db < h.r1 + 12) damagePlayerEnv(h.boomDmg, h.tx, h.ty);
          S.shake = Math.min(22, S.shake + 16);
          S.flash = Math.max(S.flash, .5);
          S.hitStop = Math.max(S.hitStop, .12);
          addRing(h.tx, h.ty, h.color, 18, 980, .62);
          shakeDir(h.tx, h.ty, 12);
          addDecal(h.tx, h.ty, true);
          /* 0.42.0 石巨人：手搓的地爆天星落地后，以落点为中心再裂一整圈 */
          if (h.landFissure) fissureBurst(h.tx, h.ty, 8, RAD, true, 500, .45, 26, '#ffb36b');
          for (let k2 = 0; k2 < 3; k2++) {
            const a = Math.random() * RAD, dd = h.r1 + rnd(24, 80);
            addHazard('rock', h.tx + Math.cos(a) * dd, h.ty + Math.sin(a) * dd,
              { r: 42, dps: 18, color: '#a97b52', life: 2.4, warm: .1 });
          }
          SFX.alarm();
        }
        continue;
      }
      if (h.st === 'slam') {
        const da2 = Math.hypot(p.x - h.tx, p.y - h.ty);
        if (da2 < h.r1) damagePlayerEnv(h.dps * .4, h.tx, h.ty);   /* 刚砸完还烫一阵 */
        if (h.age >= h.slamAt + 1.1) S.hazards.splice(i, 1);
        continue;
      }
      /* 聚形：越滚越大；长满即起飞，落点=此刻玩家脚下 */
      const k = Math.min(1, h.age / h.T);
      h.r = h.r0 + (h.r1 - h.r0) * k * k;
      if (h.age >= h.T) {
        h.st = 'fly'; h.flyT = 0;
        h.sx = h.x; h.sy = h.y;
        h.tx = clamp(p.x, 60, WORLD.w - 60);
        h.ty = clamp(p.y, 60, WORLD.h - 60);
        const dl = Math.hypot(h.tx - h.sx, h.ty - h.sy);
        h.flyDur = clamp(dl / 700, .8, 1.15);   /* 飞 0.8~1.15 秒：看得清、跑得掉 */
        S.shake = Math.min(14, S.shake + 6);
        SFX.alarm();
      }
      continue;
    }

    const armed = S.t - h.born >= h.warm;
    /* 冲击环：预警期间只在原地闪着，不扩散；等玩家看清缺口才开始推 */
    if (h.kind === 'ring' && !armed) {
      h.rot += h.spin * dt;
      continue;
    }
    h.life -= dt;
    h.rot += h.spin * dt;
    if (h.follow && h.follow.hp > 0) { h.x = h.follow.x; h.y = h.follow.y; }   /* 凝视跟本体走（0.41.0 车轮用） */
    if (h.grow) h.r += h.grow * dt;
    if (h.life <= 0) {
      /* 沙暴：被卷着吹一段之后摔下来，落地这一下才结算（0.42.0） */
      if (h.slamDmg) {
        damagePlayerEnv(h.slamDmg, p.x, p.y);
        addRing(p.x, p.y, '#fff0d0', 16, 520, .5);
        addRing(p.x, p.y, '#d8b078', 14, 420, .4);
        addDecal(p.x, p.y, false, '#a97b52');
        for (let k2 = 0; k2 < 14; k2++) addPart(p.x + rnd(-40, 40), p.y + rnd(-40, 40), k2 % 2 ? '#d8b078' : '#a97b52', 300, 4);
        S.pLift = 0;   /* 落地瞬间人贴回地面 */
        S.shake = Math.min(16, S.shake + 8);
      }
      S.hazards.splice(i, 1); continue;
    }
    /* 环推到最大半径就散掉，不会无限往外扩占满整张图 */
    if (h.kind === 'ring' && h.maxR > 0 && h.r >= h.maxR) { S.hazards.splice(i, 1); continue; }
    if (S.t - h.born < h.warm) continue;

    /* 沙暴：把你顺着风推出去（快慢变化走位），收缩圈就是摔落倒计时 */
    if (h.kind === 'sand') {
      p.x = clamp(p.x + (h.wx || 0) * dt, p.r, WORLD.w - p.r);
      p.y = clamp(p.y + (h.wy || 0) * dt, p.r, WORLD.h - p.r);
      S.pLift = 12 + Math.sin(S.t * 11) * 3;   /* 悬空：本体提起来，影子留在地上 */
      /* 风从 BOSS 那边刮过来：粒子在上游生成、顺风吹过玩家 */
      const wl = Math.hypot(h.wx || 0, h.wy || 0) || 1;
      if (Math.random() < .8) {
        const qx = p.x - h.wx / wl * rnd(40, 110) + rnd(-34, 34);
        const qy = p.y - h.wy / wl * rnd(40, 110) + rnd(-34, 34);
        addPart(qx, qy, '#d8b078', 260, 2.5);
      }
      continue;
    }

    /* 黑洞：把玩家往中心拽，站中间就掉血（pullR 可独立于伤害圈拉大吸引范围） */
    if (h.pull) {
      const dx = h.x - p.x, dy = h.y - p.y, d = Math.hypot(dx, dy) || 1;
      const pr = h.pullR || h.r * 1.9;
      if (d < pr) {
        const f = h.pull * dt * (1 - d / pr);
        p.x = clamp(p.x + dx / d * f, p.r, WORLD.w - p.r);
        p.y = clamp(p.y + dy / d * f, p.r, WORLD.h - p.r);
      }
    }
    if (inHazard(h, p.x, p.y)) damagePlayerEnv(h.dps * .4, h.x, h.y);
  }
}

/* =========================================================
   BOSS 招式库
   每个函数就是一次「出手」，由 BOSS 的 moves 表轮转调用。
   伤害、速度、数量统一按阶段 ph（1/2/3）放大。
   ========================================================= */
function phMul(ph) { return ph === 3 ? 1.5 : ph === 2 ? 1.22 : 1; }

function ringShot(e, ph, n, spd, dmg, color, kind, rot0) {
  const base = rot0 || 0;
  for (let i = 0; i < n; i++) {
    shootEnemyBullet(e, S.player, i / n * RAD + base, spd * phMul(ph), dmg,
      { color: color, kind: kind || 'orb', r: kind === 'fire' ? 8 : kind === 'ice' ? 7 : 6 });
  }
}

/* =========================================================
   地震带手感参数（想自己调，只改这里）
   ---------------------------------------------------------
   时间模型：每一环的「完整上下周期」= T，多环同时推进时
   各自都跑完整的 T，互不瓜分时间。m 环只是把起始时刻
   错开 T/m，让同一时刻有 m 环在路上。
   ========================================================= */
const TIDE = {
  T: .5,          // 单环完整周期（秒）：亮地预警 + 上刺 + 收回 全算在内。想慢就加大
  warn: .3,       // 亮地预警时长（秒）。剩下的 T-warn 就是上刺+收回（内含升起-落下动画）
  ahead: 4,       // 预警提前量（环数）：最前面的环还没刺，后面就有这么多环已经淡淡亮起
  pitch: 84,      // 相邻两环的半径差（px）。环带间空档 = pitch - w
  w: 28,          // 环带宽度（px）
  r0: 64,         // 第一环半径（px）
  nMin: 10,       // 总圈数下限
  nMax: 20,       // 总圈数上限（难度越高圈越多，在这个区间里取）
  dps: 24,        // 被刺中一轮掉多少血（每次进伤害判定扣 dps*0.4，受环境伤内置冷却限制）
};

const ATK = {
  /* --- 通用：环形弹 / 扇形瞄准 --- */
  ring(e, ph) {
    ringShot(e, ph, 12 + (ph - 1) * 4, 210, 11 + ph * 2, e.color, 'orb', S.t * .7);
    if (ph === 3) ringShot(e, ph, 10 + 4, 150, 11, e.color, 'orb', -S.t * .7);
    SFX.zap();
  },
  /* 扇形弹 0.27.0 重做：起步弹少缝宽（起步就能钻），
     飞远后缝被拉大，缝宽到能塞下 3 个玩家就在缝正中自动补弹（fanSplit），
     一代一代裂下去，远处的密度永远压在「能躲」的线上 */
  fan(e, ph) {
    const n = 3 + (ph - 1);
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    const sep = .78 / Math.max(1, n - 1);
    for (let i = 0; i < n; i++) {
      const bl = shootEnemyBullet(e, S.player, base + (i - (n - 1) / 2) * sep,
        285 * phMul(ph), 11 + ph * 2, { color: e.color, r: 7 });
      if (bl) bl.fan = { da: i < n - 1 ? sep : 0, gen: 0 };   /* 扇缘最后一发没有邻缝，不外扩 */
    }
    SFX.zap();
  },

  /* 疯狂射击（荒原巨兽连招组①）：方向点射×3 → 大扇面扩射弹（带缝隙分裂）→ 小裂地×2
     （0.30.0 收尾段换小裂地：小招跟着裂地横扫的方向走——地面火线，先亮后喷） */
  barrage(e, ph) {
    const steps = [];
    for (let v = 0; v < 3; v++) {
      steps.push({ t: v * .24, mv: 'barrage', fn: (e2, p2) => {
        const base = Math.atan2(S.player.y - e2.y, S.player.x - e2.x);
        for (let k = -1; k <= 1; k++) {
          shootEnemyBullet(e2, S.player, base + k * .09, 460, 9 + p2, { color: e2.color, r: 6, life: 1.5 });
        }
        SFX.eshot();
      } });
    }
    steps.push({ t: .95, mv: 'fanWide', fn: (e2, p2) => { ATK.fanWide(e2, p2); } });
    steps.push({ t: 1.6, mv: 'fissureMini', fn: (e2, p2) => { ATK.fissureMini(e2, p2); } });
    steps.push({ t: 2.0, mv: 'fissureMini', fn: (e2, p2) => { ATK.fissureMini(e2, p2); } });
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 2.9 };
    e.casting = 2.9;
    announce(e.bossName + ' · 疯狂射击', '点射→扩射→小裂地，边绕边打', e.color, false);
  },

  /* 扩射弹：大扇面慢速弹，飞远后靠缝隙分裂自动加密（够缝才补，永远可躲） */
  fanWide(e, ph) {
    const n = 5, sep = 1.15 / (n - 1);
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    for (let i = 0; i < n; i++) {
      const bl = shootEnemyBullet(e, S.player, base + (i - 2) * sep, 195, 10 + ph,
        { color: e.color, r: 8, life: 3.4 });
      if (bl) bl.fan = { da: i < n - 1 ? sep : 0, gen: 0 };
    }
    SFX.zap();
  },

  /* 小裂地（0.30.0）：朝玩家方向一道短火线，亮地 0.45s 后喷发，留裂痕。
     小招版裂地横扫——以后荒原系的地面招都往这个方向走 */
  fissureMini(e, ph) {
    const a = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    for (let k = 0; k < 5; k++) {
      addHazard('fire', e.x + Math.cos(a) * (60 + k * 58), e.y + Math.sin(a) * (60 + k * 58),
        { r: 36, dps: 22 + ph * 2, color: '#ff7a3d', life: 1.4, warm: .45 });
    }
    addDecal(e.x + Math.cos(a) * 170, e.y + Math.sin(a) * 170, true);
    S.shake = Math.min(10, S.shake + 3);
    SFX.alarm();
  },

  /* 游钻（0.40.0 炎兽终极形态重做）：钻进地下绕玩家快圈游走——像虎鲸群围猎物，
     不太靠近也不太远离；地面裂纹拖尾就是它的位置，最后一段越转越近（收圈）
     就是要撞了。破土瞬间无预警直接冲撞，浮出与冲撞期间才挨打。 */
  burrow(e, ph) {
    const p = S.player;
    e.burrow = {
      mode: 'lurk', t: 0,
      dur: 2.4 + Math.random() * 1.0,                 /* 游多久看运气，收圈前不作任何预告 */
      orbA: Math.atan2(e.y - p.y, e.x - p.x),
      orbDir: e.orbitDir || (Math.random() < .5 ? 1 : -1),
      rBase: 190 + Math.random() * 55,                /* 巡游半径：不贴脸也不甩尾 */
      spdA: 1.7 + Math.random() * .4,                 /* 游钻角速度：贴圈快游 */
      crackT: 0,
      x: e.x, y: e.y,
    };
    e.gone = true;
    e.casting = 0;
    e.charging = 0; e.winding = 0;
    e.rest = 0;
    announce(e.bossName + ' · 游钻', '地面裂纹就是它——突然贴近就是要撞了，盯紧走位', e.color, false);
    S.shake = Math.min(14, S.shake + 6);
    SFX.alarm();
  },

  /* 扩散地震环：从 BOSS 身上推一圈带缺口的冲击环（绿色光斑=缺口=活路，环还会慢转） */
  shockRing(e, ph) {
    addHazard('ring', e.x, e.y, {
      r: e.r + 10, grow: 320, maxR: 430, thick: 20,
      gapA: Math.random() * RAD, gapW: .5, dps: 20 + ph * 3, color: e.color, life: 1.8, warm: .4, spin: .5,
    });
    S.shake = Math.min(12, S.shake + 4);
    SFX.zap();
  },

  /* 超级撞击（荒原巨兽连招组②）：锁定玩家连冲 3~5 轮（阶段越高轮数越多），每轮重新瞄准 */
  rampage(e, ph) {
    const rounds = 3 + (ph - 1);   /* P1/P2/P3 = 3/4/5 轮 */
    const steps = [];
    for (let r = 0; r < rounds; r++) {
      steps.push({ t: r * .95, mv: 'rampage', fn: (e2) => {
        if (e2.charging > 0 || e2.winding > 0) return;   /* 上一轮没冲完就跳过，不叠 */
        const dx = S.player.x - e2.x, dy = S.player.y - e2.y, d = Math.hypot(dx, dy) || 1;
        e2.winding = .38; e2.cdx = dx / d; e2.cdy = dy / d;
        addRing(e2.x, e2.y, e2.color, 10, 320, .35);
        SFX.alarm();
      } });
    }
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: rounds * .95 + .6 };
    e.casting = rounds * .95 + .6;
    announce(e.bossName + ' · 超级撞击', '连着冲 ' + rounds + ' 轮，横移别直线跑', e.color, false);
  },

  /* --- 冲撞：蓄力 → 红线预警 → 高速直线 --- */
  charge(e, ph) {
    if (e.charging > 0 || e.winding > 0) return;
    const dx = S.player.x - e.x, dy = S.player.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.winding = .5;
    e.cdx = dx / d; e.cdy = dy / d;
    addRing(e.x, e.y, e.color, 12, 340, .45);
    SFX.alarm();
  },

  /* --- 地震带：一圈圈往外推的固定环带，不是扩散环。
     每一圈先「亮地」（无伤害，站在上面也没事），然后整圈地面同时冒尖刺 0.25 秒，
     刺完缩回去，下一圈在更外侧亮起。相邻两圈强制留 2 个身位，
     所以只要不在当圈那条带上就安全 —— 不用绕圈追缺口，横向挪一步就够。
     难度决定同时有几圈在循环（1/2/3/4），相位错开，像波浪一样轮流刺。 --- */
  quake(e, ph) {
    /* 同屏只留一条波列：双 BOSS 一起放会把整片地面铺满，根本没法站 */
    if (S.hazards.some(h => h.kind === 'tide')) { ATK.ring(e, ph); return; }

    const m = Math.min(4, (diff().bands || 2) + (ph >= 3 ? 1 : 0));   /* 同时在路上的环数（每环都跑完整 T） */
    const step = TIDE.T / m;          /* 相邻两环错开的起始间隔 */
    const n = clamp(Math.round(8 + m * 3 + (ph >= 3 ? 1 : 0)), TIDE.nMin, TIDE.nMax);
    const dur = TIDE.ahead * step + n * step + TIDE.T;

    const h = {
      kind: 'tide', x: e.x, y: e.y,
      r0: TIDE.r0, w: TIDE.w, pitch: TIDE.pitch, n: n, m: m,
      T: TIDE.T, dt: step, dur: dur,
      born: S.t + TIDE.ahead * step,   /* 往后挪一段，让最前面 4 环的预警从施法瞬间就开始亮 */
      life: dur, max: dur,
      warn: TIDE.warn / TIDE.T, spike: (TIDE.T - TIDE.warn) / TIDE.T,
      ahead: TIDE.ahead,
      dps: TIDE.dps, color: '#ffb36b',
    };
    if (S.hazards.length > 24) S.hazards.shift();
    S.hazards.push(h);

    e.casting = dur;                  /* 施法期间不出新招，移动降到三成 */
    addRing(e.x, e.y, e.color, 12, 520, .5);
    S.shake = Math.min(16, S.shake + 7);
    SFX.alarm();
    if (!S.tideTold) {
      S.tideTold = true;
      announce('地震带', '站到环与环之间的空档里，别站在亮起来的那一圈上', '#ffb36b', true);
    }
  },

  /* --- 召唤小怪 --- */
  summon(e, ph) {
    const cnt = ph >= 3 ? 4 : ph >= 2 ? 3 : 2;
    if (S.enemies.length < 200) {
      for (let k = 0; k < cnt; k++) {
        S.pending.push({ type: k % 2 ? 'swarm' : 'grunt', x: e.x + rnd(-56, 56), y: e.y + rnd(-56, 56) });
      }
      addRing(e.x, e.y, e.color, 14, 400, .45);
      SFX.zap();
    }
  },

  /* --- 毒孢：慢速大孢囊，落地炸成毒潭 --- */
  spore(e, ph) {
    const n = 2 + (ph > 1 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      shootEnemyBullet(e, S.player, undefined, 125, 10,
        { r: 11, color: '#8ae06a', kind: 'spore', life: 2.9, onEnd: 'poison', off: e.r + 10 });
    }
  },

  /* --- 藤蔓尖刺：在玩家脚边冒出来 --- */
  vines(e, ph) {
    const p = S.player;
    const n = 3 + (ph - 1);
    for (let k = 0; k < n; k++) {
      const a = k / n * RAD + rnd(-.35, .35);
      const d = rnd(30, 110);
      addHazard('spike', p.x + Math.cos(a) * d, p.y + Math.sin(a) * d,
        { r: 34, dps: 24, color: '#59d98a', life: 3.4, warm: .8 });
    }
  },

  /* --- 火山爆发：从身体里疯狂喷不规则火焰，抛物线下落，落地烧起来 --- */
  volcano(e, ph) {
    const n = 14 + (ph - 1) * 7;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + rnd(-1.05, 1.05);
      const sp = rnd(300, 640);
      shootEnemyBullet(e, S.player, a, sp, 13,
        { color: i % 3 ? '#ff7a3d' : '#ffd24a', kind: 'fire', r: rnd(7, 12), life: rnd(1.0, 1.7), gravity: 620, onEnd: 'firepool', off: 4 });
    }
    addRing(e.x, e.y, '#ff7a3d', 16, 520, .45);
    S.shake = Math.min(20, S.shake + 11);
    S.flash = Math.max(S.flash, .35);
    SFX.alarm();
  },

  /* --- 火焰尾迹：边跑边烧，身后留火池 --- */
  fireTrail(e, ph) {
    addHazard('fire', e.x, e.y, { r: 54, dps: 20, color: '#ff7a3d', life: 3.6, warm: .1 });
    const n = 6 + (ph - 1) * 2;
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    for (let i = 0; i < n; i++) {
      shootEnemyBullet(e, S.player, base + (i - (n - 1) / 2) * .16, 340, 10,
        { color: '#ffb36b', kind: 'fire', r: 7, life: 1.4 });
    }
  },

  /* --- 正弦火焰弹：左右摆着飞过来（弹色跟 BOSS 本体走，虚空系复用也和谐） --- */
  zigzag(e, ph) {
    const n = 5 + (ph - 1) * 2;
    for (let i = 0; i < n; i++) {
      shootEnemyBullet(e, S.player, undefined, 190 + i * 12, 10,
        { color: e.color, kind: 'fire', r: 7, life: 4.6, wave: 1, amp: 150 + i * 10 });
    }
  },

  fireFan(e, ph) {
    const n = 7 + (ph - 1) * 3;
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    for (let i = 0; i < n; i++) {
      shootEnemyBullet(e, S.player, base + (i - (n - 1) / 2) * .13, 330, 10,
        { color: i % 2 ? '#ff7a3d' : '#ffd24a', kind: 'fire', r: 8, life: 2.0, gravity: 200 });
    }
  },

  ringFire(e, ph) {
    ringShot(e, ph, 14 + (ph - 1) * 4, 175, 12, '#ff7a3d', 'fire', S.t * 1.4);
    ringShot(e, ph, 14, 250, 12, '#ffd24a', 'fire', -S.t * 1.4);
  },

  /* --- 冰墙轨迹：一条长条冰墙钉在地上，能走过去，但走过去掉血 --- */
  iceWall(e, ph) {
    const p = S.player;
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    const n = ph >= 3 ? 3 : 2;
    for (let k = 0; k < n; k++) {
      const off = (k - (n - 1) / 2) * 78;
      const cx = e.x + Math.cos(a) * 250 - Math.sin(a) * off;
      const cy = e.y + Math.sin(a) * 250 + Math.cos(a) * off;
      addHazard('ice', cx, cy, {
        w: 520, h: 26, rot: a, dps: 30, color: '#7fe0ff', life: 6.5, warm: 1.0,
      });
    }
    addRing(e.x, e.y, '#7fe0ff', 12, 460, .5);
    SFX.alarm();
  },

  iceFan(e, ph) {
    const n = 6 + (ph - 1) * 3;
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    for (let i = 0; i < n; i++) {
      shootEnemyBullet(e, S.player, base + (i - (n - 1) / 2) * .19, 300, 11,
        { color: '#7fe0ff', kind: 'ice', r: 7, life: 2.6 });
    }
  },

  frostNova(e, ph) {
    ringShot(e, ph, 16 + (ph - 1) * 6, 165, 11, '#7fe0ff', 'ice', S.t * .9);
    const p = S.player;
    addHazard('ice', p.x, p.y, { w: 340, h: 22, rot: Math.atan2(p.y - e.y, p.x - e.x) + Math.PI / 2, dps: 26, color: '#c9f4ff', life: 3.2, warm: .9 });
  },

  /* --- 瞬移：消失 → 出现在你身边 → 立刻糊脸一圈 --- */
  blink(e, ph) {
    addRing(e.x, e.y, '#c37bff', 12, 620, .4);
    for (let k = 0; k < 14; k++) addPart(e.x, e.y, '#c37bff', rnd(90, 300), 3);
    const p = S.player;
    const a = Math.random() * RAD;
    const d = 130 + Math.random() * 60;
    e.x = clamp(p.x + Math.cos(a) * d, 60, WORLD.w - 60);
    e.y = clamp(p.y + Math.sin(a) * d, 60, WORLD.h - 60);
    addRing(e.x, e.y, '#e0c0ff', 10, 700, .45);
    for (let k = 0; k < 14; k++) addPart(e.x, e.y, '#c37bff', rnd(90, 300), 3);
    S.flash = Math.max(S.flash, .28);
    S.shake = Math.min(15, S.shake + 6);
    ringShot(e, ph, 9 + ph * 2, 235, 12, '#c37bff', 'void', Math.random() * RAD);
    SFX.zap();
  },

  /* --- 黑洞：在脚下生成吸引场，把你往中心拽 --- */
  blackhole(e, ph) {
    const p = S.player;
    const h = addHazard('void', p.x, p.y, {
      r: 118, dps: 15, color: '#a97bff', life: 2.8, warm: .5, grow: 0,
    });
    h.pull = 150;
    for (let k = 0; k < 10; k++) shootEnemyBullet(e, S.player, k / 10 * RAD, 120, 10,
      { color: '#c37bff', kind: 'void', r: 7, life: 2.8 });
    addRing(p.x, p.y, '#c37bff', 130, -60, .6);
    SFX.alarm();
  },

  /* --- 暗雾：撒一片遮住视野的虚空雾（不伤人，只让你看不见） --- */
  shroud(e, ph) {
    const p = S.player;
    addShroud(p.x + rnd(-70, 70), p.y + rnd(-70, 70), 180 + ph * 14, 5.0);
    addShroud(e.x, e.y, 150, 4.2);
    if (ph >= 2) addShroud(p.x + rnd(-170, 170), p.y + rnd(-170, 170), 165, 4.6);
    if (ph >= 3) addShroud(p.x + rnd(-110, 110), p.y + rnd(-110, 110), 215, 4.0);
    for (let k = 0; k < 10; k++) {
      addPart(p.x + rnd(-70, 70), p.y + rnd(-70, 70), '#8a5cff', rnd(40, 150), 3);
    }
    SFX.alarm();
  },

  /* --- 虚空矛：先亮几道细线（0.6s 预警），随后整条贯穿 --- */
  voidLance(e, ph) {
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    const n = ph >= 3 ? 3 : ph >= 2 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * .36;
      addHazard('beam', e.x + Math.cos(a) * 330, e.y + Math.sin(a) * 330, {
        w: 700, h: 26, rot: a, dps: 26, color: '#c37bff', life: 1.15, warm: .6, thick: 10,
      });
    }
    S.shake = Math.min(12, S.shake + 3);
    SFX.alarm();
  },

  /* --- 暗环弹：环形弹 + 一层雾罩上来，弹从雾里出来 --- */
  darkRing(e, ph) {
    ringShot(e, ph, 14 + ph * 3, 225, 12 + ph * 2, '#c37bff', 'void', Math.random() * RAD);
    addShroud(S.player.x, S.player.y, 135, 2.4);
    SFX.zap();
  },

  /* --- 暗处连射：钻进暗雾消失，从别处连点三波（读弹道，不是读位置） --- */
  vanishVolley(e, ph) {
    const p = S.player;
    addShroud(e.x, e.y, 150, 1.8);
    const a = Math.random() * RAD, d = 250 + Math.random() * 120;
    e.x = clamp(p.x + Math.cos(a) * d, 60, WORLD.w - 60);
    e.y = clamp(p.y + Math.sin(a) * d, 60, WORLD.h - 60);
    addShroud(e.x, e.y, 135, 2.2);
    const steps = [];
    for (let v = 0; v < 3; v++) {
      steps.push({ t: v * .34, mv: 'vanishVolley', fn: (e2, p2) => {
        const base = Math.atan2(S.player.y - e2.y, S.player.x - e2.x);
        for (let k = -1; k <= 1; k++) {
          shootEnemyBullet(e2, S.player, base + k * .1, 420, 10 + p2,
            { color: '#c37bff', kind: 'void', r: 7, life: 1.8 });
        }
        SFX.eshot();
      } });
    }
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 1.25 };
    e.casting = 1.25;
  },

  /* --- 连段组①「影袭」：瞬移到你背后 → 三道虚空矛 → 脚下黑洞 --- */
  shadowRush(e, ph) {
    const steps = [];
    steps.push({ t: 0, mv: 'blink', fn: (e2) => {
      /* 落到你背对的那一侧：位置感被夺走，不是随机方位 */
      const back = Math.atan2(e2.y - S.player.y, e2.x - S.player.x);
      e2.x = clamp(S.player.x + Math.cos(back) * 150, 60, WORLD.w - 60);
      e2.y = clamp(S.player.y + Math.sin(back) * 150, 60, WORLD.h - 60);
      addRing(e2.x, e2.y, '#c37bff', 10, 700, .42);
      addShroud(e2.x, e2.y, 135, 1.6);
      ringShot(e2, 1, 8, 250, 10, '#c37bff', 'void', Math.random() * RAD);
      SFX.zap();
    } });
    steps.push({ t: .55, mv: 'voidLance', fn: (e2, p2) => { ATK.voidLance(e2, p2); } });
    steps.push({ t: 1.35, mv: 'blackhole', fn: (e2, p2) => { ATK.blackhole(e2, p2); } });
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 2.5 };
    e.casting = 2.5;
    announce(e.bossName + ' · 影袭', '瞬移到你背后→三道矛→脚下黑洞，别停步', e.color, false);
  },

  /* --- 连段组②「虚空收束」：黑洞拽住 → 环弹罩雾 → 瞬移脱身反打 --- */
  voidCollapse(e, ph) {
    const steps = [];
    steps.push({ t: 0, mv: 'blackhole', fn: (e2, p2) => { ATK.blackhole(e2, p2); } });
    steps.push({ t: .8, mv: 'darkRing', fn: (e2, p2) => {
      ringShot(e2, p2, 16 + p2 * 2, 240, 12 + p2 * 2, '#c37bff', 'void', Math.random() * RAD);
      addShroud(S.player.x, S.player.y, 150, 2.2);
      SFX.zap();
    } });
    steps.push({ t: 1.8, mv: 'blink', fn: (e2) => {
      const pp = S.player, a = Math.random() * RAD, d = 300;
      e2.x = clamp(pp.x + Math.cos(a) * d, 60, WORLD.w - 60);
      e2.y = clamp(pp.y + Math.sin(a) * d, 60, WORLD.h - 60);
      addShroud(e2.x, e2.y, 160, 2.0);
      SFX.zap();
    } });
    steps.push({ t: 2.15, mv: 'fan', fn: (e2, p2) => { ATK.fan(e2, p2); } });
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 2.9 };
    e.casting = 2.9;
    announce(e.bossName + ' · 虚空收束', '黑洞拽住→环弹罩雾→瞬移反打，先脱出吸引力', e.color, false);
  },

  /* --- 双子交叉光束：从一只眼睛射向另一只，横穿战场 --- */
  crossBeam(e, ph) {
    const t = e.twin;
    if (!t || t.hp <= 0) { ATK.fan(e, ph); return; }
    const a = Math.atan2(t.y - e.y, t.x - e.x);
    const d = Math.hypot(t.x - e.x, t.y - e.y);
    addHazard('beam', (e.x + t.x) / 2, (e.y + t.y) / 2, {
      w: d + 40, h: 22, rot: a, dps: 38, color: '#b18bff', life: 1.5, warm: .85,
    });
    addHazard('beam', e.x + Math.cos(a + 1.57) * d * .5, e.y + Math.sin(a + 1.57) * d * .5, {
      w: d, h: 18, rot: a + 1.57, dps: 30, color: '#8a5cff', life: 1.2, warm: 1.0,
    });
    SFX.zap();
  },

  /* --- 落石：脚边砸下一片 --- */
  rocks(e, ph) {
    const p = S.player;
    const cnt = ph >= 3 ? 9 : ph >= 2 ? 7 : 5;
    for (let k = 0; k < cnt; k++) {
      const a = Math.random() * RAD, d = rnd(20, 210);
      addHazard('rock', p.x + Math.cos(a) * d, p.y + Math.sin(a) * d,
        { r: 44, dps: 36, color: e.color, life: 1.5, warm: .85 });
    }
    S.shake = Math.min(14, S.shake + 5);
  },

  /* --- 手臂横扫：两条手臂抡过去 --- */
  sweep(e, ph) {
    for (const arm of e.arms) arm.sw = .95;
    S.shake = Math.min(16, S.shake + 6);
    SFX.alarm();
  },

  /* ========== 荒原重做（0.42.0）小招 ==========
     玩家玩法：走位 / 快慢变化 / 视觉遮挡 —— 不是躲子弹打 BOSS */
  /* 周身裂地：你脚边一圈地同时裂开，逼你挪窝 */
  fissureAround(e, ph) {
    const p = S.player, a0 = Math.random() * RAD;
    for (let k = 0; k < 6; k++) {
      const a = a0 + k / 6 * RAD;
      addHazard('fire', p.x + Math.cos(a) * 88, p.y + Math.sin(a) * 88,
        { r: 38, dps: 20 + ph * 2, color: '#ffb36b', life: 1.25, warm: .5 });
    }
    addDecal(p.x, p.y, true, '#a97b52');
    S.shake = Math.min(10, S.shake + 4);
    SFX.alarm();
  },
  /* 沙暴吹起摔落：一出手就把你卷起来往后吹（0.55s 死区已去掉），
     收缩圈就是「摔落倒计时」——圈缩到脚底下那一瞬落地结算 */
  sandstorm(e, ph) {
    const p = S.player;
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    const h = addHazard('sand', p.x, p.y, { r: 120, dps: 0, color: '#d8b078', life: 1.5, warm: 0 });
    h.wx = Math.cos(a) * 165; h.wy = Math.sin(a) * 165;   /* 顺着风被推走 */
    h.slamDmg = 26 + ph * 4;
    h.life0 = h.life;                                     /* 绘制层用：收缩圈的进度 */
    addRing(p.x, p.y, '#d8b078', 20, 300, .4);
    for (let k = 0; k < 10; k++) addPart(p.x + rnd(-50, 50), p.y + rnd(-50, 50), '#d8b078', 180, 3);
    S.shake = Math.min(10, S.shake + 4);
    SFX.alarm();
  },
  /* ========== 荒原重做（0.42.0）连招 ========== */
  /* 地震带 → 落石 → 冲刺：三拍逼三种走法 */
  quakeRockCharge(e, ph) {
    const steps = [
      { t: 0, mv: 'quake', fn: (e2) => ATK.quake(e2, ph) },
      { t: 1.0, mv: 'rocks', fn: (e2) => ATK.rocks(e2, ph) },
      { t: 1.9, mv: 'charge', fn: (e2) => ATK.charge(e2, ph) },
    ];
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 3.1 };
    e.casting = 3.1;
    announce(e.bossName + ' · 裂地三连', '震完落石再冲——三拍都别站原地', e.color, false);
  },
  /* ========== 荒原重做（0.42.0）位移 ========== */
  slopeMove(e, ph) {
    const dx = S.player.x - e.x, dy = S.player.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.beastMv = { kind: 'slope', t: 0, dur: .8, ux: dx / d, uy: dy / d };
    addDecal(e.x, e.y, true, '#8a6a52');
    S.shake = Math.min(12, S.shake + 5);
    SFX.alarm();
  },
  sandBoost(e, ph) {
    const dx = S.player.x - e.x, dy = S.player.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.beastMv = { kind: 'sand', t: 0, dur: .8, ux: dx / d, uy: dy / d };
    addRing(e.x, e.y, '#d8b078', 14, 560, .5);
    for (let k = 0; k < 14; k++) addPart(e.x + rnd(-40, 40), e.y + rnd(-40, 40), '#d8b078', 220, 3);
    SFX.alarm();
  },
};

/* =========================================================
   荒原巨兽「石巨人」重做（0.42.0）
   ---------------------------------------------------------
   玩法语言：走位 → 快慢变化走位 → 视觉遮挡（沙暴）→ 全场裂地 →
   双走位（两臂两腿同时逼你）→ 概念吞噬（变身无敌，一整段重来）。
   ========================================================= */

/* 裂地横扫：从 (cx,cy) 放 n 条射线，每条由 3 段裂地块组成。
   full=true 时铺满一圆周（落地点裂地）；否则是以玩家方向为轴的扇形。 */
function fissureBurst(cx, cy, n, spread, full, len, warm, dps, color) {
  const a0 = Math.atan2(S.player.y - cy, S.player.x - cx);
  for (let i = 0; i < n; i++) {
    const a = full ? a0 + i / n * RAD : a0 + (n > 1 ? (i / (n - 1) - .5) * spread : 0);
    for (let k = 1; k <= 3; k++) {
      const dd = 56 + k * (len / 3);
      addHazard('fire', cx + Math.cos(a) * dd, cy + Math.sin(a) * dd,
        { r: 38, dps: dps, color: color || '#ffb36b', life: 1.7, warm: warm });
    }
    addDecal(cx + Math.cos(a) * len, cy + Math.sin(a) * len, true, '#a97b52');
  }
  S.shake = Math.min(18, S.shake + 8);
  SFX.alarm();
}

/* 踩踏/锤地：带预警圈的落石，玩家看得见才躲得开 */
function stompWarn(x, y, r, warm, dps, color) {
  return addHazard('rock', x, y, { r: r, dps: dps, color: color || '#c9a06a', life: 1.5, warm: warm });
}

/* 0.42.1 石巨人跳踩：追着玩家跳过去，落点就是预警圈，
   落地那一瞬「咚」出全圆周裂地——不是原地踩三下 */
function startLeap(e, ph) {
  const p = S.player;
  const x1 = clamp(p.x, 40, WORLD.w - 40), y1 = clamp(p.y, 40, WORLD.h - 40);
  const d = Math.hypot(x1 - e.x, y1 - e.y);
  const dur = clamp(.5 + d / 820, .55, 1.0);   /* 跳得越远滞空越久 */
  e.leap = { t: 0, dur: dur, x0: e.x, y0: e.y, x1: x1, y1: y1 };
  stompWarn(x1, y1, 116, dur + .05, 42, '#c9a06a');   /* 起跳就摆出落点预警 */
  addRing(e.x, e.y, '#a97b52', 12, 460, .45);
  for (let k = 0; k < 10; k++) addPart(e.x + rnd(-46, 46), e.y + rnd(-30, 50), '#a97b52', 240, 4);
  S.shake = Math.min(14, S.shake + 6);
  SFX.alarm();
}

/* 跳跃/土坡的视觉高度：绘制层让本体提起来、影子留地上 */
function beastLiftY(e) {
  if (e.leap) {
    const k = Math.min(1, e.leap.t / e.leap.dur);
    return Math.sin(k * Math.PI) * (e.r * 2.2);
  }
  if (e.beastMv && e.beastMv.kind === 'slope') {
    const k = Math.min(1, e.beastMv.t / e.beastMv.dur);
    return Math.sin(k * Math.PI) * (e.r * .72);
  }
  return 0;
}

/* 双手搓出来的地爆天星：在它手上聚形，落点是玩家脚下，砸地再裂一整圈 */
function titanMeteor(e, ph, T, r1, landFissure) {
  const h = addHazard('meteor', e.x, e.y - 26, {
    r: 24, r0: 24, r1: r1, T: T, dps: 24, boomDmg: 40 + ph * 8, color: '#c9a06a',
  });
  h.landFissure = !!landFissure;
  addRing(e.x, e.y, '#c9a06a', 12, 700, .5);
  return h;
}

/* 三阶段「石巨人」循环：丢两石头 → 地爆天星 → 追着玩家连跳三次
   （每次落点都先摆预警圈、落地裂地一整圈）——追着你踩，不原地踏步 */
function startTitanLoop(e, ph) {
  const steps = [
    { t: 0, mv: 'rocks', fn: () => stompWarn(S.player.x, S.player.y, 66, .55, 34, '#a97b52') },
    { t: .5, mv: 'rocks', fn: () => {
      const a = Math.random() * RAD;
      stompWarn(S.player.x + Math.cos(a) * 95, S.player.y + Math.sin(a) * 95, 60, .55, 30, '#a97b52');
    } },
    { t: 1.3, mv: 'chibaku', fn: (e2) => titanMeteor(e2, ph, 1.1, Math.round(e2.r * 2), true) },
    { t: 3.0, mv: 'leap', fn: (e2) => startLeap(e2, ph) },
    { t: 4.3, mv: 'leap', fn: (e2) => startLeap(e2, ph) },
    { t: 5.6, mv: 'leap', fn: (e2) => startLeap(e2, ph) },
  ];
  e.comboSeq = { steps: steps, i: 0, t: 0, dur: 7.2, loop: true };
  e.titanStarted = true;
}

/* 三阶段各自一套：P1 小×2→连；P2 中连中 ×2→大；P3 交给石巨人循环 */
function beastSequence(e, def, ph) {
  if (e.titan) return;                  /* P3 是形态，不是招式轮转 */
  const P = ph === 1 ? ['small', 'small', 'combo']
                     : ['mid', 'combo', 'mid', 'mid', 'combo', 'mid', 'ult'];
  if (!e.bs || e.bs.ph !== ph) e.bs = { ph: ph, i: 0, c: 0, m: 0 };
  const bs = e.bs;
  const slot = P[bs.i % P.length]; bs.i++;
  if (slot === 'small') {
    if (e.nextMv && ATK[e.nextMv]) {
      castMove(e.nextMv, ATK[e.nextMv], e, ph); e.lastMv = e.nextMv; e.nextMv = null;
    } else {
      const mv = def.moves[e.mvIdx % def.moves.length]; e.mvIdx++;
      if (ATK[mv]) { castMove(mv, ATK[mv], e, ph); e.lastMv = mv; }
    }
    e.timer = bossGap(e, def) * rnd(.8, 1.0);
  } else if (slot === 'combo') {
    const list = def.rhCombos || [];
    if (list.length) {
      const mv = list[bs.c % list.length]; bs.c++;
      if (ATK[mv]) castMove(mv, ATK[mv], e, ph);
    }
    e.timer = Math.max(e.timer, bossGap(e, def) * 1.3);
  } else if (slot === 'mid') {
    const list = def.mids || [];
    if (list.length) {
      const uk = list[bs.m % list.length]; bs.m++;
      const info = ULT_INFO[uk] || { name: uk, sub: '' };
      announce(e.bossName + ' · ' + info.name, info.sub, e.color, true);
      if (ULT[uk]) castMove(uk, ULT[uk], e, ph);
      e.casting = Math.max(e.casting, 1.0);
      if (!e.ultSeq) { e.rest = bossRest(e, 1.2); e.casting = Math.max(e.casting, 1.2); }
    }
    e.timer = bossGap(e, def) * 1.4;
  } else {
    const info = ULT_INFO[def.ult] || { name: def.ult, sub: '' };
    announce(e.bossName + ' · ' + info.name, info.sub, e.color, true);
    if (ULT[def.ult]) castMove(def.ult, ULT[def.ult], e, ph);
    e.timer = 9.0;
  }
}

/* 位移：土坡滑行 / 沙爆推进（沙爆同时把玩家往后吹，距离瞬间改写）；
   石巨人阶段一路追着玩家跑 */
function beastMove(e, dt, dx, dy, d, sp, def, ph) {
  if (e.leap) return { vx: 0, vy: 0 };   /* 空中轨迹由 bossThink 的 leap 状态驱动 */
  const base = bossMotion(e, dt, dx, dy, d, sp, def, ph);
  let vx = base.vx, vy = base.vy;
  if (e.titan && e.invuln <= 0 && d > 1) { vx = dx / d * sp * 1.35; vy = dy / d * sp * 1.35; }
  e.moveT = (e.moveT === undefined ? rnd(2.4, 3.8) : e.moveT) - dt;
  if (e.moveT <= 0 && !e.beastMv && e.charging <= 0 && e.winding <= 0 && !e.comboSeq) {
    e.moveT = rnd(3.2, 5.2);
    const ux = d > 1 ? dx / d : 1, uy = d > 1 ? dy / d : 0;
    if ((e.mvFlip = !e.mvFlip)) ATK.slopeMove(e, ph);
    else ATK.sandBoost(e, ph);
    if (e.beastMv) { e.beastMv.ux = ux; e.beastMv.uy = uy; }
  }
  if (e.beastMv) {
    const m = e.beastMv; m.t += dt;
    if (m.kind === 'slope') {
      vx = m.ux * 420; vy = m.uy * 420;
      if (Math.random() < .6) addPart(e.x + rnd(-30, 30), e.y + rnd(10, 40), '#a97b52', 120, 3);
    } else {
      vx = m.ux * 300; vy = m.uy * 300;
      const p = S.player;
      p.x = clamp(p.x - m.ux * 190 * dt, p.r, WORLD.w - p.r);
      p.y = clamp(p.y - m.uy * 190 * dt, p.r, WORLD.h - p.r);
      if (Math.random() < .7) addPart(p.x + rnd(-30, 30), p.y + rnd(-30, 30), '#d8b078', 150, 2);
    }
    if (m.t >= m.dur) e.beastMv = null;
  }
  return { vx: vx, vy: vy };
}

/* 石巨人的两臂两腿 + 手搓的石球 + 土坡 / 沙浪 / 跳跃影子。
   0.42.1：不再只在巨人阶段画——土坡/沙爆/跳踩的动画也在这里 */
function drawBeastGiant(e) {
  if (!e || e.hp <= 0 || (!e.giant && !e.titan && !e.beastMv && !e.leap)) return;
  const R = e.r, sw = Math.sin(S.t * 3 + (e.ph || 0)) * .3;
  const lift = beastLiftY(e);
  ctx.save();
  /* —— 贴地的东西：影子 / 土坡 / 沙浪（把绘制层的 -lift 抵回来） —— */
  ctx.save();
  ctx.translate(0, lift);
  if (e.leap) {                                    /* 跳踩：影子随高度缩 */
    const k = Math.min(1, e.leap.t / e.leap.dur);
    const sc = 1 - Math.sin(k * Math.PI) * .5;
    ctx.globalAlpha = .5 * sc + .15;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + R * .5, R * 1.05 * sc, R * .5 * sc, 0, 0, RAD);
    ctx.fillStyle = '#241608';
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (e.beastMv && e.beastMv.kind === 'slope') {   /* 土坡：随进度拱起来 */
    const k = Math.min(1, e.beastMv.t / e.beastMv.dur);
    const build = Math.min(1, k * 4);
    ctx.beginPath();
    ctx.moveTo(e.x - R * 1.6, e.y + R * .95);
    ctx.lineTo(e.x, e.y + R * .95 - R * 1.15 * build);
    ctx.lineTo(e.x + R * 1.6, e.y + R * .95);
    ctx.closePath();
    ctx.fillStyle = 'rgba(122,91,66,.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(201,160,106,.6)'; ctx.lineWidth = 2; ctx.stroke();
    /* 坡尾扬尘 */
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = 'rgba(169,123,82,' + (.5 - i * .13).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(e.x - e.beastMv.ux * (R * 1.3 + i * 26), e.y + R * .55 + rnd(-8, 8), 10 - i * 2, 0, RAD);
      ctx.fill();
    }
  }
  if (e.beastMv && e.beastMv.kind === 'sand') {    /* 沙爆：身后一道路径沙浪 */
    const k = Math.min(1, e.beastMv.t / e.beastMv.dur);
    const ux = e.beastMv.ux, uy = e.beastMv.uy;
    for (let i = 0; i < 4; i++) {
      const bx = e.x - ux * (R * 1.1 + i * 30), by = e.y - uy * (R * 1.1 + i * 30);
      ctx.globalAlpha = (.55 - i * .11) * (1 - k * .5);
      ctx.beginPath();
      ctx.arc(bx, by, R * (.75 - i * .1), 0, RAD);
      ctx.fillStyle = i % 2 ? 'rgba(216,176,120,.5)' : 'rgba(169,123,82,.55)';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    /* 两道侧向风线 */
    ctx.strokeStyle = 'rgba(216,176,120,.5)';
    ctx.lineWidth = 3;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(e.x - uy * s * R * 1.4, e.y + ux * s * R * 1.4);
      ctx.lineTo(e.x - ux * R * 2 - uy * s * R * 2.1, e.y - uy * R * 2 + ux * s * R * 2.1);
      ctx.stroke();
    }
  }
  ctx.restore();
  /* —— 随本体提起的东西：两腿 / 两臂 / 手搓石球 —— */
  for (const s of [-1, 1]) {                       /* 两条腿 */
    ctx.save();
    ctx.translate(e.x + s * R * .55, e.y + R * .7);
    ctx.rotate(s * (.15 + sw * .25));
    ctx.fillStyle = '#7a5b42'; ctx.strokeStyle = '#c9a06a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.rect(-R * .24, 0, R * .48, R * .9); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  for (const s of [-1, 1]) {                       /* 两条石臂 */
    ctx.save();
    ctx.translate(e.x + s * R * .85, e.y - R * .28);
    ctx.rotate(s * (.45 + sw));
    ctx.fillStyle = '#8a6a52'; ctx.strokeStyle = '#e0bc8a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.rect(s < 0 ? -R * 1.5 : 0, -R * .24, R * 1.5, R * .48);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if (e.giant && e.giant.orb) {                    /* 手搓的地爆天星 */
    const k = Math.min(1, Math.max(0, (e.giant.t - .8) / 1.1));
    ctx.beginPath(); ctx.arc(e.x, e.y - R * 1.35, 10 + 30 * k, 0, RAD);
    ctx.fillStyle = 'rgba(138,106,82,.9)'; ctx.fill();
    ctx.strokeStyle = '#ffd6a0'; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const a = S.t * 4 + i / 6 * RAD, rr = 30 + 26 * k;
      ctx.beginPath(); ctx.arc(e.x + Math.cos(a) * rr, e.y - R * 1.35 + Math.sin(a) * rr, 4, 0, RAD);
      ctx.fillStyle = '#c9a06a'; ctx.fill();
    }
  }
  ctx.restore();
}

/* =========================================================
   BOSS 招牌大招（ULT）：每家一个压轴，二阶段起充能循环，
   进新阶段后很快接一记。全部自带预警（暖场 / 预警环 / 慢速），
   没有躲不掉的大招 —— 压迫感来自「又快又大但看得清」。
   ULT_INFO 是喊招用的名字与提示。
   ========================================================= */
const ULT_INFO = {

  skyfire:      { name: '天火焚原', sub: '全屏落火，亮圈处别站' },
  blazeRun:     { name: '炎蛇回旋', sub: '三层火环套过来——环与环之间穿' },
  deepFreeze:   { name: '绝对零度', sub: '脚下发凉，移速下降——想好再走' },
  shadowStorm:  { name: '影袭风暴', sub: '瞬移到你身边糊脸——保持横移' },
  gaze:         { name: '虚空凝视', sub: '一道锥形视线缓缓扫过——离开那束光' },

  voidWheel:    { name: '永夜之轮', sub: '五道长夜之光轮转遮蔽，五道凝视反着转扫过来——贴着光缝走位' },
  fissureFive:  { name: '五道裂地横扫', sub: '中心横发五条裂地，赶你离开站的地方——站线与线之间' },
  rockRain:     { name: '陨石连击', sub: '一颗一颗追着你头顶砸，间隔短、落得快，但只要一直跑就砸不着' },
  stoneArm:     { name: '岩石巨臂', sub: '石头聚成一条大胳膊，抡两三次，爆开再撒一把碎石' },
  titanWrath:   { name: '石巨人·天崩', sub: '裂地赶人→长出两臂两腿→手搓地爆天星砸过来→落点裂地一整圈→追着你连跳三次，落点都有预警圈' },
  annihilate:   { name: '湮灭十字', sub: '十字光束旋转扫场——跟着转或站斜线' },
  devour:       { name: '巨口吞噬', sub: '被往嘴里拽——逆着劲往外游' },
  meteorBreath: { name: '陨星吐息', sub: '扇面轰炸——往侧面跑出扇区' },
  chibaku:      { name: '地爆天星', sub: '巨石聚成后整颗朝你砸来——影子落哪就赶紧跑开' },
};

const ULT = {
  /* 荒原巨兽「裂地横扫」三段连招（bossThink 的 ultSeq 推进）：
     ① 蓄吼 0.8s（震屏 10px+顿帧）② 三道地裂 1.15s（留裂痕残留）
     ③ 红线追踪冲撞 —— 然后力竭硬直 2s，全场最佳输出点 */
  fissure(e, ph) {
    e.ultSeq = { step: 1, t: 0 };
    S.shake = Math.min(20, S.shake + 10);
    shakeDir(e.x, e.y, 8);
    S.hitStop = Math.max(S.hitStop, .09);
    S.flash = Math.max(S.flash, .3);
    addRing(e.x, e.y, '#ff7a3d', 14, 700, .5);
    SFX.alarm();
  },

  /* 荒原巨兽第二大招「地爆天星」：玩家脚下渐渐聚起一颗巨石，
     长到 BOSS 两三倍大后，整颗石头腾空飞出砸向玩家（本体投掷，不是发炮弹），
     地面影子标落点——别恋战，看影子跑 */
  chibaku(e, ph) {
    const p = S.player;
    addHazard('meteor', p.x, p.y, {
      r: 26, r0: 26, r1: Math.round(e.r * 2.5), T: 3.2,
      dps: 24, boomDmg: 42 + ph * 7, color: '#c9a06a',
    });
    e.casting = 1.2;
    S.shake = Math.min(18, S.shake + 9);
    S.hitStop = Math.max(S.hitStop, .09);
    addRing(e.x, e.y, '#c9a06a', 14, 700, .5);
    SFX.alarm();
  },

  /* ========== 荒原重做（0.42.0）中招：打伤害 + 大招预告 ========== */
  /* 中心横发五条裂地横扫：赶你离开站的地方，站线与线之间 */
  fissureFive(e, ph) {
    fissureBurst(e.x, e.y, 5, 1.5, false, 620, .55, 28, '#ffb36b');
    announce(e.bossName + ' · 五道裂地', '五条裂地横着铺开——站线与线之间', e.color, false);
  },
  /* 连续石头攻击：10 颗，一颗一颗追着你头顶落，间隔短落得快，但只要一直跑就砸不着 */
  rockRain(e, ph) {
    const steps = [];
    for (let k = 0; k < 10; k++) {
      steps.push({ t: k * .34, mv: 'rocks', fn: () => {
        addHazard('rock', S.player.x, S.player.y,
          { r: 46, dps: 34, color: '#c9a06a', life: .95, warm: .26 });
      } });
    }
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 10 * .34 + .7 };
    e.casting = 10 * .34 + .7;
    announce(e.bossName + ' · 陨石连击', '一颗一颗追着头顶砸——别停脚', e.color, false);
  },
  /* 石头塑形巨大手臂：聚石→抡三下→爆裂成碎石打你 */
  stoneArm(e, ph) {
    const steps = [
      { t: 0, mv: 'stoneArm', fn: (e2) => {
        for (let k = 0; k < 18; k++) addPart(e2.x + rnd(-40, 120), e2.y + rnd(-70, 70), '#a97b52', 200, 4);
        SFX.alarm();
      } },
    ];
    for (let s = 0; s < 3; s++) {
      steps.push({ t: .7 + s * .85, mv: 'stoneArm', fn: (e2) => {
        const a = Math.atan2(S.player.y - e2.y, S.player.x - e2.x) + (s % 2 ? .45 : -.45);
        addHazard('beam', e2.x, e2.y, {
          w: 720, h: 74, rot: a, spin: (s % 2 ? 1 : -1) * .5,
          dps: 32, color: '#a97b52', life: 1.5, warm: .55,
        });
        S.shake = Math.min(18, S.shake + 8);
      } });
    }
    steps.push({ t: 3.3, mv: 'stoneArm', fn: (e2) => {
      for (let k = 0; k < 14; k++) shootEnemyBullet(e2, S.player, k / 14 * RAD, 250, 10,
        { color: '#c9a06a', kind: 'void', r: 7, life: 2.4 });
      addRing(e2.x, e2.y, '#a97b52', 14, 620, .5);
    } });
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 4.0 };
    e.casting = 4.0;
    announce(e.bossName + ' · 岩石巨臂', '石头聚成一条大胳膊，抡完会炸成碎石', e.color, false);
  },
  /* 大招「石巨人·天崩」：中招的组合，把「裂地 / 巨石 / 踩踏」一次推到极限。
     0.42.1：地爆天星砸完不是原地踩——追着玩家跳，落点裂地一整圈，连跳三次 */
  titanWrath(e, ph) {
    const steps = [
      { t: 0, mv: 'fissureFive', fn: (e2) => fissureBurst(e2.x, e2.y, 5, 1.6, false, 700, .5, 28, '#ffb36b') },
      { t: .9, mv: 'titanForm', fn: (e2) => {
        e2.giant = { t: 0, orb: 0 };
        announce('荒原巨兽 · 石巨人', '两臂两腿长出来了——它开始搓石头了', '#c9a06a', true);
        for (let k = 0; k < 26; k++) addPart(e2.x + rnd(-70, 70), e2.y + rnd(-70, 70), '#a97b52', 180, 5);
        S.shake = Math.min(22, S.shake + 12); S.flash = Math.max(S.flash, .4); SFX.alarm();
      } },
      { t: 1.7, mv: 'chibaku', fn: (e2) => {
        if (e2.giant) e2.giant.orb = 1;
        titanMeteor(e2, ph, 1.5, Math.round(e2.r * 2.4), true);
      } },
      { t: 4.0, mv: 'leap', fn: (e2) => startLeap(e2, ph) },
      { t: 5.3, mv: 'leap', fn: (e2) => startLeap(e2, ph) },
      { t: 6.6, mv: 'leap', fn: (e2) => startLeap(e2, ph) },
      { t: 7.9, mv: 'titanEnd', fn: (e2) => { e2.giant = null; } },
    ];
    e.comboSeq = { steps: steps, i: 0, t: 0, dur: 8.6 };
    e.casting = 8.6;
    e.timer = 10.0;
    S.shake = Math.min(22, S.shake + 12);
  },

  /* 腐林母体「万孢齐放」：满屏慢速毒孢，落地产毒潭 */
  sporeRain(e, ph) {
    const n = 16 + ph * 2;
    for (let i = 0; i < n; i++) {
      shootEnemyBullet(e, S.player, i / n * RAD + rnd(-.1, .1), 95, 12,
        { r: 11, color: '#8ae06a', kind: 'spore', life: 4.2, onEnd: 'poison', off: e.r + 10 });
    }
    S.shake = Math.min(14, S.shake + 6);
    SFX.zap();
  },

  /* 炎兽·左「天火焚原」：超大范围落石式火雨，暖场圈先亮 */
  skyfire(e, ph) {
    const p = S.player;
    for (let k = 0; k < 16 + ph * 3; k++) {
      const a = Math.random() * RAD, d = rnd(30, 430);
      addHazard('rock', p.x + Math.cos(a) * d, p.y + Math.sin(a) * d,

  /* 炎兽·右「炎蛇回旋」：三层错相位大环火 + 迎面火扇 */
  blazeRun(e, ph) {
    ringShot(e, ph, 18, 150, 12, '#ff7a3d', 'fire', 0);
    ringShot(e, ph, 18, 240, 12, '#ffd24a', 'fire', .17);
    ringShot(e, ph, 14, 330, 12, '#ffb36b', 'fire', .35);
    const base = Math.atan2(S.player.y - e.y, S.player.x - e.x);

    }

  /* 冰原领主「绝对零度」：全场缓速 + 双冰环 + 一条旋转冰墙 */
  deepFreeze(e, ph) {
    S.player.slowT = Math.max(S.player.slowT, 2.2);
    ringShot(e, ph, 16, 140, 11, '#7fe0ff', 'ice', 0);

  /* 虚空之影「影袭风暴」：远距瞬移糊脸大环 + 三连狙击弹 */
  shadowStorm(e, ph) {

    addRing(e.x, e.y, '#e0c0ff', 12, 760, .55);
    S.flash = Math.max(S.flash, .35);
    S.shake = Math.min(16, S.shake + 8);
    ringShot(e, ph, 16 + ph * 2, 250, 12, '#c37bff', 'void', Math.random() * RAD);

  /* 虚空之影「虚空凝视」（0.36.0）：0.95 秒蓄能只给一道细线，
     随后锥形视线出现并缓慢旋转扫场——离开那束光，别在光里补血 */
  gaze(e, ph) {
    const p = S.player;
    const ang = Math.atan2(p.y - e.y, p.x - e.x);
    addRing(e.x, e.y, '#c37bff', 16, 700, .5);
    for (let k = 0; k < 14; k++) addPart(e.x, e.y, '#c37bff', rnd(80, 260), 3);
    addHazard('gaze', e.x, e.y, {
      w: 980, h: .62, rot: ang, dps: 34, color: '#b18bff',

    });
    S.shake = Math.min(16, S.shake + 7);
    S.flash = Math.max(S.flash, .22);
    SFX.alarm();

  /* 虚空之影「长夜」（0.36.0 概念大招）：全场暗下来，只剩它眼下那束缓慢摆动的光。
