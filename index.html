/* ---------- 演示动画引擎 ---------- */
let DEX_RAF = 0;
let DEX_BOSS = 'beast';   /* 当前选中的 BOSS */

function dexStop() {
  if (DEX_RAF) { cancelAnimationFrame(DEX_RAF); DEX_RAF = 0; }
}

function dexDot(o, x, y, r, c, a) {
  o.g.globalAlpha = a === undefined ? 1 : a;
  o.g.fillStyle = c;
  o.g.beginPath(); o.g.arc(x, y, r, 0, RAD); o.g.fill();
  o.g.globalAlpha = 1;
}

/* 预警圈：progress 0→1 虚线圈逐渐变亮变红 */
function dexWarn(o, x, y, r, p, c) {
  o.g.setLineDash([5, 5]);
  o.g.strokeStyle = c || '#ffb36b';
  o.g.globalAlpha = .25 + p * .6;
  o.g.lineWidth = 2;
  o.g.beginPath(); o.g.arc(x, y, r, 0, RAD); o.g.stroke();
  o.g.setLineDash([]);
  o.g.globalAlpha = 1;
}

const DEMOS = {
  ring(o) {
    const k = o.t % 1.8, r = k * 95 + 12;
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * RAD + k * .9;
      dexDot(o, o.bx + Math.cos(a) * r, o.by + Math.sin(a) * r, 5, o.color, 1 - k / 2.2);
    }
  },
  ring2(o) {
    const k = o.t % 2.2;
    for (let i = 0; i < 13; i++) {
      const a1 = i / 13 * RAD + k * 1.1, r1 = k * 80 + 12;
      dexDot(o, o.bx + Math.cos(a1) * r1, o.by + Math.sin(a1) * r1, 5, '#ff7a3d', 1 - k / 2.6);
      const a2 = i / 13 * RAD - k * 1.1, r2 = k * 120 + 26;
      dexDot(o, o.bx + Math.cos(a2) * r2, o.by + Math.sin(a2) * r2, 5, '#ffd24a', 1 - k / 2.6);
    }
  },
  fan(o) {
    const base = Math.atan2(o.py - o.by, o.px - o.bx);
    const k = o.t % 2.6, r = k * 130;
    /* 三发起步缝宽，飞远缝拉大，够宽就在缝里补弹（示意一代分裂） */
    const angs = [-.39, 0, .39];
    if (r > 150) angs.push(-.195, .195);
    for (const a of angs) {
      dexDot(o, o.bx + Math.cos(base + a) * r, o.by + Math.sin(base + a) * r, 5, o.color, 1 - k / 3);
    }
  },
  barrage(o) {
    const base = Math.atan2(o.py - o.by, o.px - o.bx);
    const t = o.t % 3.4;
    if (t < 1.0) {   /* 点射三连 */
      const r = (t % .33) * 380 + 16;
      for (let k = -1; k <= 1; k++) {
        dexDot(o, o.bx + Math.cos(base + k * .09) * r, o.by + Math.sin(base + k * .09) * r, 5, o.color, .95);
      }
    } else if (t < 2.2) {   /* 扩射扇：缝拉大后补弹 */
      const k = t - 1.0, r = k * 105;
      const angs = [-.57, -.285, 0, .285, .57];
      if (r > 120) angs.push(-.428, -.143, .143, .428);
      for (const a of angs) {
        dexDot(o, o.bx + Math.cos(base + a) * r, o.by + Math.sin(base + a) * r, 6, o.color, 1 - k / 1.5);
      }
    } else {   /* 小裂地：一道短火线亮地后喷发 */
      for (let k = 0; k < 2; k++) {
        const local = t - 2.2 - k * .45;
        if (local < 0 || local > 1.2) continue;
        const gA2 = base + (k ? .5 : -.35);
        const p2 = Math.min(1, local / .45);
        for (let j = 0; j < 5; j++) {
          const rr = 40 + j * 52;
          o.g.globalAlpha = .18 + p2 * .55 * (1 - local / 1.4);
          o.g.fillStyle = '#ff7a3d';
          o.g.beginPath(); o.g.arc(o.bx + Math.cos(gA2) * rr, o.by + Math.sin(gA2) * rr, 15, 0, RAD); o.g.fill();
        }
        o.g.globalAlpha = 1;
      }
    }
  },
  meteor(o) {
    /* 聚形 → 整颗石头被甩到你头上 → 砸地（演示玩家已躲开，落点留在地上） */
    const t = o.t % 4.2, R = 62;
    const mx = o.px + 96, my = o.py + 40;     /* 成形点：玩家脚边 */
    const tx = o.px - 54, ty = o.py - 26;     /* 落点：玩家躲开后留下的地面 */
    if (t < 2.4) {
      const k = t / 2.4, r = 14 + (R - 14) * k * k;
      o.g.setLineDash([6, 5]);
      o.g.strokeStyle = 'rgba(255,150,90,' + (.3 + k * .5).toFixed(2) + ')';
      o.g.lineWidth = 2;
      o.g.beginPath(); o.g.arc(mx, my, R, 0, RAD); o.g.stroke();
      o.g.setLineDash([]);
      for (let j = 0; j < 5; j++) {
        const fr = (o.t * .9 + j * .2) % 1;
        const a = j / 5 * RAD + o.t;
        const dd = R * (1.6 - fr * .6);
        dexDot(o, mx + Math.cos(a) * dd, my + Math.sin(a) * dd, 3 + k * 2, '#a97b52', fr);
      }
      dexDot(o, mx, my, r, '#8a6a52', .85);
    } else if (t < 3.3) {
      const k = (t - 2.4) / .9;
      o.g.setLineDash([6, 5]);
      o.g.strokeStyle = 'rgba(255,120,70,' + (.4 + k * .45).toFixed(2) + ')';
      o.g.lineWidth = 2;
      o.g.beginPath(); o.g.arc(tx, ty, R + 12, 0, RAD); o.g.stroke();
      o.g.setLineDash([]);
      o.g.globalAlpha = .45 * k;
      o.g.beginPath(); o.g.ellipse(tx, ty + 8, R * .9, R * .32, 0, 0, RAD);
      o.g.fillStyle = '#000'; o.g.fill();
      o.g.globalAlpha = 1;
      const lift = Math.sin(Math.PI * k) * 96;
      dexDot(o, mx + (tx - mx) * k, my + (ty - my) * k - lift, R, '#8a6a52', .9);
    } else {
      const k = Math.min(1, (t - 3.3) / .9);
      dexDot(o, tx, ty, (R + 12) * (1 + k * .5), '#e08a4a', Math.max(0, .8 - k * .8));
    }
  },
  charge(o) {
    const a = Math.atan2(o.py - o.by, o.px - o.bx);
    const t = o.t % 3.2;
    if (t < 1.2) {
      o.g.globalAlpha = .4 + Math.sin(t * 18) * .35;
      o.g.strokeStyle = '#ff4d6d'; o.g.lineWidth = 4;
      o.g.beginPath(); o.g.moveTo(o.bx, o.by);
      o.g.lineTo(o.bx + Math.cos(a) * 420, o.by + Math.sin(a) * 420); o.g.stroke();
      o.g.globalAlpha = 1;
    } else if (t < 1.75) {
      const k = (t - 1.2) / .55;
      o.bx += Math.cos(a) * 300 * k; o.by += Math.sin(a) * 300 * k;
    } else { o.bx -= 60; o.by += 0; }   /* 慢慢走回去 */
  },
  tide(o) {
    for (let k = 0; k < 4; k++) {
      const r = 55 + k * 40;
      const local = (o.t % 3.2) - k * .5;
      if (local < 0) { continue; }
      const q = (local % 1.4) / 1.4;
      const spiking = q >= .5 && q < .72;
      o.g.strokeStyle = spiking ? '#ffb36b' : 'rgba(255,179,107,.45)';
      o.g.lineWidth = spiking ? 9 : 2;
      o.g.setLineDash(spiking ? [] : [6, 6]);
      o.g.beginPath(); o.g.arc(o.bx, o.by, r, 0, RAD); o.g.stroke();
      o.g.setLineDash([]);
    }
  },
  summon(o) {
    const k = o.t % 2.8;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * RAD + 1, d = 46 + (k % 1.4) * 26;
      dexDot(o, o.bx + Math.cos(a) * d, o.by + Math.sin(a) * d, 6, '#9fe08a', Math.min(1, k));
    }
  },
  spots(o) {
    const pts = [[.18, .25], [-.3, .4], [.42, -.28], [-.42, -.35], [.05, .55], [-.15, -.55], [.55, .35], [-.55, .1]];
    pts.forEach((p, i) => {
      const ph = ((o.t + i * .45) % 2.4);
      const x = o.px + p[0] * 130, y = o.py + p[1] * 90;
      if (ph < 1.2) dexWarn(o, x, y, 28, ph / 1.2, o.color);
      else if (ph < 1.55) dexDot(o, x, y, 26 * (1.55 - ph) / .35 + 8, o.color, .9);
      else dexDot(o, x, y, 10, o.color, Math.max(0, (2.4 - ph) / .85 * .4));
    });
  },
  line(o) {
    const base = Math.atan2(o.py - o.by, o.px - o.bx);
    for (let ln = 0; ln < 3; ln++) {
      const a = base + (ln - 1) * .42;
      const ph = ((o.t + ln * .5) % 3);
      for (let k = 0; k < 5; k++) {
        const d = 55 + k * 58;
        const x = o.bx + Math.cos(a) * d, y = o.by + Math.sin(a) * d;
        if (ph < 1.3) dexWarn(o, x, y, 24, ph / 1.3, o.color);
        else if (ph < 1.75) dexDot(o, x, y, 22, o.color, .9);
      }
    }
  },
  volcano(o) {
    const k = o.t % 1.9;
    for (let i = 0; i < 9; i++) {
      const f = i / 9;
      const vx = o.bx + (f - .5) * 260 * k * 1.4;
      const vy = o.by - Math.sin(f * 3.1 + 1) * 110 * Math.sin(Math.min(1, k) * Math.PI) - k * 40;
      dexDot(o, vx, Math.min(vy, o.H - 14), 6, i % 3 ? '#ff7a3d' : '#ffd24a', 1 - k / 2.4);
    }
  },
  trail(o) {
    const k = o.t % 3;
    const dir = Math.atan2(o.py - o.by, o.px - o.bx);
    for (let i = 0; i < 6; i++) {
      const d = 30 + i * 34;
      dexDot(o, o.bx + Math.cos(dir) * d, o.by + Math.sin(dir) * d, 15, '#ff7a3d', Math.max(0, .5 - i * .06));
    }
    o.bx += Math.cos(dir) * k * 40; o.by += Math.sin(dir) * k * 40;
  },
  wave(o) {
    const k = o.t % 2.4;
    const dir = Math.atan2(o.py - o.by, o.px - o.bx);
    for (let i = 0; i < 5; i++) {
      const r = k * 110 + i * 26;
      const px = o.bx + Math.cos(dir) * r, py = o.by + Math.sin(dir) * r;
      dexDot(o, px + Math.sin(k * 7 + i) * 22, py, 6, o.color, 1 - k / 3);
    }
  },
  wall(o) {
    const ph = o.t % 3.4;
    const a = Math.atan2(o.py - o.by, o.px - o.bx) + Math.PI / 2;
    const cx = o.bx + Math.cos(a + Math.PI / 2) * 150, cy = o.by + Math.sin(a + Math.PI / 2) * 150;
    o.g.save();
    o.g.translate(cx, cy); o.g.rotate(a);
    o.g.globalAlpha = ph < 1.1 ? .25 + ph * .3 : .6;
    o.g.fillStyle = '#7fe0ff';
    o.g.fillRect(-120, -9, 240, 18);
    o.g.restore();
    o.g.globalAlpha = 1;
  },
  blink(o) {
    const t = o.t % 3.4;
    if (t < .8) { dexWarn(o, o.px + 60, o.py, 30, t / .8, '#c37bff'); }
    else if (t < 2) {
      dexDot(o, o.px + 60, o.py, 16, '#c37bff');
      const k = (t - .8) / 1.2;
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * RAD, r = k * 90;
        dexDot(o, o.px + 60 + Math.cos(a) * r, o.py + Math.sin(a) * r, 4, '#c37bff', 1 - k);
      }
    }
  },
  veil(o) {
    const k = o.t % 3.2;
    const a = o.t * .55;
    const kk = Math.min(1, k / .5, (3.2 - k) / .7);
    /* 三团暗雾缓慢旋转着叠在一起，把中间那块视野吃掉 */
    for (let i = 0; i < 3; i++) {
      const ang = a + i * 2.1;
      dexDot(o, o.bx + Math.cos(ang) * 24, o.by + Math.sin(ang) * 24, 64, '#08030f', .88 * kk);
    }
    dexDot(o, o.bx, o.by, 78, '#0b0418', .7 * kk);
    /* 雾里偶尔透出一发弹：证明它还在打你 */
    if (k > 1.2 && k < 2.2) {
      const t = (k - 1.2) / 1;
      dexDot(o, o.bx - 90 + t * 180, o.by + Math.sin(t * 6) * 20, 5, '#c37bff', 1 - t * .4);
    }
  },
  lance(o) {
    const k = o.t % 2.6;
    const base = Math.atan2(o.py - o.by, o.px - o.bx);
    const angs = [-.36, 0, .36];
    for (const da of angs) {
      const a = base + da;
      if (k < 1.0) {
        /* 亮线预警 */
        const p2 = k / 1.0;
        o.g.save();
        o.g.setLineDash([9, 8]);
        o.g.strokeStyle = 'rgba(216,180,255,' + (.3 + p2 * .5).toFixed(2) + ')';
        o.g.lineWidth = 2;
        o.g.beginPath();
        o.g.moveTo(o.bx, o.by);
        o.g.lineTo(o.bx + Math.cos(a) * 210, o.by + Math.sin(a) * 210);
        o.g.stroke();
        o.g.restore();
      } else {
        const t = (k - 1.0) / 1.6;
        const L = Math.min(1, t * 1.5) * 210;
        dexDot(o, o.bx + Math.cos(a) * L * .5, o.by + Math.sin(a) * L * .5, 6, '#c37bff', 1 - t);
      }
    }
  },
  gaze(o) {
    const k = o.t % 3.6;
    const a = Math.atan2(o.py - o.by, o.px - o.bx) + Math.sin(o.t * .9) * .5;
    const arc = .62;
    if (k < 1.0) {
      /* 蓄能：中轴虚线 */
      o.g.save();
      o.g.setLineDash([10, 9]);
      o.g.strokeStyle = 'rgba(216,180,255,' + (.3 + k * .5).toFixed(2) + ')';
      o.g.lineWidth = 2;
      o.g.beginPath();
      o.g.moveTo(o.bx, o.by);
      o.g.lineTo(o.bx + Math.cos(a) * 200, o.by + Math.sin(a) * 200);
      o.g.stroke();
      o.g.restore();
    } else if (k < 3.2) {
      const fade = Math.min(1, (k - 1.0) / .3, (3.2 - k) / .4);
      o.g.beginPath();
      o.g.moveTo(o.bx, o.by);
      o.g.arc(o.bx, o.by, 200, a - arc * .5, a + arc * .5);
      o.g.closePath();
      o.g.fillStyle = 'rgba(160,100,255,' + (.22 * fade).toFixed(2) + ')';
      o.g.fill();
      o.g.strokeStyle = 'rgba(236,210,255,' + (.5 * fade).toFixed(2) + ')';
      o.g.lineWidth = 2;
      o.g.stroke();
    }
  },
  night(o) {
    const k = o.t % 4.2;
    const fade = Math.min(1, k / .35, (4.2 - k) / .5);
    const a = Math.atan2(o.py - o.by, o.px - o.bx) + Math.sin(o.t * .8) * .45;
    const arc = 1.05;
    /* 整块暗幕挖一个锥：和实机同一套 evenodd 办法 */
    o.g.save();
    o.g.beginPath();
    o.g.rect(0, 0, o.w, o.h);
    o.g.moveTo(o.bx, o.by);
    o.g.arc(o.bx, o.by, 260, a - arc * .5, a + arc * .5, false);
    o.g.closePath();
    o.g.moveTo(o.px + 40, o.py);
    o.g.arc(o.px, o.py, 40, 0, RAD, false);
    o.g.closePath();
    o.g.fillStyle = 'rgba(3,1,9,' + (.95 * fade).toFixed(3) + ')';
    o.g.fill('evenodd');
    o.g.restore();
    if (k > 1.2 && k < 3.4) {
      const t = (k - 1.2) / 2.2;
      dexDot(o, o.bx + Math.cos(a + 1.2) * (60 + t * 150), o.by + Math.sin(a + 1.2) * (60 + t * 150),
        5, '#c37bff', .9 - t * .5);
    }
  },
  pull(o) {
    const k = o.t % 3;
    const cx = (o.px + o.bx) / 2, cy = (o.py + o.by) / 2;
    dexDot(o, cx, cy, 34 + Math.sin(o.t * 6) * 4, o.color, .35);
    o.spx = o.px - (o.px - cx) * Math.min(.75, k * .35);
    o.spy = o.py - (o.py - cy) * Math.min(.75, k * .35);
  },
  beam(o) {
    const t = o.t % 3.4;
    const a = Math.atan2(o.py - o.by, o.px - o.bx);
    const cross = t > 1.4;
    o.g.save();
    o.g.translate((o.bx + o.px) / 2, (o.by + o.py) / 2);
    for (let k = 0; k < 2; k++) {
      const rot = a + k * 1.57 + (cross ? (t - 1.4) * .5 : 0);
      o.g.rotate(k === 0 ? rot - a : rot - a);   /* 简化：逐条旋转 */
      o.g.globalAlpha = t < 1.4 ? .25 + t * .2 : .85;
      o.g.fillStyle = k ? '#8a5cff' : '#b18bff';
      o.g.fillRect(-240, -8, 480, 16);
      o.g.setTransform(1, 0, 0, 1, 0, 0);
      o.g.translate((o.bx + o.px) / 2, (o.by + o.py) / 2);
    }
    o.g.restore();
    o.g.globalAlpha = 1;
  },
  sweep(o) {
    const t = o.t % 2.8;
    const ang = t < 1 ? -1.6 + t * 2.6 : (t < 1.15 ? 1 : Math.max(-1.6, 1 - (t - 1.15) * 2.2));
    for (const side of [-1, 1]) {
      const a = Math.atan2(o.py - o.by, o.px - o.bx) + side * ang * .8;
      o.g.strokeStyle = o.color; o.g.lineWidth = 7;
      o.g.globalAlpha = .8;
      o.g.beginPath();
      o.g.moveTo(o.bx, o.by);
      o.g.lineTo(o.bx + Math.cos(a) * 110, o.by + Math.sin(a) * 110);
      o.g.stroke();
      o.g.globalAlpha = 1;
    }
  },
  slow(o) {
    const t = o.t % 3.6;
    if (t < 2.2) {
      o.g.fillStyle = 'rgba(127,224,255,' + (.06 + Math.sin(t * 4) * .03) + ')';
      o.g.fillRect(0, 0, o.W, o.H);
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * RAD, r = (t * 70) % 130;
        dexDot(o, o.bx + Math.cos(a) * r, o.by + Math.sin(a) * r, 4, '#7fe0ff', .8 - r / 200);
      }
      o.spx = o.px - Math.min(60, t * 12);   /* 玩家挪得慢 */
    }
  },
  snipe(o) {
    const a = Math.atan2(o.py - o.by, o.px - o.bx);
    [0, .5, 1].forEach((off, wv) => {
      const k = ((o.t + off) % 1.6) * 190;
      for (let j = -1; j <= 1; j++) {
        const aa = a + j * .3;
        dexDot(o, o.bx + Math.cos(aa) * k, o.by + Math.sin(aa) * k, 5, o.color, 1 - k / 340);
      }
    });
  },
  ringGap(o) {
    const t = o.t % 3.2;
    const gapA = 1.1;
    if (t < 1.1) { dexWarn(o, o.px, o.py, 46, t / 1.1, o.color); }
    else if (t < 2.6) {
      const r = 20 + (t - 1.1) * 85;
      o.g.strokeStyle = o.color; o.g.lineWidth = 10;
      o.g.globalAlpha = .9 - (t - 1.1) / 2.4;
      o.g.beginPath();
      o.g.arc(o.px, o.py, r, gapA + .55, gapA - .55 + RAD);
      o.g.stroke();
      o.g.globalAlpha = 1;
      o.g.fillStyle = '#7fe0ff';
      o.g.font = '10px sans-serif'; o.g.fillText('缺口', o.px + Math.cos(gapA) * (r + 14) - 10, o.py + Math.sin(gapA) * (r + 14));
    }
  },
};

/* 演示播放：3.6 秒一循环，独立 rAF，关面板就停 */
function dexPlay(cv, key, color) {
  dexStop();
  const fn = DEMOS[key];
  if (!fn) return;
  const g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const t0 = performance.now();
  let last = 0;
  function frame(now) {
    const t = ((now - t0) / 1000) % 3.6;
    if (t < last) { /* 循环重置 */ }
    last = t;
    const o = { g, W, H, bx: W * .34, by: H * .6, px: W * .72, py: H * .4, t, color: color, spx: W * .72, spy: H * .4 };
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#0a0e1a'; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(120,160,240,.09)'; g.lineWidth = 1;
    for (let x = 0; x < W; x += 34) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (let y = 0; y < H; y += 34) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    fn(o);
    dexDot(o, o.bx, o.by, 15, color);
    dexDot(o, o.spx, o.spy, 8, '#7fe0ff');
    DEX_RAF = requestAnimationFrame(frame);
  }
  DEX_RAF = requestAnimationFrame(frame);
}

/* 图鉴界面：左列九 BOSS，右侧卡牌；点卡进演示 */
let DEX_BACK = 'start';
let DEX_VIEW = null;   /* null=卡牌列表 / {key,color,name,desc}=演示 */

function dexBody() {
  const def = BOSSES[DEX_BOSS] || BOSSES.beast;
  if (DEX_VIEW) {
    return '<div class="dexdemo">' +
      '<canvas id="dexcv" width="460" height="230"></canvas>' +
      '<p><b style="color:' + DEX_VIEW.color + '">' + DEX_VIEW.name + '</b>　' + DEX_VIEW.desc + '</p>' +
      '<button class="filbtn" id="dexback2">← 回卡牌</button></div>';
  }
  const card = (name, desc, demo, color, cls) =>
    '<button class="mvcard" data-mv="' + demo + '" data-mc="' + color + '" data-mn="' + name + '" data-md="' + desc + '">' +
    '<b class="' + (cls || '') + '">' + name + '</b><i>' + desc + '</i></button>';
  const ULT_DEMO = { fissure: 'line', sporeRain: 'ring', skyfire: 'spots', blazeRun: 'ring2',
    deepFreeze: 'slow', shadowStorm: 'blink', annihilate: 'beam', devour: 'pull', meteorBreath: 'line',
    chibaku: 'meteor', gaze: 'gaze', longNight: 'night', voidVortex: 'pull', voidWheel: 'night',
    fissureFive: 'line', rockRain: 'spots', stoneArm: 'sweep', titanWrath: 'meteor',
    hiveEncircle: 'ring', hiveFlower: 'charge', hiveVineBarrage: 'line', hiveBloom: 'ring2' };
  const READ_DEMO = { punishClose: 'ringGap', punishFar: 'snipe', punishWeave: 'spots' };
  let h = '';
  if (def.rhythm) {
    /* 0.41.0 四档招式：小招试探 / 连招限制走位 / 中招打伤害+预告 / 大招竭尽全力 */
    const mids = def.mids || [];
    const rhc = def.rhCombos || [];
    h += '<div class="dexgrp" style="color:' + def.color + '">大招 · 竭尽全力</div><div class="mvgrid">' +
      card(ULT_INFO[def.ult].name, ULT_INFO[def.ult].sub, ULT_DEMO[def.ult] || 'ring', def.color, 'ult') + '</div>';
    h += '<div class="dexgrp">中招 ×' + mids.length + '（打伤害 · 大招的预告）</div><div class="mvgrid">' +
      mids.map(uk => card(ULT_INFO[uk].name, ULT_INFO[uk].sub, ULT_DEMO[uk] || 'ring', def.color, 'ult')).join('') + '</div>';
    h += '<div class="dexgrp">连招 ×' + rhc.length + '（限制走位 · 连着放）</div><div class="mvgrid">' +
      rhc.map(mv => card(ATK_INFO[mv].name, ATK_INFO[mv].desc, ATK_INFO[mv].demo, def.color, '')).join('') + '</div>';
    h += '<div class="dexgrp">小招 ×' + def.moves.length + '（试探 · 高频轮转）</div><div class="mvgrid">' +
      def.moves.map(mv => card(ATK_INFO[mv].name, ATK_INFO[mv].desc, ATK_INFO[mv].demo, def.color, '')).join('') + '</div>';
    const mob = def.mobility || [];
    if (mob.length) {
      h += '<div class="dexgrp">位移 ×' + mob.length + '（改写距离 · 快慢变化）</div><div class="mvgrid">' +
        mob.map(mv => card(ATK_INFO[mv].name, ATK_INFO[mv].desc, ATK_INFO[mv].demo, def.color, '')).join('') + '</div>';
    }
  } else {

      '</div>';

/* ---------- BOSS 调试台面板（0.34.0）---------- */
let DEV_TAB = 'global';

function devMovesOf(id) {
  const def = BOSSES[id] || {};
  const arr = (def.moves || []).slice();
  /* 0.42.0：四档招式 + 位移全部进调试台，不再只列小招和大招 */
  (def.rhCombos || []).forEach(m => { if (arr.indexOf(m) < 0) arr.push(m); });
  (def.mobility || []).forEach(m => { if (arr.indexOf(m) < 0) arr.push(m); });
  (def.mids || []).forEach(m => { if (arr.indexOf(m) < 0) arr.push(m); });
  if (def.ult) arr.push(def.ult);
  if (def.ult2) arr.push(def.ult2);
  (def.read || []).forEach(r => { if (arr.indexOf(r) < 0) arr.push(r); });
  return arr;
}

function devDefVal(k) {
  const def = BOSSES[DEV_TAB] || {};
  if (k === 'gap') return def.gap || 2.1;
  if (k === 'keep') return def.keep || 300;
  if (k === 'rest') return 1.5;
  if (k === 'ultGap') return 14;
  if (k === 'spd') return 1;
  if (k === 'restMode') return 0;
  if (k === 'mood') return 1;
  return diff().chain || .2;
}

function devVal(tag) {
  const p = tag.split(':');
  if (p[0] === 'dev') return DEV[p[1]];
  if (p[0] === 'beha') {
    const b = BEHA[DEV_TAB];
    return (b && b[p[1]] !== undefined) ? b[p[1]] : devDefVal(p[1]);
  }
  if (p[0] === 'tune') {
    const t = TUNE[p[1]];
    return (t && t[p[2]] !== undefined) ? t[p[2]] : 1;
  }
  return 1;
}

function devSet(tag, v) {
  const p = tag.split(':');
  if (p[0] === 'dev') DEV[p[1]] = v;
  else if (p[0] === 'beha') { (BEHA[DEV_TAB] = BEHA[DEV_TAB] || {})[p[1]] = v; }
  else if (p[0] === 'tune') { tuneOf(p[1])[p[2]] = v; }
  saveDev();
}

function devFmt(tag, v) {
  if (tag === 'beha:keep') return Math.round(v) + 'px';
  if (tag === 'beha:restMode') return ['自动', '喘息', '压近', '拉扯', '弧步', '拉开'][Math.round(v)] || '自动';
  if (tag === 'beha:spd' || tag === 'beha:chain' || tag === 'beha:mood') return Math.round(v * 100) + '%';
  if (tag.indexOf('beha:') === 0) return v.toFixed(2) + 's';
  return v.toFixed(2) + '×';
}

function devRow(tag, label, val, mn, mx, step, sc) {
  const raw = Math.round(val * sc);
  return '<div class="setrow"><span>' + label + '</span>' +
    '<input type="range" data-t="' + tag + '" data-sc="' + sc + '" min="' + Math.round(mn * sc) +
    '" max="' + Math.round(mx * sc) + '" step="' + step + '" value="' + raw + '">' +
    '<b data-l="' + tag + '">' + devFmt(tag, val) + '</b></div>';
}

function devHTML() {
  if (DEV_TAB === 'global') {
    let h = '<h3>全局倍率 <time>所有 BOSS · 所有招一起乘</time></h3>' +
      '<div class="avtip">先在这里快速把整体调狠或调软，再进具体 BOSS 微调单招</div>';
    const rows = [
      ['warn', '前摇时长'], ['dmg', '招式伤害'], ['size', '范围 / 体积'], ['gap', '出招间隔'],
      ['rest', '硬直时长'], ['hp', 'BOSS 血量'], ['spd', '弹速'], ['chain', '连段概率'],
    ];
    rows.forEach(it => { h += devRow('dev:' + it[0], it[1], DEV[it[0]], .2, 3, .05, 100); });
    h += '<div class="setrow"><span>全部恢复默认</span>' +
      '<button class="filbtn" data-rst="all">恢复 1.00×</button></div>' +
      '<div class="avtip">倍率是「乘法」：前摇 0.70× 让所有招更好读，伤害 1.50× 让所有招更疼</div>';

  }

  const def = BOSSES[DEV_TAB] || {};
  let h = '<h3>' + (def.name || DEV_TAB) + ' <time>行为参数</time></h3>' +
    '<div class="avtip">改完立刻生效（下一次出招）；存本机，不改进游戏默认值</div>';
  const beha = [
    ['gap', '出招间隔', .3, 8, .05, 100],
    ['rest', '硬直时长', 0, 6, .1, 100],
    ['ultGap', '大招间隔', 2, 40, .5, 100],
    ['keep', '保持距离', 60, 600, 10, 1],
    ['spd', '移动速度', .3, 2.5, .05, 100],
    ['chain', '连段概率', 0, 1, .05, 100],
    ['restMode', '硬直姿态', 0, 5, 1, 1],
    ['mood', '换向频率', .5, 2, .1, 100],
  ];
  beha.forEach(it => { h += devRow('beha:' + it[0], it[1], devVal('beha:' + it[0]), it[2], it[3], it[4], it[5]); });
  h += '<div class="setrow"><span>本家恢复默认</span>' +
    '<button class="filbtn" data-rst="boss">恢复</button></div>';

  h += '<h3>招式倍率 <time>点开单招，调前摇 / 伤害 / 范围</time></h3>';
  const mvs = devMovesOf(DEV_TAB);
  if (!mvs.length) h += '<div class="avtip">这家还没有招表</div>';
  mvs.forEach(mv => {
    const nm = (ATK_INFO[mv] && ATK_INFO[mv].name) || (ULT_INFO[mv] && ULT_INFO[mv].name) ||
      (READ_INFO[mv] && READ_INFO[mv].name) || mv;
    h += '<details style="border-top:1px solid rgba(255,255,255,.06)">' +
      '<summary style="cursor:pointer;padding:8px 0;font-size:12.5px;color:#ffd8e0">' + nm +
      ' <small style="color:#7b89ad;font-size:10px">' + mv + '</small></summary>';
    [['warm', '前摇'], ['dmg', '伤害'], ['size', '范围']].forEach(a => {
      h += devRow('tune:' + mv + ':' + a[0], a[1], devVal('tune:' + mv + ':' + a[0]), .2, 3, .05, 100);
    });
    h += '</details>';
  });
  return h;
}

function wireDevBody() {
  const body = document.getElementById('devbody');
  if (!body || body.dataset.wired) return;      /* 只绑一次，切 BOSS 只换 innerHTML */
  body.dataset.wired = '1';
  body.addEventListener('input', ev => {
    const t = ev.target;
    const tag = t.getAttribute && t.getAttribute('data-t');
    if (!tag) return;
    const sc = +(t.getAttribute('data-sc') || 100);
    const v = (+t.value) / sc;
    devSet(tag, v);
    const lab = body.querySelector('[data-l="' + tag + '"]');
    if (lab) lab.textContent = devFmt(tag, v);
  });
  body.addEventListener('click', ev => {
    let el = ev.target;
    while (el && el !== body && !(el.getAttribute && el.getAttribute('data-rst'))) el = el.parentNode;
    if (!el || el === body) return;
    const what = el.getAttribute('data-rst');
    if (what === 'all') {
      Object.keys(DEV).forEach(k => { if (k !== 'on') DEV[k] = 1; });
      Object.keys(TUNE).forEach(k => delete TUNE[k]);
      Object.keys(BEHA).forEach(k => delete BEHA[k]);
      TUNE_DEF.warm = 1; TUNE_DEF.dmg = 1; TUNE_DEF.size = 1;
    } else if (what === 'boss') {
      delete BEHA[DEV_TAB];
      devMovesOf(DEV_TAB).forEach(mv => { delete TUNE[mv]; });
    }
    saveDev();
    body.innerHTML = devHTML();
    SFX.pick();
  });
}

function wireSettings() {
  const bind = (id, key, store, onChange) => {
    const e = document.getElementById(id);
    if (!e) return;
    e.addEventListener('input', ev => {
      const v = +ev.target.value;
      SET[key] = v / 100;
      const lab = document.getElementById(id + 'v');
      if (lab) lab.textContent = v + '%';
      try { localStorage.setItem(store, SET[key]); } catch (err) { }
      if (onChange) onChange();
    });
  };
  bind('shk', 'shake', 'sv_shake');
  bind('fov', 'fov', 'sv_fov', applyLayout);
  bind('bav', 'bAlpha', 'sv_balpha');

  const seg = document.getElementById('segui');
  if (seg) {
    seg.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        SET.ui = b.getAttribute('data-ui');
        try { localStorage.setItem('sv_ui', SET.ui); } catch (err) { }
        applyLayout();
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      });
    });
  }

  const lay = document.getElementById('seglay');
  if (lay) {
    lay.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        SET.bLayer = b.getAttribute('data-lay');
        try { localStorage.setItem('sv_blayer', SET.bLayer); } catch (err) { }
        lay.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        SFX.pick();
      });
    });
  }

  const sfx = document.getElementById('segsfx');
  if (sfx) {
    sfx.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const on = b.getAttribute('data-sfx') === '1';
        SFX.muted = !on;
        try { localStorage.setItem('sv_mute', SFX.muted ? '1' : '0'); } catch (err) { }
        sfx.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        if (on) { SFX.boot(); SFX.pick(); }
      });
    });
  }

  const bgmSeg = document.getElementById('segbgm');
  if (bgmSeg) {
    bgmSeg.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const on = b.getAttribute('data-bgm') === '1';
        BGM.setOn(on);
        bgmSeg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      });
    });
  }

  const bvol = document.getElementById('bgmvol');
  if (bvol) bvol.addEventListener('input', ev => {
    BGM.setVol((+ev.target.value) / 100);
    const lab = document.getElementById('bgmvolv');
    if (lab) lab.textContent = ev.target.value + '%';
  });
  const svol = document.getElementById('sfxvol');
  if (svol) svol.addEventListener('input', ev => {
    SFX.setVol((+ev.target.value) / 100);
    const lab = document.getElementById('sfxvolv');
    if (lab) lab.textContent = ev.target.value + '%';
    SFX.pick();   /* 即时试听一声 */
  });

  const hint = document.getElementById('seghint');
  if (hint) {
    hint.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        SET.hints = b.getAttribute('data-hint') === '1';
        try { localStorage.setItem('sv_hints', SET.hints ? '1' : '0'); } catch (err) { }
        hint.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      });
    });
  }

  const lb = document.getElementById('logbtn');
  if (lb) lb.addEventListener('click', () => showChangelog(true));

  /* 游戏强度：狂潮四滑杆（百分比）+ 武器数量（整数把），改完存本机 */
  ['pd', 'ph', 'eh', 'ed'].forEach(k => {
    const e = document.getElementById('bal-' + k);
    if (!e) return;
    e.addEventListener('input', ev => {
      BALANCE[k] = (+ev.target.value) / 100;
      const lab = document.getElementById('bal-' + k + 'v');
      if (lab) lab.textContent = ev.target.value + '%';
      try { localStorage.setItem('sv_balance', JSON.stringify(BALANCE)); } catch (err) { }
    });
  });
  const we = document.getElementById('bal-wm');
  if (we) we.addEventListener('input', ev => {
    BALANCE.wm = Math.round(+ev.target.value);
    const lab = document.getElementById('bal-wmv');
    if (lab) lab.textContent = BALANCE.wm + ' 把';
    try { localStorage.setItem('sv_balance', JSON.stringify(BALANCE)); } catch (err) { }
  });
  const br = document.getElementById('balreset');
  if (br) br.addEventListener('click', () => {
    BALANCE.pd = .12; BALANCE.ph = .07; BALANCE.eh = .18; BALANCE.ed = .08; BALANCE.wm = 6;
    try { localStorage.removeItem('sv_balance'); } catch (err) { }
    showSettings(SET_BACK || 'start');
  });
  const db = document.getElementById('dexbtn');
  if (db) db.addEventListener('click', () => showDex(true));

  /* 开发者模式开关 + 调试台入口（0.34.0） */
  const segDev = document.getElementById('segdev');
  if (segDev) {
    segDev.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        DEV.on = b.getAttribute('data-dev') === '1';
        saveDev();
        showSettings(SET_BACK || 'start');
      });
    });
  }
  const dvt = document.getElementById('devbtn');
  if (dvt) dvt.addEventListener('click', () => showDev());
  const arb = document.getElementById('arenabtn');
  if (arb) arb.addEventListener('click', () => showArena());
}

/* 设置是一个独立面板：主菜单、暂停、游戏中右上角都能进 */
let SET_BACK = 'start';

function showSettings(back) {
  if (back) SET_BACK = back;
  if (S.mode === 'play') { S.mode = 'settings'; joy = null; }
  else if (S.mode !== 'settings') S.mode = 'settings';
  showOverlay(
    '<h1>设置</h1>' +
    '<p style="margin-bottom:8px">全部存在本机，下次打开还在</p>' +
    settingsHTML() +
    '<div style="margin-top:20px"><button class="btn" id="setback">返回</button></div>'
  );
  wireSettings();
  document.getElementById('setback').onclick = () => {
    if (SET_BACK === 'game') { S.mode = 'play'; setMenuMode(false); closeOverlay(); }
    else if (SET_BACK === 'pause') pauseGame();
    else if (SET_BACK === 'over') gameOverPanelOnly();
    else showStart();
  };
}

function pauseGame() {
  /* 从设置面板返回时也走这里，所以要放开 settings 状态 */
  if (S.mode === 'pause') return;
  if (S.mode !== 'play' && S.mode !== 'settings') return;
  S.mode = 'pause';
  joy = null;
  const total = currentWaves().length;
  const where = S.runMode === 'rush'
    ? ('狂潮 · 第 ' + (S.rushWave || 1) + ' 轮 · 同屏 BOSS ' + rushBossGroups() + '/' + (S.bossCap || 1))
    : (S.stage.name + ' · 第 ' + Math.min(S.waveIdx + 1, total) + '/' + total + ' 波');
  showOverlay(
    '<h1>已暂停</h1>' +
    '<p><span style="color:' + diff().color + '">' + diff().name + '</span> · ' + where + '<br>' +
    '存活 ' + fmtTime(S.t) + ' · 击杀 ' + S.kills + ' · Lv.' + S.level + ' · 峰值秒伤 ' + Math.round(S.dpsPeak) + '<br>' +
    '本局金币 ' + S.coins + '</p>' +
    '<div class="keys"><span>ESC / P 继续</span><span>切到别的窗口会自动暂停</span></div>' +
    '<button class="btn" id="resume">继续</button>' +
    '<button class="btn ghost" id="cfg">设置</button>' +
    '<button class="btn ghost" id="restart">重开</button>' +
    '<button class="btn ghost" id="quit">退出</button>'
  );
  document.getElementById('resume').onclick = resumeGame;
  document.getElementById('cfg').onclick = () => showSettings('pause');
  document.getElementById('restart').onclick = () => startGame(RUN.mode, RUN.stage);
  document.getElementById('quit').onclick = () => {
    META.gold += S.coins;
    S.coins = 0;
    metaSave();
    showStart();
  };
}

function resumeGame() {
  if (S.mode !== 'pause') return;
  S.mode = 'play';
  closeOverlay();
}

/* ---------- 主菜单 ---------- */
let PICK = (function () {
  try {
    const p = localStorage.getItem('sv_mode');
    if (p === 'endless' || p === 'stage' || p === 'rush') return p;
  } catch (e) { }
  return 'endless';
})();
let PICKD = (function () {
  try {
    const d = localStorage.getItem('sv_diff');
    if (d && DIFFS[d]) return d;
  } catch (e) { }
  return 'normal';
})();

/* 难度条：主菜单和选关界面共用 */
function diffBarHTML() {
  return '<div class="diffbar" id="diffbar">' +
    Object.keys(DIFFS).map(k => {
      const d = DIFFS[k];
      return '<button data-d="' + k + '" class="' + (PICKD === k ? 'on' : '') + '" ' +
        'style="--dc:' + d.color + '">' + d.name + '</button>';
    }).join('') +
    '</div>' +
    '<p class="dsub" id="dsub">' + DIFFS[PICKD].sub + ' · 金币 ×' + DIFFS[PICKD].gold + '</p>';

function wireDiffBar(onChange) {
  document.querySelectorAll('#diffbar button').forEach(b => {
    b.onclick = () => {
      PICKD = b.getAttribute('data-d');
      try { localStorage.setItem('sv_diff', PICKD); } catch (err) { }
      SFX.pick();
      onChange();
    };
  });
}

/* 狂潮模式的同屏上限档位（只在选中狂潮时出现） */

function wireRushCap() {

    '</div>' +
    '<div class="avtip">照片只存在这台设备上，会自动裁成圆形头像</div>' +
    '<div class="setsec">玩法</div>' +
    '<div class="modebar">' +
    '<button data-m="endless" class="' + (PICK === 'endless' ? 'on' : '') + '">阶段无尽<small>清完一波再刷下一波</small></button>' +
    '<button data-m="stage" class="' + (PICK === 'stage' ? 'on' : '') + '">关卡模式<small>自己选关，打完 BOSS 通关</small></button>' +

  document.querySelectorAll('.charcard').forEach(b => {
    b.onclick = () => {
      PICKC = b.getAttribute('data-c');
      try { localStorage.setItem('sv_char', PICKC); } catch (err) { }
      SFX.pick();
      applyAvatar();

  /* 头像上传 */

/* ---------- 关卡选择 ---------- */
function showStageSelect() {
  S.mode = 'select';
  let html = '<h1>选择关卡</h1>' +
    '<div class="goldbar"><span>金币 ' + META.gold + '</span><span style="color:#8ea0c6;font-size:12px">已通关 ' + META.cleared + '/' + STAGES.length + '</span></div>' +
    diffBarHTML() +
    '<div class="stages">';
  for (let i = 0; i < STAGES.length; i++) {
    const st = STAGES[i];
    const th = THEMES[st.theme];
    const locked = i > META.cleared;
    const done = i < META.cleared;
    const bosses = st.waves[st.waves.length - 1].boss;
    html += '<button class="stagecard' + (locked ? ' lock' : '') + '" data-i="' + i + '">' +
      '<span class="dotc" style="background:' + th.accent + '"></span>' +
      '<span style="flex:1 1 auto;min-width:0"><b>' + (i + 1) + '. ' + st.name + '</b>' +
      '<small>' + (locked ? '通关上一关后解锁' : st.intro) + '</small></span>' +
      '<span class="tag">' + (done ? '✓ ' : '') + (bosses.length > 1 ? '双BOSS' : 'BOSS') + ' · ' + st.reward + '</span>' +
      '</button>';
  }
  html += '</div><button class="btn" id="back">返回</button>';
  showOverlay(html);
  wireDiffBar(showStageSelect);
  document.querySelectorAll('.stagecard').forEach(b => {
    b.onclick = () => {
      const i = +b.getAttribute('data-i');
      if (i > META.cleared) { SFX.alarm(); return; }
      startGame('stage', i);
    };
  });
  document.getElementById('back').onclick = showStart;
}

/* ---------- 永久强化商店 ---------- */
function showShop() {
  S.mode = 'shop';
  const rows = UPGRADES.map(u => {
    const l = upLevel(u.id);
    const max = l >= u.max;
    const c = upCost(u);
    const afford = META.gold >= c;
    return '<div class="shoprow">' +
      '<span class="nm2"><b>' + u.name + '</b><small>' + u.desc + '　当前 ' + u.fmt(l) + '</small></span>' +
      '<span class="lv">Lv.' + l + '/' + u.max + '</span>' +
      '<button data-u="' + u.id + '"' + (max || !afford ? ' disabled' : '') + '>' +
      (max ? '已满' : c + ' 金币') + '</button>' +
      '</div>';
  }).join('');
  showOverlay(
    '<h1>永久强化</h1>' +
    '<div class="goldbar"><span>金币 ' + META.gold + '</span><span style="color:#8ea0c6;font-size:11px">每局结束都会获得</span></div>' +
    '<div class="shopwrap">' + rows + '</div>' +
    '<button class="btn" id="back">返回</button>'
  );
  document.querySelectorAll('.shoprow button').forEach(b => {
    b.onclick = () => {
      if (buyUpgrade(b.getAttribute('data-u'))) showShop();
    };
  });
  document.getElementById('back').onclick = showStart;
}

/* ---------- 阶段完成 ---------- */
function showStageClear() {
  const isStage = S.runMode === 'stage';
  const th = stageTheme();
  const last = !isStage ? false : (S.stageIdx >= STAGES.length - 1);
  let html = '<h1 style="color:' + th.accent + '">' + (isStage ? (last ? '全部通关' : '关卡完成') : '阶段 ' + (S.loop + 1) + ' 完成') + '</h1>' +
    '<p>' + S.stage.name + ' · 用时 ' + fmtTime(S.t) + ' · 击杀 ' + S.kills +
    '　<span style="color:' + diff().color + '">' + diff().name + '难度</span></p>' +
    '<div class="stat">' +
    '<div>本局金币<b>+' + (S.clearCoins || 0) + '</b></div>' +
    '<div>通关奖励<b>+' + (S.clearReward || 0) + '</b></div>' +
    '<div>总金币<b>' + META.gold + '</b></div>' +
    '</div>';
  if (isStage && last) {
    html += '<p style="color:#ffd24a">六张地图全部打完，你就是幸存者。</p>' +
      '<div style="margin-top:16px"><button class="btn" id="home">返回主菜单</button>' +
      '<button class="btn ghost" id="again">再打一次</button></div>';
  } else if (isStage) {
    const nextLocked = S.stageIdx + 1 > META.cleared;
    html += '<div style="margin-top:16px"><button class="btn" id="next">' +
      (nextLocked ? '下一关：' + STAGES[S.stageIdx + 1].name : '继续下一关') + '</button>' +
      '<button class="btn ghost" id="home">返回主菜单</button></div>';
  } else {
    html += '<div style="margin-top:16px"><button class="btn" id="next">进入下一阶段</button>' +
      '<button class="btn ghost" id="home">返回主菜单</button></div>';
  }
  showOverlay(html);
  const nx = document.getElementById('next');
  if (nx) nx.onclick = () => {
    if (isStage) startGame('stage', Math.min(STAGES.length - 1, S.stageIdx + 1));
    else { nextStageLoop(); S.mode = 'play'; closeOverlay(); }
  };
  document.getElementById('home').onclick = showStart;
  const ag = document.getElementById('again');
  if (ag) ag.onclick = () => startGame('stage', S.stageIdx);
}

function startGame(mode, stageIdx) {
  lbHighlight = null;
  const md = mode || RUN.mode || 'endless';
  const si = stageIdx !== undefined ? stageIdx : (mode ? 0 : (RUN.stage | 0));
  newGame(md, si);
  S.mode = 'play';
  setMenuMode(false);
  closeOverlay();
}

function gameOver() {
  S.mode = 'over';
  S.shake = 18;
  S.hurtFlash = 1;
  SFX.over();
  META.gold += S.coins;
  metaSave();
  const res = lbSubmit();
  let sub;
  if (res.rank === 1 && res.isBest && LB.rows.length > 1) sub = '新纪录！本机第 1 名';
  else if (res.rank === 1) sub = '第一条记录 · 本机第 1 名';
  else if (res.isBest) sub = '刷新最好成绩 · 本机第 ' + res.rank + ' 名';
  else sub = '本机第 ' + res.rank + ' 名';
  lbHighlight = res.row;
  const where = S.runMode === 'rush'
    ? ('狂潮 · 第 ' + (S.rushWave || 1) + ' 轮 · ' + (S.stage ? S.stage.name : ''))
    : (S.stage.name + ' · 第 ' + Math.min(S.waveIdx + 1, currentWaves().length) + '/' + currentWaves().length + ' 波');
  showOverlay(
    '<h1>你倒下了</h1>' +
    '<p class="dsub" style="color:' + diff().color + '">' + diff().name + ' · ' + where + '</p>' +
    '<div class="scorebig">' + res.row.s + '</div>' +
    '<div class="scoresub' + (res.isBest ? ' hot' : '') + '">' + sub + '</div>' +
    '<div class="stat">' +
    '<div>存活时间<b>' + fmtTime(S.t) + '</b></div>' +
    '<div>击杀<b>' + S.kills + '</b></div>' +
    '<div>等级<b>Lv.' + S.level + '</b></div>' +
    '<div>峰值秒伤<b>' + Math.round(S.dpsPeak) + '</b></div>' +
    '</div>' +
    '<p>本局金币 <span style="color:#ffd24a">+' + S.coins + '</span>　总金币 <span style="color:#ffd24a">' + META.gold + '</span>　总伤害 ' + Math.round(S.dmgTotal) + '</p>' +
    '<div style="margin-top:18px"><button class="btn" id="again">再来一局</button>' +
    '<button class="btn ghost" id="tolb">排行榜</button></div>'
  );
  document.getElementById('again').onclick = () => startGame(RUN.mode, RUN.stage);
  document.getElementById('tolb').onclick = () => showLeaderboard('over');
}

  document.getElementById('tolb').onclick = () => showLeaderboard('over');
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 30) dt = 1 / 30;
  if (S.mode === 'play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('pauseBtn').addEventListener('click', pauseGame);
document.getElementById('cfgBtn').addEventListener('click', () => {
  if (S.mode === 'play') showSettings('game');
  else if (S.mode === 'pause') showSettings('pause');
  else if (S.mode === 'start') showSettings('start');
});
document.getElementById('muteBtn').addEventListener('click', toggleMute);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.getElementById('muteBtn').textContent = SFX.muted ? '静音' : '音效';
window.addEventListener('resize', resize);

resize();
newGame();
showStart();
/* 每台机第一次打开（或更新到新版本后第一次）自动弹一次更新日志 */
try {
  if (localStorage.getItem('sv_logver') !== CHANGELOG[0].v) {
    LOG_SEL = CHANGELOG[0].v;
    showChangelog();
  }
} catch (e) { }
requestAnimationFrame(loop);
</script>
</body>
</html>
